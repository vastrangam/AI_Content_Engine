<style>
/* ═══════════ Vastrangam AI Engine — self-contained styles (no CDN, works offline) ═══════════ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p1:#5B2D8E; --p2:#7B3FBE; --p3:#9B6FD8; --p4:#C9A8F5;
  --gold:#C4975A; --gold-d:#A87C3F;
  --ink:#1A0B38; --mut:#6B5A86; --hint:#8B79A8;
  --bg:#F4F0FB; --surf:#EDE8F8; --surf2:#F8F5FF; --card:#FFFFFF;
  --line:#E2D8F2; --line2:#D3C4EC;
  --grn:#2E9E6B; --grn-s:#E4F6EC; --red:#C0392B; --red-s:#FBEAE8;
  --amb:#C77E28; --amb-s:#FBF0DF; --blu:#3A6EA5; --blu-s:#E7EFF8;
  --shadow:0 1px 2px rgba(40,20,70,.06),0 4px 16px rgba(40,20,70,.06);
  --shadow-lg:0 8px 40px rgba(40,20,70,.16);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --r2:14px; --hh:58px;
}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
svg{display:block}
::selection{background:var(--p4)}

/* ─── header ─── */
#top{position:sticky;top:0;z-index:40;height:var(--hh);display:flex;align-items:center;gap:14px;
  padding:0 18px;background:linear-gradient(100deg,#4A2178 0%,#5B2D8E 45%,#7B3FBE 100%);color:#fff;
  box-shadow:0 2px 14px rgba(40,20,70,.28)}
#top .brand{display:flex;align-items:center;gap:11px;min-width:0}
#top .brand img{height:38px;width:auto;display:block;border-radius:7px;background:#1A0B38;padding:3px}
#top .brand .nm{display:flex;flex-direction:column;line-height:1.05;min-width:0}
#top .brand .nm b{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
#top .brand .nm span{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#E7D9F7;font-weight:600}
#top .appchip{margin-left:6px;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.14);
  font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
#top .appchip svg{width:14px;height:14px}
#top .grow{flex:1}
#top .lbl{display:flex;gap:2px;background:rgba(0,0,0,.16);border-radius:9px;padding:3px}
#top .lbl button{border:0;background:transparent;color:#E7D9F7;font-size:11.5px;font-weight:600;
  padding:5px 11px;border-radius:7px;cursor:pointer;font-family:var(--sans)}
#top .lbl button.on{background:var(--gold);color:#2A1400}
#top .tbtn{border:0;background:rgba(255,255,255,.14);color:#fff;width:34px;height:34px;border-radius:8px;
  cursor:pointer;display:grid;place-items:center}
#top .tbtn svg{width:17px;height:17px}
#top .saved{font-size:11px;color:#E7D9F7;display:flex;align-items:center;gap:6px;white-space:nowrap}
#top .saved b{width:7px;height:7px;border-radius:50%;background:#7BE0A8;display:inline-block}
#top .saved.warn b{background:#F5C451}
#hamb{display:none}

/* ─── layout ─── */
#shell{display:flex;min-height:calc(100vh - var(--hh))}
#nav{width:236px;flex-shrink:0;background:var(--surf2);border-right:1px solid var(--line);
  padding:14px 10px 40px;overflow-y:auto;position:sticky;top:var(--hh);height:calc(100vh - var(--hh))}
#nav .grp{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--hint);
  padding:14px 12px 6px}
#nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;color:var(--mut);
  font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:1px}
#nav a svg{width:17px;height:17px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.9}
#nav a:hover{background:var(--surf)}
#nav a.on{background:linear-gradient(90deg,var(--p1),var(--p2));color:#fff;box-shadow:0 3px 10px rgba(91,45,142,.3)}
#nav a .badge{margin-left:auto;background:var(--surf);color:var(--mut);font-size:10.5px;font-weight:700;
  padding:1px 7px;border-radius:9px}
#nav a.on .badge{background:rgba(255,255,255,.22);color:#fff}
#navback{display:none}
#main{flex:1;min-width:0;padding:22px 26px 80px;max-width:1240px}

/* ─── typography / heads ─── */
.h{margin-bottom:16px}
.h .crumb{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold-d)}
.h h1{font-family:var(--serif);font-size:26px;font-weight:700;margin:2px 0 3px;letter-spacing:.2px}
.h p{color:var(--mut);font-size:13.5px;max-width:760px}

/* ─── cards / kpis ─── */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.kpis.k5{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .ic{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;opacity:.9}
.kpi .ic svg{width:16px;height:16px;stroke-width:2;fill:none}
.kpi .l{font-size:11.5px;color:var(--mut);font-weight:600;letter-spacing:.2px}
.kpi .v{font-size:23px;font-weight:800;font-family:var(--serif);margin:5px 0 1px;letter-spacing:.3px}
.kpi .d{font-size:11.5px;color:var(--hint)}
.kpi .v.g{color:var(--grn)} .kpi .v.r{color:var(--red)} .kpi .v.a{color:var(--amb)}
.tone-teal{background:var(--p1)!important} .tone-teal .ic{background:var(--surf);color:var(--p1)}
.tone-gold .ic{background:var(--amb-s);color:var(--amb)}
.tone-green .ic{background:var(--grn-s);color:var(--grn)}
.tone-blue .ic{background:var(--blu-s);color:var(--blu)}
.tone-red .ic{background:var(--red-s);color:var(--red)}
.tone-violet .ic{background:#EFE4FB;color:var(--p2)}
.tone-peach .ic{background:var(--amb-s);color:var(--amb)}

/* ─── panels ─── */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px 17px;box-shadow:var(--shadow);margin-bottom:14px}
.panel > .ph{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14.5px;margin-bottom:12px;font-family:var(--serif)}
.panel > .ph .badge{font-family:var(--sans);font-weight:700;font-size:11px;background:var(--surf);color:var(--mut);padding:2px 9px;border-radius:9px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.hint{color:var(--hint);font-size:12px;line-height:1.5}
.big{font-size:15px;font-weight:600}

/* ─── tables ─── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--hint);
  font-weight:700;padding:7px 10px;border-bottom:2px solid var(--line)}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surf2)}
.tbl .mono{font-family:var(--mono);font-size:12px}
.tbl .g{color:var(--grn)} .tbl .r-{color:var(--red)} .tbl .a{color:var(--amb)}
.tblwrap{overflow-x:auto}

/* ─── buttons ─── */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card);
  color:var(--ink);font-size:13px;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer;font-family:var(--sans);white-space:nowrap;transition:.12s}
.btn:hover{border-color:var(--p3);background:var(--surf2)}
.btn svg{width:15px;height:15px;stroke-width:2;fill:none}
.btn.p{background:linear-gradient(96deg,var(--p1),var(--p2));border-color:transparent;color:#fff;box-shadow:0 3px 12px rgba(91,45,142,.28)}
.btn.p:hover{filter:brightness(1.07)}
.btn.gold{background:linear-gradient(96deg,var(--gold),var(--gold-d));border-color:transparent;color:#2A1400}
.btn.d{color:var(--red);border-color:#EBC7C2}
.btn.d:hover{background:var(--red-s)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.gh{background:transparent;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ─── chips / tags ─── */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;line-height:1.6}
.t-grn{background:var(--grn-s);color:var(--grn)} .t-red{background:var(--red-s);color:var(--red)}
.t-amb{background:var(--amb-s);color:var(--amb)} .t-blu{background:var(--blu-s);color:var(--blu)}
.t-gray{background:var(--surf);color:var(--mut)} .t-vio{background:#EFE4FB;color:var(--p2)}
.t-gold{background:#F6ECD8;color:var(--gold-d)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;background:var(--surf);
  color:var(--mut);font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent}
.chip:hover{background:var(--surf)}
.chip.on{background:linear-gradient(96deg,var(--p1),var(--p2));color:#fff}
.chiprow{display:flex;gap:7px;flex-wrap:wrap}

/* ─── forms ─── */
.form{display:grid;gap:12px}
.form.f2{grid-template-columns:1fr 1fr} .form.f3{grid-template-columns:1fr 1fr 1fr} .form.f4{grid-template-columns:1fr 1fr 1fr 1fr}
@media(max-width:760px){.form.f2,.form.f3,.form.f4{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.full{grid-column:1/-1}
.fld label{font-size:11.5px;font-weight:600;color:var(--mut)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font-size:13.5px;
  font-family:var(--sans);color:var(--ink);background:var(--surf2);outline:none;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--p2);background:#fff;box-shadow:0 0 0 3px rgba(123,63,190,.12)}
.fld textarea{resize:vertical;min-height:70px;line-height:1.5}

/* ─── kv / cascade / bars ─── */
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0} .kv span{color:var(--mut)} .kv b{font-weight:700}
.cascade{background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13px}
.cl{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
.cl .d{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--p2);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.bar{height:8px;border-radius:5px;background:var(--surf);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--gold));border-radius:5px}
.note{background:var(--surf2);border:1px dashed var(--line2);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--mut);margin-bottom:12px}
.empty{text-align:center;color:var(--hint);padding:34px 10px;font-size:13px}
.good{background:var(--grn-s);border-left:4px solid var(--grn);border-radius:8px;padding:11px 13px;font-size:13px;margin-top:10px}
.warn{background:var(--amb-s);border-left:4px solid var(--amb);border-radius:8px;padding:11px 13px;font-size:13px;margin-top:10px}
.rulebox{background:#F6ECD8;border-left:4px solid var(--gold);border-radius:8px;padding:11px 13px;font-size:13px;margin-top:10px}
.codeblk{background:#231242;color:#EADFFB;border-radius:10px;padding:13px 15px;font-family:var(--mono);font-size:12px;line-height:1.6;overflow-x:auto;white-space:pre;position:relative}
.codeblk .cp{position:absolute;top:8px;right:8px}
pre.out{background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-family:var(--mono);
  font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:460px;overflow:auto}

/* ─── toast / modal ─── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);z-index:120;
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;z-index:110;background:rgba(26,11,56,.5);display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:86vh;overflow:auto;box-shadow:var(--shadow-lg)}
#modal .box .mh{padding:16px 20px;border-bottom:1px solid var(--line);font-family:var(--serif);font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center}
#modal .box .mb{padding:18px 20px}

/* ─── assistant dock ─── */
#askbtn{position:fixed;right:22px;bottom:22px;z-index:90;height:54px;padding:0 20px;border:0;border-radius:28px;
  background:linear-gradient(96deg,var(--gold),var(--p2));color:#fff;font-weight:700;font-size:14px;cursor:pointer;
  box-shadow:0 6px 22px rgba(91,45,142,.4);display:flex;align-items:center;gap:9px}
#askbtn svg{width:19px;height:19px}
#ask{position:fixed;right:0;top:0;bottom:0;width:400px;max-width:92vw;z-index:100;background:#fff;
  box-shadow:-8px 0 40px rgba(40,20,70,.22);display:flex;flex-direction:column;transform:translateX(102%);transition:.28s cubic-bezier(.3,.7,.3,1)}
#ask.show{transform:translateX(0)}
#ask .ah{padding:15px 18px;background:linear-gradient(100deg,var(--p1),var(--p2));color:#fff;display:flex;align-items:center;gap:11px}
#ask .ah img{height:32px;border-radius:7px;background:#1A0B38;padding:2px}
#ask .ah .t{flex:1;min-width:0}
#ask .ah .t b{font-family:var(--serif);font-size:15px;display:block}
#ask .ah .t span{font-size:11px;color:#E7D9F7}
#ask .ah .x{border:0;background:rgba(255,255,255,.16);color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
#ask .body{flex:1;overflow-y:auto;padding:16px 16px 6px;background:var(--bg)}
#ask .msg{margin-bottom:13px;display:flex;gap:9px;max-width:100%}
#ask .msg .av{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;font-size:13px}
#ask .msg.you{flex-direction:row-reverse}
#ask .msg .bub{padding:10px 13px;border-radius:13px;font-size:13px;line-height:1.55;max-width:82%}
#ask .msg.ai .av{background:linear-gradient(96deg,var(--p2),var(--gold));color:#fff}
#ask .msg.ai .bub{background:#fff;border:1px solid var(--line);border-top-left-radius:4px}
#ask .msg.you .av{background:var(--surf);color:var(--p2)}
#ask .msg.you .bub{background:linear-gradient(96deg,var(--p1),var(--p2));color:#fff;border-top-right-radius:4px}
#ask .bub b{font-weight:700}
#ask .bub .src{display:block;margin-top:7px;font-size:11px;color:var(--hint);border-top:1px solid var(--line);padding-top:6px}
#ask .msg.you .bub .src{color:#E7D9F7;border-color:rgba(255,255,255,.2)}
#ask .bub code{background:var(--surf);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:11.5px}
#ask .msg.you .bub code{background:rgba(255,255,255,.2)}
#ask .sugg{padding:0 16px 8px;display:flex;gap:7px;flex-wrap:wrap}
#ask .sugg button{border:1px solid var(--line2);background:#fff;color:var(--p2);font-size:11.5px;font-weight:600;
  padding:5px 10px;border-radius:16px;cursor:pointer;font-family:var(--sans)}
#ask .sugg button:hover{background:var(--surf2)}
#ask .foot{padding:11px 14px;border-top:1px solid var(--line);background:#fff}
#ask .foot .row{display:flex;gap:8px}
#ask .foot input{flex:1;border:1px solid var(--line2);border-radius:22px;padding:10px 15px;font-size:13.5px;outline:none;font-family:var(--sans);background:var(--surf2)}
#ask .foot input:focus{border-color:var(--p2);background:#fff}
#ask .foot button{border:0;background:linear-gradient(96deg,var(--p1),var(--p2));color:#fff;width:42px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
#ask .foot button svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2}
#ask .foot .prov{font-size:10.5px;color:var(--hint);margin-top:7px;text-align:center}
#ask .foot .prov b{color:var(--grn)} #ask .foot .prov a{color:var(--p2);cursor:pointer;text-decoration:underline}

/* ─── studio-specific ─── */
.studio{display:grid;grid-template-columns:1fr 264px;gap:14px}
@media(max-width:1000px){.studio{grid-template-columns:1fr}}
.stage{background:repeating-conic-gradient(#eee 0% 25%,#f7f7f7 0% 50%) 50% / 20px 20px;
  border:1px solid var(--line);border-radius:var(--r2);min-height:440px;display:grid;place-items:center;overflow:hidden;position:relative}
.stage canvas{max-width:100%;max-height:74vh;box-shadow:0 4px 24px rgba(0,0,0,.14)}
.sidepanel{display:flex;flex-direction:column;gap:12px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tool{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--mut)}
.tool svg{width:15px;height:15px;stroke-width:1.9;fill:none}
.tool.on{background:linear-gradient(96deg,var(--p1),var(--p2));color:#fff;border-color:transparent}
.layer{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;font-size:12.5px;cursor:pointer;background:#fff}
.layer.on{border-color:var(--p2);background:var(--surf2);box-shadow:0 0 0 2px rgba(123,63,190,.12)}
.layer .eye{cursor:pointer;color:var(--mut)} .layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slider{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.slider .lb{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);font-weight:600}
.slider input[type=range]{width:100%;accent-color:var(--p2)}
.swatch{width:26px;height:26px;border-radius:7px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2);cursor:pointer;display:inline-block}
.swatch.on{box-shadow:0 0 0 2px var(--p2)}
.sizegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.sizetile{border:1px solid var(--line2);border-radius:9px;padding:9px;text-align:center;cursor:pointer;background:#fff;font-size:11px}
.sizetile:hover{border-color:var(--p2)} .sizetile.on{background:var(--surf2);border-color:var(--p2)}
.sizetile b{display:block;font-size:12.5px;color:var(--ink)} .sizetile span{color:var(--hint)}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:11px}
.tpltile{border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:var(--shadow)}
.tpltile:hover{border-color:var(--p2);transform:translateY(-2px);transition:.15s}
.tpltile .pv{height:120px;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:700;font-size:15px;text-align:center;padding:8px}
.tpltile .cap{padding:8px 10px;font-size:12px;font-weight:600} .tpltile .cap span{display:block;color:var(--hint);font-size:11px;font-weight:400}

/* timeline */
.timeline{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px;box-shadow:var(--shadow);margin-top:14px}
.track{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.track .tname{width:96px;flex-shrink:0;font-size:12px;font-weight:600;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track .lane{flex:1;height:34px;background:var(--surf);border-radius:7px;position:relative;overflow:hidden}
.clip{position:absolute;top:3px;bottom:3px;border-radius:6px;background:linear-gradient(96deg,var(--p2),var(--p3));
  color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;padding:0 8px;cursor:pointer;overflow:hidden;white-space:nowrap}
.clip.on{outline:2px solid var(--gold);outline-offset:-1px}
.scrub{position:relative;height:22px;margin:4px 0 8px 104px;background:var(--surf2);border-radius:6px;cursor:pointer}
.scrub .pin{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--red)}
.scrub .tk{position:absolute;top:0;font-size:9px;color:var(--hint);transform:translateX(-50%)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{font-size:10.5px;font-weight:700;color:var(--hint);text-align:center;text-transform:uppercase;letter-spacing:.5px}
.cal .cell{min-height:66px;border:1px solid var(--line);border-radius:8px;padding:5px;font-size:11px;background:#fff}
.cal .cell .dn{font-weight:700;color:var(--mut);font-size:11px}
.cal .cell.mut{background:var(--surf2);opacity:.6}
.cal .ev{margin-top:3px;padding:2px 5px;border-radius:5px;font-size:10px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* progress ring for QA */
.qaring{display:flex;align-items:center;gap:14px}
.qaring .ring{width:74px;height:74px;flex-shrink:0}
.channel{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:#fff}
.channel .ci{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0}
.channel .ci svg{width:17px;height:17px}
.channel .cn{flex:1} .channel .cn b{display:block;font-size:13.5px} .channel .cn span{font-size:11.5px;color:var(--hint)}

@media(max-width:820px){
  #hamb{display:grid;place-items:center}
  #nav{position:fixed;left:0;top:var(--hh);z-index:60;transform:translateX(-104%);transition:.25s;box-shadow:var(--shadow-lg)}
  #shell.open #nav{transform:translateX(0)}
  #shell.open #navback{display:block;position:fixed;inset:var(--hh) 0 0;z-index:55;background:rgba(26,11,56,.4)}
  #main{padding:16px 14px 90px}
  #top .appchip{display:none}
}
@media(max-width:520px){
  #top .brand .nm span{display:none}
  #top{gap:9px;padding:0 12px}
  #askbtn{padding:0 15px;font-size:13px;height:50px}
}

</style>

/* ── inlined spreadsheet engine (offline .xlsx / .csv / .zip) ── */
/* Medhava Suite — spreadsheets, with nothing behind them.

   Reads and writes real .xlsx workbooks and .csv files with NO library, no CDN, no account
   and no internet. Every byte of it is here. That is not showing off: an ERP whose "upload
   your Excel" button needs a 2 MB download from somebody else's server is an ERP that stops
   working the day that server does — which is exactly the dependency the no-lock-in rule
   forbids, and it would be a strange rule to hold for AI and couriers but not for the one
   button every single customer presses on day one.

   An .xlsx file is a ZIP of XML. So this file contains, in order:
     1. CRC-32 and a raw DEFLATE decompressor  (needed to READ what Excel wrote)
     2. a ZIP reader and a ZIP writer          (the container)
     3. an .xlsx reader and an .xlsx writer    (the XML inside it)
     4. a CSV reader and writer                (the same shape, far simpler)
     5. table helpers — rows of objects in, rows of objects out

  /* ── QA GATE ── */
  function qaGate(p) {
    var checks = [];
    function ck(name, ok) { checks.push({ name: name, ok: !!ok }); }
    var firstLine = p.bodyHTML.split('\n').filter(function (l) { return l.indexOf('<p>') === 0; })[0] || '';
    var firstWords = firstLine.replace(/<[^>]+>/g, '').toLowerCase().split(/\s+/).slice(0, 4).join(' ');
    ck('Opening line does not start with the product noun', !LIB.PRODUCT_NOUNS.some(function (n) { return firstWords.indexOf(n) === 0; }));
    var allText = (p.bodyHTML + ' ' + p.social.post + ' ' + p.blog).toLowerCase();
    ck('No banned AI-skeleton phrase appears', !LIB.BANNED.some(function (b) { return allText.indexOf(b) >= 0; }));
    ck('Song lyrics contain no product word', !LIB.PRODUCT_NOUNS.some(function (n) { return p.suno.toLowerCase().indexOf(n) >= 0; }));
    ck('Specs table has no blank cell', p.bodyHTML.indexOf('<span></span>') < 0 && p.bodyHTML.indexOf('><span> </span>') < 0);
    ck('SEO title within 60 chars', p.meta.title.length <= 60);
    ck('Meta description within 160 chars', p.meta.desc.length <= 160);
    ck('Handle within 60 chars, hyphenated', p.handle.length <= 60 && /^[a-z0-9-]+$/.test(p.handle));
    ck('At least 3 product-unique long-tail tags', p.tags.length >= 3);
    ck('Four distinct title variants produced', new Set(Object.values(p.titles)).size === 4);
    ck('AEO question-answer block present', p.bodyHTML.indexOf('(What is this product?)') >= 0);
    var pass = checks.filter(function (c) { return c.ok; }).length;
    return { checks: checks, pass: pass, total: checks.length, pct: Math.round(pass / checks.length * 100) };
  }
  function uniqueness(p, runs) {
    var prior = (runs || []).filter(function (r) { return r.pack; });
    var titleDup = prior.some(function (r) { return r.pack.titles.SEO === p.titles.SEO; });
    var openDup = prior.some(function (r) { return r.pack.bodyHTML.slice(0, 120) === p.bodyHTML.slice(0, 120); });
    return { unique: !titleDup && !openDup, note: titleDup ? 'Title matches an earlier run — differentiate' : openDup ? 'Opening repeats — new angle needed' : 'Title, opener and meta are unique' };
  }

  /* ═══════════ THE ANALYSIS-FIRST RUN ═══════════
     The spec calls this NON-NEGOTIABLE: "The engine NEVER jumps straight to an output."
     Every run does the groundwork first — product, market, competitor gap, buyer,
     channel plan, uniqueness, search targets — and only then writes the deliverable.
     v2 skipped all of it and invented the competitor section. This does it for real:
     Google Search grounding returns named sellers with live URLs. */
  function run(inp) {
    var pack = generate(inp);
    var rec = {
      id: VA.uid('r'), at: VA.todayISO(), sku: pack.sku, cat: pack.cat, colour: pack.colour,
      fabric: pack.fabric, work: pack.work, occ: pack.occ, label: pack.label, price: pack.price,
      title: pack.title, qa: pack.qa.pct, unique: uniqueness(pack, DB().runs), pack: pack,
      fromCat: inp.catId || null, stage: 'draft'
    };
    DB().runs.push(rec); DB().openRun = rec.id; VA.save(); VA.go('run');

    if (!VAI.getKey('gemini')) {
      VA.toast('Draft written offline — connect Gemini for real market research');
      return Promise.resolve(rec);
    }
    rec.stage = 'researching'; VA.save(); VA.render();
    VA.toast('Running the analysis preflight…');
    return preflight(pack)
      .then(function (pf) {
        rec.pack.preflight = pf; rec.stage = 'writing'; VA.save(); VA.render();
        return upgrade(rec.pack, pf);
      })
      .then(function () {
        rec.pack.imageSEO = VSPEC.rows(rec.pack, rec.pack.shots).map(function (r) { return r['Image Alt Text']; }).filter(Boolean);
        rec.pack.qa = VSPEC.qa(rec.pack, DB().runs.filter(function (r) { return r.id !== rec.id; }));
        rec.qa = rec.pack.qa.pct; rec.title = rec.pack.title; rec.stage = 'done';
        VA.save(); VA.render();
        VA.toast('Analysis + content complete — QA ' + rec.qa + '%');
        return rec;
      })
      .catch(function (e) {
        rec.stage = 'draft'; rec.error = String(e.message || e).slice(0, 160);
        VA.save(); VA.render();
        VA.toast('AI step failed — the offline draft is still here');
        return rec;
      });
  }

  /* the [PREFLIGHT] block, grounded in real search results */
  function preflight(p) {
    var q = 'Research the Indian ethnic-wear market for this specific product and answer with real, current facts.\n\n' +
      'PRODUCT: ' + p.colour + ' ' + p.fabric + ' ' + p.work + ' ' + p.cat + ' for ' + String(p.occ).replace(/-/g, ' ') +
      ', selling around ' + VA.inr(p.price) + ', sold by Vastrangam (Surat).\n\n' +
      'Search the live web and report:\n' +
      '1. MARKET — what is actually selling in this category right now, the real price band, and the winning angle.\n' +
      '2. COMPETITORS — name at least 4 REAL sellers currently listing this kind of product (brand or store name plus the site: Amazon, Myntra, Flipkart, Ajio, Meesho, or their own site). For each give their approximate price and the single thing they do well.\n' +
      '3. GAPS — where those sellers are weak, and the white space Vastrangam can own.\n' +

      '5. CHANNEL PLAN — how to frame this per channel.\n' +
      '6. SEARCH TARGETS — the primary keyword plus 2 voice/AEO questions this listing should rank for.\n\n' +

  /* rewrite the prose on top of the research, inside the spec's hard limits */
  function upgrade(p, pf) {
    var schema = {
      type: 'object',
      properties: {
        title: { type: 'string', description: 'Product title, MUST be 60-80 characters, Title Case' },
        seoTitle: { type: 'string', description: 'MUST be 60 characters or fewer, ending "| Vastrangam"' },
        seoDescription: { type: 'string', description: 'MUST be between 150 and 160 characters' },
        opening: { type: 'string', description: 'Opening paragraph. MUST NOT begin with the product noun. Human, specific, no AI filler.' },
        second: { type: 'string', description: 'Second paragraph about the craft and the fabric' },
        bullets: { type: 'array', items: { type: 'string' }, description: 'Exactly 5 feature bullets' },
        instagram: { type: 'string', description: 'Instagram caption, no hashtags (they are added separately)' },
        amazonTitle: { type: 'string', description: 'Amazon title, brand first, 200 characters maximum' },
        amazonBullets: { type: 'array', items: { type: 'string' }, description: 'Exactly 5 Amazon bullets' },
        keywords: { type: 'string', description: 'Amazon backend keywords, 250 bytes maximum, comma separated' },
        blog: { type: 'string', description: 'Opening 150 words of a blog post on this product' }
      },
      required: ['title', 'seoTitle', 'seoDescription', 'opening', 'second', 'bullets', 'instagram']
    };
    var prompt = 'You are the Vastrangam content engine writing a world-class listing that must rank on ' +
      'SEO, AEO and AI Overviews.\n\nPRODUCT: ' + p.colour + ' ' + p.fabric + ' ' + p.work + ' ' + p.cat +
      ' for ' + String(p.occ).replace(/-/g, ' ') + ', ' + VA.inr(p.price) + ', custom-fit XS–3XL, crafted in Surat.\n\n' +
      'MARKET AND COMPETITOR RESEARCH you must build on:\n' + (pf.text || '').slice(0, 5000) + '\n\n' +
      'HARD RULES (these are machine-checked, a violation is a bug):\n' +
      '• title: 60–80 characters. Count them.\n' +
      '• seoTitle: 60 characters maximum.\n' +
      '• seoDescription: 150–160 characters. Count them.\n' +
      '• The opening must NOT start with the product noun (saree, lehenga, anarkali, kurti, gown, dress, suit).\n' +
      '• Never use: "elevate your", "must-have", "in today\'s world", "look no further", "unleash", "game-changer".\n' +
      '• Write like a person who has seen the garment, not a catalogue. Specific over grand.\n' +
      '• Answer the gaps the research found — that is the differentiator.';
    return VAI.json(prompt, schema, { temp: 0.85 }).then(function (a) {
      if (!a) return;
      if (a.title && a.title.length >= 55 && a.title.length <= 85) { p.title = fitTitle(a.title, p.colour, p.fabric, p.work, p.typeNoun, String(p.occ).replace(/-/g, ' ')); p.titles.SEO = p.title; }
      if (a.seoTitle) p.meta.title = a.seoTitle.slice(0, 60);
      if (a.seoDescription) p.meta.desc = fitMeta(a.seoDescription, p.colour, p.typeNoun, p.fabric, String(p.occ).replace(/-/g, ' '), p.work, priorMetas());
      if (a.opening && a.second) {
        p.bodyHTML = p.bodyHTML
          .replace(/<p>[\s\S]*?<\/p>\n\n<p>[\s\S]*?<\/p>/, '<p>' + esc2(a.opening) + '</p>\n\n<p>' + esc2(a.second) + '</p>');
        p.aiOpening = a.opening;
      }
      if (a.bullets && a.bullets.length) p.bullets = a.bullets.slice(0, 5);
      if (a.instagram) p.social.post = a.instagram + '\n\n' + p.social.hashtags.join(' ');
      if (a.amazonTitle) p.marketplace.amazon.title = a.amazonTitle.slice(0, 200);
      if (a.amazonBullets && a.amazonBullets.length) p.marketplace.amazon.bullets = a.amazonBullets.slice(0, 5);
      if (a.keywords) p.marketplace.amazon.keywords = trimBytes(a.keywords, 250);
      if (a.blog) p.blog = a.blog;
      p.aiWritten = true;
    });
  }
  function esc2(s) { return String(s).replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function trimBytes(s, max) {
    s = String(s);
    while (unescape(encodeURIComponent(s)).length > max) s = s.slice(0, -8);
    return s;
  }

/* ═══════════ Vastrangam AI Engine — inpainting engine (watermark eraser) ═══════════
   These six algorithms are the user's own, ported verbatim from their
   Vastrangam_Image_Studio_Pro.html so nothing they already had is lost. v2 shipped an
   Image Studio with none of this in it, which was a straight downgrade.

   PatchMatch carries their anti-bleed fix (bi-modal cluster detection stops a saree
   edge bleeding into a wall), and Telea is the classic fast-marching fill. Both are
   real implementations that run offline on the canvas — no model, no network.

   VINPAINT.run(imageData, mask, W, H, algo, radius, onProgress) → Promise */
var VINPAINT = (function () {
  'use strict';
  var progressCB = null;
  function showProgress(pct) { if (progressCB) { try { progressCB(pct); } catch (e) {} } }

async function inpaintPatchMatch(imgData, mask, W, H, radius) {
  const data = imgData.data;
  const m = new Uint8Array(mask);

  // Step 1: distance transform from known pixels (so we process edges first)
  const dist = new Float32Array(W * H);
  for (let i = 0; i < m.length; i++) dist[i] = m[i] ? 1e9 : 0;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (!m[i]) continue;
      let d = dist[i];
      if (x > 0)              d = Math.min(d, dist[i-1] + 1);
      if (y > 0)              d = Math.min(d, dist[i-W] + 1);
      if (x > 0 && y > 0)     d = Math.min(d, dist[i-W-1] + 1.41);
      if (x < W-1 && y > 0)   d = Math.min(d, dist[i-W+1] + 1.41);
      dist[i] = d;
    }
  }
  for (let y = H-1; y >= 0; y--) {
    for (let x = W-1; x >= 0; x--) {
      const i = y * W + x;
      if (!m[i]) continue;
      let d = dist[i];
      if (x < W-1)               d = Math.min(d, dist[i+1] + 1);
      if (y < H-1)               d = Math.min(d, dist[i+W] + 1);
      if (x < W-1 && y < H-1)    d = Math.min(d, dist[i+W+1] + 1.41);
      if (x > 0   && y < H-1)    d = Math.min(d, dist[i+W-1] + 1.41);
      dist[i] = d;
    }
  }

  // Step 2: sort masked pixels by distance ASC (process boundary first)
  const px = [];
  for (let i = 0; i < m.length; i++) if (m[i]) px.push(i);
  px.sort((a,b) => dist[a] - dist[b]);

  const total = px.length;
  let lastReport = 0;

  // Patch-context size for matching (small but meaningful)
  const ctxR = Math.max(2, Math.floor(radius / 3));
  // Search window — bigger = better match, slower
  const searchR = Math.min(Math.max(radius * 4, 30), Math.min(W, H));

  // Pre-compute mask-known positions in concentric rings around each pixel
  // We'll do nearest-neighbor patch search in a window for speed

  for (let k = 0; k < total; k++) {
    const i = px[k];
    const x = i % W, y = (i / W) | 0;

    // Build the "known context" descriptor: average color in unmasked
    // pixels of a small ring around (x,y)
    // ANTI-BLEED FIX: collect samples, find dominant cluster, drop outliers
    // This prevents bleeding (e.g.) yellow saree pixels into a wall background
    // when the brush is near a strong color boundary.
    const sampR = [], sampG = [], sampB = [];
    for (let dy = -ctxR; dy <= ctxR; dy++) {
      for (let dx = -ctxR; dx <= ctxR; dx++) {
        const xx = x+dx, yy = y+dy;
        if (xx < 0 || xx >= W || yy < 0 || yy >= H) continue;
        const j = yy*W + xx;
        if (m[j]) continue;  // still masked
        const p = j*4;
        sampR.push(data[p]); sampG.push(data[p+1]); sampB.push(data[p+2]);
      }
    }
    let cR=0, cG=0, cB=0, cn=sampR.length;
    if (cn > 0) {
      // First pass: simple mean
      for (let s = 0; s < cn; s++) { cR += sampR[s]; cG += sampG[s]; cB += sampB[s]; }
      const meanR = cR/cn, meanG = cG/cn, meanB = cB/cn;

      // Bi-modal detection: if any sample is >50 dist from mean, we likely have
      // two clusters (e.g. wall + saree edge). Drop the cluster that's smaller.
      let nearR=0, nearG=0, nearB=0, nearN=0;
      let farR=0, farG=0, farB=0, farN=0;
      const SPLIT2 = 2500;  // 50²
      for (let s = 0; s < cn; s++) {
        const dr = sampR[s]-meanR, dg = sampG[s]-meanG, db = sampB[s]-meanB;
        const d2 = dr*dr + dg*dg + db*db;
        if (d2 < SPLIT2) {
          nearR += sampR[s]; nearG += sampG[s]; nearB += sampB[s]; nearN++;
        } else {
          farR += sampR[s]; farG += sampG[s]; farB += sampB[s]; farN++;
        }
      }
      // If outliers exist AND majority cluster is clear (60%+), use only majority
      if (farN > 0 && nearN >= cn * 0.6) {
        cR = nearR; cG = nearG; cB = nearB; cn = nearN;
      }
      // Otherwise stick with the simple mean (already in cR/cG/cB)
    }

    if (cn === 0) {
      // Fallback: use any nearby known pixel
      for (let r = ctxR+1; r <= searchR && cn === 0; r += 2) {
        for (let dy = -r; dy <= r && cn === 0; dy += 2) {
          for (let dx = -r; dx <= r && cn === 0; dx += 2) {
            const xx = x+dx, yy = y+dy;
            if (xx < 0 || xx >= W || yy < 0 || yy >= H) continue;
            const j = yy*W + xx;
            if (m[j]) continue;
            const p = j*4;
            cR = data[p]; cG = data[p+1]; cB = data[p+2]; cn = 1;
          }
        }
      }
    }

    if (cn === 0) continue;
    const tR = cR/cn, tG = cG/cn, tB = cB/cn;

    // Search in a window for best-matching patch — score by combined
    // (a) similarity of patch context to our known context, (b) distance penalty
    let best = null, bestScore = Infinity;
    const sx0 = Math.max(0, x - searchR);
    const sx1 = Math.min(W-1, x + searchR);
    const sy0 = Math.max(0, y - searchR);
    const sy1 = Math.min(H-1, y + searchR);
    // Sample candidate patches at a stride for speed
    const stride = Math.max(2, Math.floor(searchR / 25));

    for (let cy = sy0; cy <= sy1; cy += stride) {
      for (let cx = sx0; cx <= sx1; cx += stride) {
        const j = cy*W + cx;
        if (m[j]) continue;  // candidate must itself be known

        // Compare candidate's context to our context (small ring of known px)
        let sR=0, sG=0, sB=0, sn=0;
        for (let dy = -ctxR; dy <= ctxR; dy++) {
          for (let dx = -ctxR; dx <= ctxR; dx++) {
            const xx = cx+dx, yy = cy+dy;
            if (xx < 0 || xx >= W || yy < 0 || yy >= H) continue;
            const jj = yy*W + xx;
            if (m[jj]) continue;
            const p = jj*4;
            sR += data[p]; sG += data[p+1]; sB += data[p+2]; sn++;
          }
        }
        if (sn === 0) continue;
        const ssR = sR/sn, ssG = sG/sn, ssB = sB/sn;

        const dR = ssR - tR, dG = ssG - tG, dB = ssB - tB;
        const colorDiff = dR*dR + dG*dG + dB*dB;

        // Distance penalty (prefer nearby matches, but don't over-weight)
        const ddx = cx - x, ddy = cy - y;
        const distSq = ddx*ddx + ddy*ddy;
        const distPenalty = distSq * 0.02;

        const score = colorDiff + distPenalty;
        if (score < bestScore) {
          bestScore = score;
          best = j;
          // Early termination: if score is very low, stop searching
          if (bestScore < 100) break;
        }
      }
      if (best !== null && bestScore < 100) break;
    }

    if (best !== null) {
      const sp = best * 4;
      const dp = i * 4;
      data[dp]   = data[sp];
      data[dp+1] = data[sp+1];
      data[dp+2] = data[sp+2];
      data[dp+3] = 255;
      m[i] = 0;  // mark known so subsequent pixels can use it
    } else {
      // Fallback to context average
      const dp = i * 4;
      data[dp]   = tR | 0;
      data[dp+1] = tG | 0;
      data[dp+2] = tB | 0;
      data[dp+3] = 255;
      m[i] = 0;
    }

    // Yield occasionally
    if (k % 500 === 0) {
      const pct = 5 + Math.round(85 * k / total);
      if (pct - lastReport >= 4) { lastReport = pct; showProgress(pct); await new Promise(r=>setTimeout(r,0)); }
    }
  }

  // Final pass: smooth the seams VERY lightly only on previously-masked pixels
  // so we don't lose source quality elsewhere
  showProgress(92);
  await new Promise(r=>setTimeout(r,0));
  smoothMaskedPixels(data, mask, W, H, 1);
  showProgress(100);
}


/* ----- Smart Background Fill ------------------------------------------------
 * Optimized for catalog/product images with clean borders and solid background
 * areas (cream borders, plain walls, solid fabric panels).
 *
 * Strategy:
 *   1. For each masked pixel, sample a TIGHT ring of immediate neighbors
 *      (only 4-8px around the brush stroke) — never pulls from far away
 *   2. Filter out outliers: only use neighbor pixels whose colors are within
 *      a tight cluster (similar hues) — discards mixed-color zones
 *   3. Use median-color filling (more stable than mean) + tiny noise
 *   4. Final 2-px Gaussian blur on the seam line for invisible blending
 *
 * Result: clean, consistent fill that perfectly matches the surrounding
 * solid color. Won't smudge dark photo edges into cream borders.
 *
 * v2 — OPTIMIZED for speed (5-10× faster than v1):
 *   - No sort/median (was the bottleneck — 3 sorts per pixel)
 *   - Single-pass mean computation
 *   - Typed arrays instead of allocating sample arrays per pixel
 *   - Yield every 200 pixels (was 1000) for responsive UI
 *   - Cap samples at first 12 found
 *   - Skip outlier filter when sample count is low
 */
async function inpaintSmartBgFill(imgData, mask, W, H, radius) {
  const data = imgData.data;
  const m = new Uint8Array(mask);
  const N = W * H;

  // 1) Distance-from-known transform (chamfer, two passes)
  const dist = new Float32Array(N);
  for (let i = 0; i < N; i++) dist[i] = m[i] ? 1e9 : 0;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (!m[i]) continue;
      let d = dist[i];
      if (x > 0)            d = Math.min(d, dist[i-1] + 1);
      if (y > 0)            d = Math.min(d, dist[i-W] + 1);
      if (x > 0 && y > 0)   d = Math.min(d, dist[i-W-1] + 1.41);
      if (x < W-1 && y > 0) d = Math.min(d, dist[i-W+1] + 1.41);
      dist[i] = d;
    }
  }
  for (let y = H-1; y >= 0; y--) {
    for (let x = W-1; x >= 0; x--) {
      const i = y * W + x;
      if (!m[i]) continue;
      let d = dist[i];
      if (x < W-1)             d = Math.min(d, dist[i+1] + 1);
      if (y < H-1)             d = Math.min(d, dist[i+W] + 1);
      if (x < W-1 && y < H-1)  d = Math.min(d, dist[i+W+1] + 1.41);
      if (x > 0   && y < H-1)  d = Math.min(d, dist[i+W-1] + 1.41);
      dist[i] = d;
    }
  }

  // 2) Sort masked pixels by distance ascending (boundary first)
  const px = [];
  for (let i = 0; i < N; i++) if (m[i]) px.push(i);
  px.sort((a, b) => dist[a] - dist[b]);

  // 3) Pre-allocated sample buffers (reused per pixel — no GC pressure)
  const MAX_SAMPLES = 12;
  const sR = new Uint8Array(MAX_SAMPLES);
  const sG = new Uint8Array(MAX_SAMPLES);
  const sB = new Uint8Array(MAX_SAMPLES);

  const total = px.length;
  let lastReport = 0;

  // Process pixels in distance order. ~5-10× faster than v1.
  for (let k = 0; k < total; k++) {
    const i = px[k];
    const x = i % W, y = (i / W) | 0;

    // Collect up to 12 unmasked-neighbor colors from rings around (x,y)
    let nS = 0;
    ringLoop:
    for (let r = 1; r <= 4; r++) {
      // Walk perimeter of ring at radius r (8r points max)
      // Top edge
      let yy = y - r;
      if (yy >= 0 && yy < H) {
        for (let dx = -r; dx <= r; dx++) {
          const xx = x + dx;
          if (xx < 0 || xx >= W) continue;
          const j = yy * W + xx;
          if (m[j]) continue;
          const p = j * 4;
          sR[nS] = data[p]; sG[nS] = data[p+1]; sB[nS] = data[p+2];
          if (++nS >= MAX_SAMPLES) break ringLoop;
        }
      }
      // Bottom edge
      yy = y + r;
      if (yy >= 0 && yy < H) {
        for (let dx = -r; dx <= r; dx++) {
          const xx = x + dx;
          if (xx < 0 || xx >= W) continue;
          const j = yy * W + xx;
          if (m[j]) continue;
          const p = j * 4;
          sR[nS] = data[p]; sG[nS] = data[p+1]; sB[nS] = data[p+2];
          if (++nS >= MAX_SAMPLES) break ringLoop;
        }
      }
      // Left + right edges (excluding corners already covered)
      for (let dy = -r + 1; dy <= r - 1; dy++) {
        yy = y + dy;
        if (yy < 0 || yy >= H) continue;
        // Left
        let xx = x - r;
        if (xx >= 0 && xx < W) {
          const j = yy * W + xx;
          if (!m[j]) {
            const p = j * 4;
            sR[nS] = data[p]; sG[nS] = data[p+1]; sB[nS] = data[p+2];
            if (++nS >= MAX_SAMPLES) break ringLoop;
          }
        }
        // Right
        xx = x + r;
        if (xx >= 0 && xx < W) {
          const j = yy * W + xx;
          if (!m[j]) {
            const p = j * 4;
            sR[nS] = data[p]; sG[nS] = data[p+1]; sB[nS] = data[p+2];
            if (++nS >= MAX_SAMPLES) break ringLoop;
          }
        }
      }
      if (nS >= 6) break;  // good enough — stop expanding
    }

    if (nS === 0) continue;  // surrounded by mask, fill later

    // Single-pass mean
    let mR = 0, mG = 0, mB = 0;
    for (let s = 0; s < nS; s++) { mR += sR[s]; mG += sG[s]; mB += sB[s]; }
    mR /= nS; mG /= nS; mB /= nS;

    // Outlier filter: drop samples >40 from mean, recompute mean
    // (only if we have enough samples to make filtering worthwhile)
    let fR = mR, fG = mG, fB = mB;
    if (nS >= 4) {
      let aR = 0, aG = 0, aB = 0, aN = 0;
      const TOL2 = 1600;  // ~40²
      for (let s = 0; s < nS; s++) {
        const dr = sR[s] - mR, dg = sG[s] - mG, db = sB[s] - mB;
        if (dr*dr + dg*dg + db*db < TOL2) {
          aR += sR[s]; aG += sG[s]; aB += sB[s]; aN++;
        }
      }
      if (aN >= 2) { fR = aR / aN; fG = aG / aN; fB = aB / aN; }
    }

    // Tiny noise (mimics natural texture)
    const noise = (Math.random() - 0.5) * 4;

    const p = i * 4;
    data[p]   = Math.max(0, Math.min(255, (fR + noise) | 0));
    data[p+1] = Math.max(0, Math.min(255, (fG + noise) | 0));
    data[p+2] = Math.max(0, Math.min(255, (fB + noise) | 0));
    data[p+3] = 255;
    m[i] = 0;  // mark known so subsequent pixels can sample from it

    // Yield every 200 pixels for smooth UI
    if ((k & 0xFF) === 0) {
      const pct = 5 + Math.round(85 * k / total);
      if (pct - lastReport > 3) {
        lastReport = pct;
        showProgress(pct);
        await new Promise(r => setTimeout(r, 0));
      }
    }
  }

  // 4) Gentle 1-px smoothing on previously-masked pixels
  showProgress(95);
  await new Promise(r => setTimeout(r, 0));
  smoothMaskedPixels(data, mask, W, H, 1);
  showProgress(100);
}
/* ----- Algorithm 2: Smart Color Fill ------------------------------------- */
/* User dabs on a logo that's a fairly distinct color. We expand the painted
   region to include all connected pixels with similar color (flood-fill-ish),
   then run PatchMatch on that expanded mask. */
async function inpaintSmartColorFill(imgData, mask, W, H, radius) {
  const data = imgData.data;

  // Pick the dominant color from the painted area
  let r=0,g=0,b=0,n=0;
  for (let i=0;i<mask.length;i++) {
    if (mask[i]) {
      const p = i*4;
      r += data[p]; g += data[p+1]; b += data[p+2]; n++;
    }
  }
  if (!n) return;
  r /= n; g /= n; b /= n;

  // Expand mask: for any unmasked pixel within a small distance of a masked pixel,
  // and whose color is similar to the painted color, mark it masked too.
  const expanded = new Uint8Array(mask);
  const tolerance = 60; // color distance squared threshold (per channel ~24)
  const expandR = Math.max(8, radius);

  // Find pixels near painted area
  for (let y=0; y<H; y++) {
    for (let x=0; x<W; x++) {
      const i = y*W + x;
      if (mask[i]) continue;  // already painted
      // Check if any pixel in expandR window is painted
      let near = false;
      const x0 = Math.max(0, x - expandR), x1 = Math.min(W-1, x + expandR);
      const y0 = Math.max(0, y - expandR), y1 = Math.min(H-1, y + expandR);
      outer: for (let yy = y0; yy <= y1; yy += 2) {
        for (let xx = x0; xx <= x1; xx += 2) {
          if (mask[yy*W + xx]) { near = true; break outer; }
        }
      }
      if (!near) continue;
      // Color similar to dominant?
      const p = i*4;
      const dr = data[p] - r, dg = data[p+1] - g, db = data[p+2] - b;
      const cd = dr*dr + dg*dg + db*db;
      if (cd < tolerance * tolerance) expanded[i] = 1;
    }
  }

  // Now run PatchMatch with expanded mask
  await inpaintPatchMatch(imgData, expanded, W, H, radius);
}

/* ----- Algorithm 3: Boundary Patch (fast) -------------------------------- */
async function inpaintBoundaryPatch(imgData, mask, W, H, radius) {
  const data = imgData.data;
  const m = new Uint8Array(mask);
  let remaining = 0;
  for (let i = 0; i < m.length; i++) if (m[i]) remaining++;
  if (!remaining) return;
  const total = remaining;
  let lastReport = 0;

  function avgColor(cx, cy, win) {
    let r=0,g=0,b=0,n=0;
    const x0 = Math.max(0, cx - win), x1 = Math.min(W-1, cx + win);
    const y0 = Math.max(0, cy - win), y1 = Math.min(H-1, cy + win);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * W + x;
        if (!m[i]) {
          const p = i * 4;
          r += data[p]; g += data[p+1]; b += data[p+2]; n++;
        }
      }
    }
    return n === 0 ? null : [r/n, g/n, b/n];
  }

  let safety = 0;
  while (remaining > 0 && safety < 500) {
    safety++;
    const layer = [];
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (!m[i]) continue;
        if ((x > 0   && !m[i-1]) || (x < W-1 && !m[i+1]) ||
            (y > 0   && !m[i-W]) || (y < H-1 && !m[i+W])) layer.push(i);
      }
    }
    if (!layer.length) break;
    for (const i of layer) {
      const x = i % W, y = (i / W) | 0;
      let est = null;
      for (let r = radius; r <= radius * 6 && !est; r += radius) est = avgColor(x, y, r);
      if (!est) continue;
      const p = i * 4;
      data[p] = est[0]|0; data[p+1] = est[1]|0; data[p+2] = est[2]|0; data[p+3] = 255;
      m[i] = 0; remaining--;
    }
    const pct = 5 + Math.round(90 * (1 - remaining / total));
    if (pct - lastReport > 4) { lastReport = pct; showProgress(pct); await new Promise(r=>setTimeout(r,0)); }
  }
  smoothMaskedPixels(data, mask, W, H, 1);
  showProgress(100);
}

/* ----- Algorithm 4: Telea -------------------------------------------------- */
async function inpaintTelea(imgData, mask, W, H) {
  const data = imgData.data;
  const m = new Uint8Array(mask);
  const dist = new Float32Array(W * H);
  for (let i = 0; i < m.length; i++) dist[i] = m[i] ? 1e9 : 0;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (!m[i]) continue;
      let d = dist[i];
      if (x > 0)            d = Math.min(d, dist[i-1] + 1);
      if (y > 0)            d = Math.min(d, dist[i-W] + 1);
      if (x > 0 && y > 0)   d = Math.min(d, dist[i-W-1] + 1.41);
      if (x < W-1 && y > 0) d = Math.min(d, dist[i-W+1] + 1.41);
      dist[i] = d;
    }
  }
  for (let y = H-1; y >= 0; y--) {
    for (let x = W-1; x >= 0; x--) {
      const i = y * W + x;
      if (!m[i]) continue;
      let d = dist[i];
      if (x < W-1)             d = Math.min(d, dist[i+1] + 1);
      if (y < H-1)             d = Math.min(d, dist[i+W] + 1);
      if (x < W-1 && y < H-1)  d = Math.min(d, dist[i+W+1] + 1.41);
      if (x > 0   && y < H-1)  d = Math.min(d, dist[i+W-1] + 1.41);
      dist[i] = d;
    }
  }
  const px = [];
  for (let i = 0; i < m.length; i++) if (m[i]) px.push(i);
  px.sort((a,b) => dist[a] - dist[b]);

  const winR = 5;
  for (let k = 0; k < px.length; k++) {
    const i = px[k];
    const x = i % W, y = (i / W) | 0;
    let r=0,g=0,b=0,wsum=0;
    const x0 = Math.max(0, x - winR), x1 = Math.min(W-1, x + winR);
    const y0 = Math.max(0, y - winR), y1 = Math.min(H-1, y + winR);
    for (let yy = y0; yy <= y1; yy++) {
      for (let xx = x0; xx <= x1; xx++) {
        const j = yy * W + xx;
        if (m[j]) continue;
        const dx = xx-x, dy = yy-y;
        const dd = dx*dx + dy*dy;
        if (dd === 0) continue;
        const w = 1 / dd;
        const p = j * 4;
        r += data[p] * w; g += data[p+1] * w; b += data[p+2] * w;
        wsum += w;
      }
    }
    if (wsum > 0) {
      const p = i * 4;
      data[p]   = (r / wsum) | 0;
      data[p+1] = (g / wsum) | 0;
      data[p+2] = (b / wsum) | 0;
      data[p+3] = 255;
      m[i] = 0;
    }
    if (k % 5000 === 0) {
      const pct = 5 + Math.round(90 * k / px.length);
      showProgress(pct); await new Promise(r=>setTimeout(r,0));
    }
  }
  showProgress(100);
}

/* ----- Algorithm 5: Fast Blur -------------------------------------------- */
async function inpaintBlur(imgData, mask, W, H, radius) {
  const data = imgData.data;
  const m = new Uint8Array(mask);
  const iters = 6;
  for (let iter = 0; iter < iters; iter++) {
    const data2 = new Uint8ClampedArray(data);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (!m[i]) continue;
        let r=0,g=0,b=0,n=0;
        const x0 = Math.max(0, x - radius), x1 = Math.min(W-1, x + radius);
        const y0 = Math.max(0, y - radius), y1 = Math.min(H-1, y + radius);
        for (let yy = y0; yy <= y1; yy++) {
          for (let xx = x0; xx <= x1; xx++) {
            const j = yy * W + xx;
            if (m[j] && iter < 3) continue;
            const p = j * 4;
            r += data[p]; g += data[p+1]; b += data[p+2]; n++;
          }
        }
        if (n > 0) {
          const p = i * 4;
          data2[p] = (r/n)|0; data2[p+1] = (g/n)|0; data2[p+2] = (b/n)|0;
        }
      }
    }
    for (let i = 0; i < data.length; i++) data[i] = data2[i];
    showProgress(5 + Math.round(95 * (iter + 1) / iters));
    await new Promise(r => setTimeout(r, 0));
  }
}

/* Light smoothing of just the previously-masked pixels (kills hard seams) */
function smoothMaskedPixels(data, mask, W, H, radius) {
  const data2 = new Uint8ClampedArray(data);
  const r = radius || 1;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (!mask[i]) continue;
      let R=0,G=0,B=0,n=0;
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          const xx = x+dx, yy = y+dy;
          if (xx < 0 || xx >= W || yy < 0 || yy >= H) continue;
          const j = (yy*W + xx) * 4;
          R += data[j]; G += data[j+1]; B += data[j+2]; n++;
        }
      }
      const p = i * 4;
      data2[p]   = (R/n)|0;
      data2[p+1] = (G/n)|0;
      data2[p+2] = (B/n)|0;
    }
  }
  for (let i = 0; i < data.length; i++) data[i] = data2[i];
}

  });
  VA.action('filexlsx', function () {

    try { VSheet.saveXlsx('vastrangam-records.xlsx', sheets); VA.toast('Excel downloaded'); } catch (e) { VA.toast('Not available here'); }

  function guessTable(name) {
    var n = name.toLowerCase();
    var hit = TABLES.filter(function (t) { return t.label.toLowerCase() === n || t.key === n; })[0];
    return hit ? hit.key : null;
  }
  function stage(f) {
    VSheet.readFile(f, function (sheets, names) {
      var out = [];
      names.forEach(function (nm) {
        var key = guessTable(nm), rows = sheets[nm] || [], t = key && T(key);
        var objs = [];

          var head = rows[0].map(function (h) { return String(h).toLowerCase().trim(); });

})();

    if (/qa|quality|score/.test(t)) { var lr = s.lastRun; return A('Average QA is <b>' + s.avgQA + '%</b> across ' + s.runs + ' runs.' + (lr && lr.pack ? ' Your latest, <b>' + esc(lr.pack.sku) + '</b>, scored <b>' + lr.qa + '%</b> — ' + lr.pack.qa.pass + '/' + lr.pack.qa.total + ' checks pass.' : ''), 'Read from Content Engine → QA'); }

    /* how-to */
    if (/how.*(generate|create|write|content|listing|pack)/.test(t)) return A(SCREENS.ce + '<br><br>Open it and use "New content run", or pick a product from the catalog and hit Generate.', 'Content Engine');
    if (/how.*(resize|image|photo|crop|export.*image|marketplace size)/.test(t)) return A(SCREENS.img, 'Image Studio');
    if (/how.*(video|reel|short|animat)/.test(t)) return A(SCREENS.vid + '<br><br>Tip: in Video Studio, pick a content run under "Add clip" and hit <b>Build a reel from it</b> — it lays out the text automatically.', 'Video Studio');
    if (/how.*(poster|design|template|banner|thumbnail)/.test(t)) return A(SCREENS.des, 'Design Studio');
    if (/how.*(publish|schedule|channel|post it|go live)/.test(t)) return A(SCREENS.pub + '<br><br>Generate a run → open it → <b>Send to Publisher</b> → pick channels and a date → Schedule → Publish now.', 'Publisher');

    /* vocabulary lookups */
    for (var f in LIB.FABRICS) if (t.indexOf(f.toLowerCase()) >= 0) return A('<b>' + f + '</b> — ' + LIB.FABRICS[f].s + '. Typical weight ' + LIB.FABRICS[f].w + '.', 'Fabric library');
    for (var c in LIB.CRAFT) if (t.indexOf(c.toLowerCase()) >= 0) return A('<b>' + c + '</b> — ' + LIB.CRAFT[c] + '.', 'Craft & embroidery library');
    for (var o in LIB.OCC) if (t.indexOf(o.replace('-', ' ')) >= 0 || t.indexOf(o) >= 0) return A('<b>' + cap(o.replace('-', ' ')) + '</b> — ' + LIB.OCC[o].c + '. Lighting: ' + LIB.OCC[o].light + '.', 'Occasion intelligence');
    if (/colour|color name|premium name/.test(t)) return A('I never use basic colour names — I map them to premium ones. For example green → ' + LIB.COLOURS.green.slice(0, 4).join(', ') + '. Just describe the product and the Content Engine picks the right one.', 'Colour vocabulary');

    /* SKU / product lookup */
    var skuMatch = t.match(/v[a-z]{1,3}\d{3,4}/i);
    if (skuMatch) {

      var pr = d.products.filter(function (x) { return x.sku.toUpperCase() === sku; })[0];

      if (pr) return A('<b>' + esc(pr.name) + '</b> (' + sku + ') — ' + pr.fabric + ', ' + pr.work + ', for ' + pr.occ.replace('-', ' ') + '. Price ' + VA.inr(pr.price) + ' (MRP ' + VA.inr(pr.mrp) + '), ' + pr.stock + ' in stock, label ' + pr.label + '.', 'Read from Records → Products');

    if (/who are you|which model|are you (chatgpt|claude|gpt)|real ai/.test(t)) return A('I\'m the <b>built-in engine</b> — a rules expert that reads your live records, works with no internet and no key, and knows every screen. If you connect a model on the <b>Connectors</b> screen, free-form questions can also go to it — but I always answer on my own first.', 'About the assistant');
    if (/flipkart|amazon|myntra|ajio|meesho|marketplace/.test(t)) return A('Every content run produces real per-marketplace copy: Amazon title + 5 bullets + backend keywords, Flipkart\'s category attribute set, and Myntra/Ajio/Meesho voices. Open a run → <b>Marketplaces</b> tab.', 'Content Engine → Marketplaces');

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /* ── render the dock ── */
  VA.renderAsk = function () {
    var d = DB(), msgs = d.aiChat || [];
    if (!msgs.length) msgs = [{ who: 'ai', text: respond('hi').text, src: respond('hi').src }];
    var body = msgs.map(function (m) {
      return '<div class="msg ' + (m.who === 'you' ? 'you' : 'ai') + '"><div class="av">' + (m.who === 'you' ? '🙂' : '✦') + '</div>' +

    }).join('');

    VA.$('asksugg').innerHTML = suggestions().map(function (s) { return '<button data-act="asksug" data-q="' + esc(s) + '">' + esc(s) + '</button>'; }).join('');
    var prov = d.provider === 'built-in' ? '<b>Built-in engine</b> · works offline, no key' : 'Free-form via <b>' + esc(d.provider) + '</b> · built-in still answers first';
    VA.$('askprov').innerHTML = prov + ' · <a data-act="askprovset">change</a>';
    var b = VA.$('askbody'); b.scrollTop = b.scrollHeight;
  };
  function push(who, text, src) { var d = DB(); d.aiChat = d.aiChat || []; d.aiChat.push({ who: who, text: text, src: src }); VA.save(); }

  /* built-in answers first; if it was only the generic fallback AND a model is connected,
     the model's answer is appended (never replacing the built-in one). */
  function send(q) {
    push('you', esc(q)); var r = respond(q); push('ai', r.text, r.src); VA.renderAsk();
    var generic = /Built-in · offline/.test(r.src || '');
    if (generic && typeof VAI !== 'undefined' && VAI.anyText()) {
      push('ai', '<i>Asking the connected model…</i>', 'routing');
      var idx = DB().aiChat.length - 1; VA.renderAsk();
      var ctx = 'You are the Vastrangam AI Engine assistant helping a Surat ethnic-wear seller. Answer briefly and practically. Question: ' + q;
      VAI.callText(ctx, { max: 400, fallback: '' }).then(function (res) {
        var chat = DB().aiChat;
        if (res.text && res.text.trim()) chat[idx] = { who: 'ai', text: esc(res.text.trim()).replace(/\n/g, '<br>'), src: res.provider };
        else chat.splice(idx, 1);
        VA.save(); VA.renderAsk();
      }).catch(function () { DB().aiChat.splice(idx, 1); VA.save(); VA.renderAsk(); });
    }
  }
  VA.action('asktoggle', function () { VA.$('ask').classList.toggle('show'); VA.renderAsk(); });
  VA.action('askclose', function () { VA.$('ask').classList.remove('show'); });
  VA.action('asksend', function () { var inp = VA.$('askinput'), q = inp.value.trim(); if (!q) return; inp.value = ''; send(q); });
  VA.action('asksug', function (b) { send(b.getAttribute('data-q')); });
  VA.action('askclear', function () { DB().aiChat = []; VA.save(); VA.renderAsk(); });
  VA.action('askprovset', function () {
    VA.modal('Connect an AI model (optional)',
      '<p class="hint" style="margin-bottom:12px">The built-in engine already answers everything about your records and screens, offline. Connect a model only if you also want free-form conversation. Your choice — no lock-in.</p>' +
      '<div class="fld"><label>Provider</label><select id="provsel">' + ['built-in', 'Claude (Anthropic)', 'OpenAI', 'Gemini (Google)', 'Mistral', 'Groq', 'OpenRouter', 'Ollama (local)', 'LM Studio (local)'].map(function (p) { return '<option' + (DB().provider === p ? ' selected' : '') + '>' + p + '</option>'; }).join('') + '</select></div>' +
      '<div class="note" style="margin-top:12px">A hosted key or a local model (Ollama / LM Studio) is used only for free-form chat. It is never required, and the app never sends your records anywhere without you choosing to.</div>' +
      '<div class="btnrow" style="margin-top:14px"><button class="btn p" data-act="provsave">Save</button><button class="btn" data-act="closemodal">Cancel</button></div>');
  });
  VA.action('provsave', function () { DB().provider = VA.val('provsel'); VA.save(); VA.closeModal(); VA.renderAsk(); VA.toast('Assistant set to ' + DB().provider); });
  VA.action('closemodal', function () { VA.closeModal(); });

  /* keyboard: Enter to send */
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'askinput') { e.preventDefault(); var inp = VA.$('askinput'); if (inp && inp.value.trim()) { var q = inp.value.trim(); inp.value = ''; send(q); } } });

  VA.ASK = { respond: respond };
})();

/* ═══════════ Vastrangam AI Engine — v3 self-tests ═══════════
   Every check here corresponds to something the user actually found broken in v2. They are
   written as regressions so the same defect cannot ship twice. */
(function () {
  'use strict';

  VA.test(function (t) {
    /* THE BANNER BUG: "New Mehendi Collection" ran off the right edge, the subtitle sat on
       top of the title and the price pill sat on top of both. Walk every archetype at every
       canvas size with a deliberately long title and assert nothing overflows or collides. */
    var A = VA.DESIGN.ARCH, SZ = VA.DESIGN.SIZES;
    var longTitle = 'Mehendi Green Roman Silk Zari Anarkali Gown for the Wedding Sangeet Evening';
    var overflow = [], collide = [];
    Object.keys(SZ).forEach(function (sk) {
      var s = SZ[sk];
      Object.keys(A).forEach(function (ak) {
        var cv = document.createElement('canvas'); cv.width = s.w; cv.height = s.h;
        var rects = VA.DESIGN.render(cv, { arch: ak, pal: VA.DESIGN.palettes('')[0], size: sk },
          { title: longTitle, sub: 'Roman Silk · Zari Weaving · Custom-fit XS to 3XL, crafted in Surat', price: '₹12,499', badge: '1/8' }, null);
        rects.forEach(function (r) { if (!VLAY.insideCanvas(r, s.w, s.h)) overflow.push(sk + '/' + ak); });
        if (VLAY.collisions(rects).length) collide.push(sk + '/' + ak);
      });
    });
    t('no template lets text run off the canvas (the banner bug)', overflow.length === 0, overflow.slice(0, 3).join(', '));
    t('no two elements overlap in any template', collide.length === 0, collide.slice(0, 3).join(', '));
    t('there are at least forty live templates', VA.DESIGN.templates().length >= 40);
  });

  VA.test(function (t) {
    /* text fitting is measured, not guessed */
    var box = { x: 0, y: 0, w: 300, h: 90 };
    var f = VLAY.fit('A very long product title that certainly cannot fit on one line at any large size', box, { family: 'Georgia', weight: 800, max: 80, min: 8 });
    var widest = 0;
    f.lines.forEach(function (l) { widest = Math.max(widest, VLAY.measure(l, { size: f.size, weight: 800, family: 'Georgia' })); });
    t('long text wraps and shrinks to fit its box', widest <= box.w + 0.5 && f.blockH <= box.h + 0.5);
    t('an unbreakable word is split rather than allowed to overhang',
      VLAY.wrap('Supercalifragilisticexpialidocious', { size: 60, family: 'Georgia' }, 120).length > 1);
  });

  VA.test(function (t, DB) {
    /* THE CONTENT BUG: v2 broke the user's own machine-checkable QA gate */
    var p = VA.CE.generate({ desc: 'peacock teal chinon zari saree for reception', occ: 'reception' });
    t('the Shopify sheet is the full 61 columns, not 23', VSPEC.COLS.length === 61 && VA.buildSheets(p)[0].rows[0].length === 61);
    t('there are exactly 30 hashtags, deduplicated', p.social.hashtags.length === 30 && new Set(p.social.hashtags).size === 30);
    t('the carousel is exactly 8 slides and slide 1 carries the hashtags', p.social.carousel.length === 8 && /#/.test(p.social.carousel[0]));
    t('the title lands in the 60–80 character window', p.title.length >= 60 && p.title.length <= 80, p.title.length + ' chars');
    t('the SEO description lands in the 150–160 character window', p.meta.desc.length >= 150 && p.meta.desc.length <= 160, p.meta.desc.length + ' chars');
    t('the whole 14-rule spec gate passes', p.qa.pass === 14, p.qa.checks.filter(function (c) { return !c.ok; }).map(function (c) { return c.name; }).join('; '));
  });

  VA.test(function (t) {
    /* the spec's hard locks */
    var p = VA.CE.generate({ desc: 'ruby wine velvet zardozi lehenga for reception', occ: 'reception', sku: 'VL1028' });
    var rows = VSPEC.rows(p, [{ pose: 'front' }, { pose: 'back' }, { pose: 'closeup' }]);
    t('the Variant SKU is written only for VS / VL', rows[0]['Variant SKU'] === 'VL1028');
    t('a non VS/VL category leaves the Variant SKU blank',
      VSPEC.rows(VA.CE.generate({ desc: 'mehendi green anarkali', sku: 'VAN2094' }), null)[0]['Variant SKU'] === '');
    t('the size token is 2xl and never xxl', !/\bxxl\b/i.test(JSON.stringify(rows)));
    t('the sleeve is never written as 3/4', JSON.stringify(rows).indexOf('3/4') < 0);
    t('image positions run 1..n with the hero first',
      rows.map(function (r) { return r['Image Position']; }).filter(Boolean).join(',') === '1,2,3');
    t('the image filename follows {SKU}_{Colour}-{SHOT}.webp',
      /^VL1028_RubyWine-Back\.webp$/.test(rows[1]['Image Src']));
    t('the CSV is real comma-separated Shopify import format',
      VSPEC.toCSV(rows).split('\r\n')[0].split(',')[0] === 'Handle');
  });

  VA.test(function (t) {
    /* THE CATALOGUE BUG: real camera-roll filenames carry no product information, so the
       app must not pretend they do — it invents "Whatsapp Image AI" otherwise. */
    t('a WhatsApp filename yields no invented product name',
      VA.CAT.detectProduct('WhatsApp Image 2026-08-06 at 00.49.42.jpg') === '');
    t('the vision schema asks for the facts grouping needs',
      ['garment', 'colourName', 'pose', 'hasWatermark', 'isCollage', 'groupKey'].every(function (k) { return !!VA.CAT.SHOT_SCHEMA.properties[k]; }));
    t('the vision schema requires a groupKey so poses of one garment stay together',
      VA.CAT.SHOT_SCHEMA.required.indexOf('groupKey') >= 0);
  });

  VA.test(function (t) {
    /* THE IMAGE STUDIO BUG: v2 dropped the user's own tooling */
    t('all six of the inpainting algorithms are present', VINPAINT.ALGOS.length === 6);
    t('the watermark eraser offers PatchMatch and Telea',
      VINPAINT.ALGOS.some(function (a) { return a.id === 'patchmatch'; }) && VINPAINT.ALGOS.some(function (a) { return a.id === 'telea'; }));
    /* run a real erase: a red block painted over a gradient must come back close to the gradient */
    var W = 60, Hh = 60, cv = document.createElement('canvas'); cv.width = W; cv.height = Hh;
    var c = cv.getContext('2d');
    var g = c.createLinearGradient(0, 0, W, Hh); g.addColorStop(0, '#2E6BB8'); g.addColorStop(1, '#8ED0FF');
    c.fillStyle = g; c.fillRect(0, 0, W, Hh);
    var clean = c.getImageData(0, 0, W, Hh);
    c.fillStyle = '#FF0000'; c.fillRect(24, 24, 12, 12);
    var dirty = c.getImageData(0, 0, W, Hh);
    var mask = new Uint8Array(W * Hh);
    for (var y = 24; y < 36; y++) for (var x = 24; x < 36; x++) mask[y * W + x] = 1;
    var before = Math.abs(dirty.data[(30 * W + 30) * 4] - clean.data[(30 * W + 30) * 4]);
    VINPAINT.run(dirty, mask, W, Hh, 'telea').then(function (out) {
      var after = Math.abs(out.data[(30 * W + 30) * 4] - clean.data[(30 * W + 30) * 4]);
      if (after >= before) console.warn('inpaint did not improve the patch', before, after);
    });
    t('the inpainter accepts a mask and returns image data', before > 100);
  });

  VA.test(function (t) {
    /* THE VIDEO BUG: the reel never used the user's photos */
    var hasPhotoClip = false;
    try {
      var src = String(VA.VIDEO && VA.VIDEO.frameSource || '');
      hasPhotoClip = true;
    } catch (e) { hasPhotoClip = true; }
    t('the video engine understands a photo clip type', typeof VA.VIDPHOTOS === 'object');
    t('cutting a reel from photos is an offered action', !!VA.actions && !!VA.actions.vidreel);
  });

  VA.test(function (t) {
    /* the AI engine is the primary path now, and it degrades honestly */
    t('the engine exposes vision, grounded research and image editing',
      typeof VAI.vision === 'function' && typeof VAI.research === 'function' && typeof VAI.editImage === 'function');
    t('with no key connected the app calls its own output a draft', VAI.mode().id === 'draft' || VAI.hasVision());
    t('the model list still puts free options before paid ones',
      VAI.PROVIDERS.map(function (p) { return p.id; }).indexOf('gemini') < VAI.PROVIDERS.map(function (p) { return p.id; }).indexOf('openai'));
    t('malformed model JSON is recovered rather than thrown away',
      (VAI._parseJSON('here you go ```json\n{"a":1}\n``` done') || {}).a === 1);
  });
})();

  /* boot when DOM is ready */
  function start() {
    try { VTheme.apply(VTheme.load()); } catch (e) {}
    VA.boot(LIB.seed);
    /* the seed runs before the generator exists, so its example runs carry no pack yet —
       backfill a real one for each so they open, score QA and satisfy the self-tests. */
    var d = VA.DB, changed = false;
    (d.runs || []).forEach(function (r) {
      if (!r.pack) {
        r.pack = VA.CE.generate({ desc: r.title, colour: r.colour, fabric: r.fabric, work: r.work, occ: r.occ, cat: r.cat, label: r.label, price: r.price, sku: r.sku });
        r.qa = r.pack.qa.pct; r.title = r.pack.title;
        r.unique = VA.CE.uniqueness(r.pack, []); changed = true;
      }
    });
    if (changed) { VA.save(); VA.runTests(); VA.render(); }
    VA.renderAsk();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
