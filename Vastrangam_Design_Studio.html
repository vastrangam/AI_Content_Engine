<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vastrangam Design Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--purple:#5B2D8E;--deep:#4A2D82;--lav:#7B5EA7;--gold:#C4963A;--ink:#14091F;--paper:#F4F0FB;--line:#C9B8EA;--soft:#FBF9FF}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Jost',system-ui,sans-serif;background:var(--paper);color:var(--ink)}
  button{font-family:inherit;cursor:pointer;border:none}
  input,select,textarea{font-family:inherit;outline:none}
  .hidden{display:none!important}
  header{background:linear-gradient(135deg,#2B0A5E,#5B2D8E 60%,#7B3FBE);padding:9px 14px;display:flex;align-items:center;gap:10px}
  header b{color:var(--gold);font-size:15px;font-weight:800;letter-spacing:1.4px}
  header span{color:rgba(255,255,255,.5);font-size:9px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700}
  header .sp{flex:1}
  .hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700}
  .hbtn.gold{background:linear-gradient(135deg,#9C7440,var(--gold))}
  .wrap{display:flex;height:calc(100vh - 46px)}
  .rail{width:140px;background:#EDE8F8;border-right:1px solid var(--line);overflow-y:auto;flex-shrink:0}
  .rail h4{margin:0;padding:10px 10px 5px;font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--deep);font-weight:800}
  .tpl{margin:5px 8px;border:1.5px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;cursor:pointer}
  .tpl .pv{height:74px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:800;text-align:center;line-height:1.2;padding:4px}
  .tpl .nm{font-size:9.5px;font-weight:700;color:var(--deep);padding:4px 6px;text-align:center}
  .addgrid{display:flex;flex-wrap:wrap;gap:5px;padding:6px 8px 14px}
  .addbtn{flex:1 1 calc(50% - 5px);background:var(--soft);border:1.5px solid var(--line);border-radius:7px;padding:7px 3px;font-size:10px;font-weight:700;color:var(--deep);display:flex;flex-direction:column;align-items:center;gap:2px}
  .addbtn .ic{font-size:15px}
  .stage{flex:1;background:#d9cef0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;min-width:0}
  #c{background:#fff;box-shadow:0 10px 40px rgba(43,10,94,.28);touch-action:none;max-width:94%;max-height:94%}
  .ztools{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:20px;padding:4px 6px}
  .ztools button{background:transparent;color:var(--deep);font-weight:800;font-size:13px;padding:3px 9px;border-radius:14px}
  .ztools span{font-size:10px;font-weight:800;color:var(--purple);align-self:center;min-width:38px;text-align:center}
  .insp{width:248px;background:#EDE8F8;border-left:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
  .itabs{display:flex;border-bottom:1px solid var(--line)}
  .itabs button{flex:1;padding:9px 2px;background:transparent;font-size:10.5px;font-weight:800;color:var(--deep);border-bottom:2px solid transparent}
  .itabs button.on{background:var(--soft);color:var(--purple);border-bottom:2px solid var(--purple)}
  .ibody{flex:1;overflow-y:auto;padding:11px}
  .fl{display:block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--deep);margin:9px 0 3px}
  .fl:first-child{margin-top:0}
  .inp{width:100%;padding:7px 8px;font-size:12px;border:1.5px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
  textarea.inp{resize:vertical;min-height:46px}
  .row{display:flex;gap:6px}.row>*{flex:1}
  .sw{display:flex;flex-wrap:wrap;gap:5px}
  .sw button{width:24px;height:24px;border-radius:6px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .seg{display:flex;gap:4px}
  .seg button{flex:1;padding:6px;font-size:11px;font-weight:700;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--deep)}
  .seg button.on{background:var(--purple);color:#fff;border-color:var(--purple)}
  .slider{margin:8px 0}
  .slider .t{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--deep);margin-bottom:2px}
  .slider input{width:100%;accent-color:var(--purple)}
  .layer{display:flex;align-items:center;gap:6px;padding:7px 8px;border:1.5px solid var(--line);border-radius:7px;background:#fff;margin-bottom:5px;font-size:11px;font-weight:600;color:var(--ink)}
  .layer.sel{border-color:var(--purple);background:var(--soft);box-shadow:0 0 0 2px rgba(91,45,142,.12)}
  .layer .ty{font-size:13px}
  .layer .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .layer .mini{background:transparent;font-size:13px;padding:1px 3px;color:var(--lav)}
  .btn{border-radius:8px;padding:9px;font-weight:800;font-size:12px}
  .btn.prim{background:linear-gradient(135deg,var(--purple),var(--lav));color:#fff}
  .btn.sec{background:#fff;border:1.5px solid var(--line);color:var(--deep)}
  .btn.del{background:#fff;border:1.5px solid #e3b4b4;color:#b3372c}
  .empty{color:#8B6CC4;font-size:11px;text-align:center;padding:24px 8px;line-height:1.6}
  .hint{font-size:10px;color:#7a5fb0;line-height:1.5;margin-top:8px}
  @media(max-width:820px){.rail{width:104px}.insp{width:188px}}
</style>
</head>
<body>
<header>
  <div><b>VASTRANGAM</b> <span>Design Studio</span></div>
  <div class="sp"></div>
  <a class="hbtn" href="index.html" style="text-decoration:none" title="Vastrangam ERP home">⌂</a>
  <button class="hbtn" onclick="undo()" title="Undo (Ctrl+Z)">↶</button>
  <button class="hbtn" onclick="redo()" title="Redo (Ctrl+Shift+Z)">↷</button>
  <button class="hbtn" onclick="addProductPhoto()">📷 Photo</button>
  <button class="hbtn" onclick="openAI()" style="background:linear-gradient(135deg,#7B3FBE,#C4963A)">✨ AI Assist</button>
  <button class="hbtn gold" onclick="exportAs('png')">⬇ Export</button>
</header>
<div class="wrap">
  <div class="rail">
    <h4>Templates</h4>
    <div id="tplList"></div>
    <h4>Add element</h4>
    <div class="addgrid">
      <button class="addbtn" onclick="addText()"><span class="ic">T</span>Text</button>
      <button class="addbtn" onclick="addProductPhoto()"><span class="ic">🖼️</span>Photo</button>
      <button class="addbtn" onclick="addPriceBadge()"><span class="ic">₹</span>Price</button>
      <button class="addbtn" onclick="addSaleBadge()"><span class="ic">%</span>Sale</button>
      <button class="addbtn" onclick="addRect()"><span class="ic">▭</span>Box</button>
      <button class="addbtn" onclick="addEllipse()"><span class="ic">●</span>Circle</button>
      <button class="addbtn" onclick="addLogo()"><span class="ic">✦</span>Logo</button>
      <button class="addbtn" onclick="addLine()"><span class="ic">―</span>Line</button>
    </div>
    <h4>Stock elements</h4>
    <div class="addgrid">
      <button class="addbtn" onclick="addSticker('✦')"><span class="ic">✦</span>Spark</button>
      <button class="addbtn" onclick="addSticker('❋')"><span class="ic">❋</span>Bloom</button>
      <button class="addbtn" onclick="addSticker('✿')"><span class="ic">✿</span>Flower</button>
      <button class="addbtn" onclick="addSticker('❁')"><span class="ic">❁</span>Petal</button>
      <button class="addbtn" onclick="addSticker('⚜')"><span class="ic">⚜</span>Motif</button>
      <button class="addbtn" onclick="addSticker('❖')"><span class="ic">❖</span>Gem</button>
      <button class="addbtn" onclick="addSticker('★')"><span class="ic">★</span>Star</button>
      <button class="addbtn" onclick="addSticker('☾')"><span class="ic">☾</span>Moon</button>
      <button class="addbtn" onclick="addSticker('❦')"><span class="ic">❦</span>Leaf</button>
      <button class="addbtn" onclick="addSticker('➤')"><span class="ic">➤</span>Arrow</button>
      <button class="addbtn" onclick="addSticker('❤')"><span class="ic">❤</span>Heart</button>
      <button class="addbtn" onclick="addSticker('◆◆◆')"><span class="ic">◆</span>Divider</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <canvas id="c" width="1080" height="1350"></canvas>
    <div class="ztools">
      <button onclick="zoom(-1)">−</button><span id="zlbl">Fit</span><button onclick="zoom(1)">＋</button>
      <button onclick="zoomFit()" style="font-size:10px">Fit</button>
    </div>
  </div>
  <div class="insp">
    <div class="itabs">
      <button class="on" data-it="props" onclick="itab('props')">Edit</button>
      <button data-it="layers" onclick="itab('layers')">Layers</button>
      <button data-it="canvas" onclick="itab('canvas')">Canvas</button>
    </div>
    <div class="ibody">
      <div id="it-props"></div>
      <div id="it-layers" class="hidden"></div>
      <div id="it-canvas" class="hidden"></div>
    </div>
  </div>
</div>
<input type="file" id="photoIn" accept="image/*" class="hidden" onchange="onPhoto(this.files[0]);this.value=''">
<input type="file" id="bgIn" accept="image/*" class="hidden" onchange="onBgImage(this.files[0]);this.value=''">
<script>
"use strict";
const $=id=>document.getElementById(id);
const BR={purple:"#5B2D8E",deep:"#4A2D82",lav:"#7B5EA7",gold:"#C4963A",cream:"#F4ECDD",ink:"#14091F",white:"#FFFFFF"};
const PALETTE=["#5B2D8E","#4A2D82","#7B5EA7","#C4963A","#F4ECDD","#FFFFFF","#14091F","#B3372C","#1f9d55","#E8D5B0"];
const FONTS=["Jost","Cormorant Garamond","Playfair Display","Georgia","Arial"];

const D={w:1080,h:1350,bg:{type:"solid",c1:"#FFFFFF",c2:"#EDE6FA",angle:90},layers:[],sel:null,zoomScale:null};
let uid=1; const nid=()=>"L"+(uid++);
const cv=$("c"); const ctx=cv.getContext("2d");

function mk(type,o){return Object.assign({id:nid(),type,x:80,y:80,w:300,h:120,opacity:1,visible:true,name:type},o);}
function addLayer(l,select){commit(); D.layers.push(l); if(select!==false)D.sel=l.id; sync(); return l;}
function addText(o){return addLayer(mk("text",Object.assign({name:"Text",text:"Your text",font:"Jost",size:54,color:BR.deep,weight:"700",align:"center",x:D.w*0.5-300,y:D.h*0.5-40,w:600,h:80,lh:1.15},o)));}
function addLogo(){return addLayer(mk("text",{name:"Logo",text:"VASTRANGAM",font:"Cormorant Garamond",size:46,color:BR.gold,weight:"700",align:"center",letter:6,x:D.w*0.5-300,y:60,w:600,h:60}));}
function addRect(o){return addLayer(mk("rect",Object.assign({name:"Box",fill:BR.purple,radius:18,strokeW:0,stroke:BR.gold,x:D.w*0.5-200,y:D.h*0.5-80,w:400,h:160},o)));}
function addLine(){return addLayer(mk("rect",{name:"Line",fill:BR.gold,radius:4,strokeW:0,x:D.w*0.5-180,y:D.h*0.5,w:360,h:8}));}
function addSticker(ch){return addLayer(mk("text",{name:"Element",text:ch,font:"Georgia",size:150,color:BR.gold,weight:"400",align:"center",x:D.w*0.5-200,y:D.h*0.5-110,w:400,h:220,lh:1}));}
function addEllipse(o){return addLayer(mk("ellipse",Object.assign({name:"Circle",fill:BR.gold,strokeW:0,stroke:"#fff",x:D.w*0.5-110,y:D.h*0.5-110,w:220,h:220},o)));}
function addPriceBadge(){const r=addRect({name:"Price bg",fill:BR.deep,radius:60,x:D.w-360,y:D.h-220,w:300,h:104}); addText({name:"Price",text:"₹ 2,499",color:"#fff",size:46,weight:"800",x:r.x,y:r.y+28,w:r.w,align:"center"}); D.sel=r.id; sync();}
function addSaleBadge(){const e=addEllipse({name:"Sale bg",fill:BR.gold,x:60,y:60,w:220,h:220}); addText({name:"Sale %",text:"50%\nOFF",color:"#fff",size:52,weight:"800",x:e.x,y:e.y+58,w:e.w,align:"center",lh:1}); D.sel=e.id; sync();}

function addProductPhoto(){$("photoIn").click();}
function onPhoto(file){
  if(!file) return;
  const rd=new FileReader();
  rd.onload=e=>{const im=new Image(); im.onload=()=>{
    const sel=D.layers.find(l=>l.id===D.sel);
    if(sel&&sel.type==="image"){commit();sel.img=im;sel.iw=im.naturalWidth;sel.ih=im.naturalHeight;sync();return;}
    const sc=Math.min((D.w*0.8)/im.naturalWidth,(D.h*0.55)/im.naturalHeight);
    addLayer(mk("image",{name:"Product",img:im,iw:im.naturalWidth,ih:im.naturalHeight,radius:0,
      w:im.naturalWidth*sc,h:im.naturalHeight*sc,x:(D.w-im.naturalWidth*sc)/2,y:(D.h-im.naturalHeight*sc)/2}));
  }; im.src=e.target.result;};
  rd.readAsDataURL(file);
}

function paintBg(c,W,H){
  if(D.bg.type==="gradient"){const g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,D.bg.c1); g.addColorStop(1,D.bg.c2); c.fillStyle=g;}
  else c.fillStyle=D.bg.c1;
  c.fillRect(0,0,W,H);
  if(D.bg.image){const im=D.bg.image,iw=im.naturalWidth,ih=im.naturalHeight,s=Math.max(W/iw,H/ih),dw=iw*s,dh=ih*s; c.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh);}
}
function roundRectPath(c,x,y,w,h,r){r=Math.max(0,Math.min(r,Math.min(w,h)/2)); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();}
function wrapLines(c,text,maxW){const out=[]; String(text).split("\n").forEach(para=>{const words=para.split(" "); let line=""; words.forEach(w=>{const t=line?line+" "+w:w; if(c.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}); out.push(line);}); return out;}
function measLetter(c,str,sp){let w=0; for(const ch of str)w+=c.measureText(ch).width+sp; return w-sp;}
function drawLayer(c,l){
  c.save(); c.globalAlpha=l.opacity!=null?l.opacity:1;
  if(l.type==="rect"){roundRectPath(c,l.x,l.y,l.w,l.h,l.radius||0); c.fillStyle=l.fill; c.fill(); if(l.strokeW>0){c.lineWidth=l.strokeW;c.strokeStyle=l.stroke;c.stroke();}}
  else if(l.type==="ellipse"){c.beginPath(); c.ellipse(l.x+l.w/2,l.y+l.h/2,l.w/2,l.h/2,0,0,Math.PI*2); c.fillStyle=l.fill; c.fill(); if(l.strokeW>0){c.lineWidth=l.strokeW;c.strokeStyle=l.stroke;c.stroke();}}
  else if(l.type==="image"&&l.img){if(l.radius>0){roundRectPath(c,l.x,l.y,l.w,l.h,l.radius);c.clip();} const s=Math.max(l.w/l.iw,l.h/l.ih),dw=l.iw*s,dh=l.ih*s; c.drawImage(l.img,l.x+(l.w-dw)/2,l.y+(l.h-dh)/2,dw,dh);}
  else if(l.type==="text"){
    c.fillStyle=l.color; c.textBaseline="top"; c.font=`${l.weight||"600"} ${l.size}px '${l.font}', sans-serif`; c.textAlign=l.align||"left";
    const lines=wrapLines(c,l.text,l.w), lh=l.size*(l.lh||1.15), tx=l.align==="center"?l.x+l.w/2:l.align==="right"?l.x+l.w:l.x;
    lines.forEach((ln,i)=>{
      if(l.letter){let cx=l.align==="center"?l.x+(l.w-measLetter(c,ln,l.letter))/2:l.x; c.textAlign="left"; for(const ch of ln){c.fillText(ch,cx,l.y+i*lh); cx+=c.measureText(ch).width+l.letter;} c.textAlign=l.align||"left";}
      else c.fillText(ln,tx,l.y+i*lh);
    });
  }
  c.restore();
}
function renderAll(forExport){
  cv.width=D.w; cv.height=D.h; paintBg(ctx,D.w,D.h);
  D.layers.forEach(l=>{if(l.visible!==false)drawLayer(ctx,l);});
  if(!forExport&&D.sel){const l=D.layers.find(x=>x.id===D.sel); if(l)drawSelection(ctx,l);}
}
function drawSelection(c,l){
  c.save(); c.strokeStyle="#5B2D8E"; c.lineWidth=Math.max(2,D.w/360); c.setLineDash([12,8]); c.strokeRect(l.x,l.y,l.w,l.h); c.setLineDash([]);
  const hs=Math.max(22,D.w/42);
  [[l.x,l.y],[l.x+l.w,l.y],[l.x,l.y+l.h],[l.x+l.w,l.y+l.h]].forEach(([hx,hy])=>{c.fillStyle="#fff";c.strokeStyle="#5B2D8E";c.lineWidth=Math.max(2,D.w/420);c.beginPath();c.rect(hx-hs/2,hy-hs/2,hs,hs);c.fill();c.stroke();});
  c.restore();
}

let drag=null;
function toXY(e){const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*(cv.width/r.width),y:(e.clientY-r.top)*(cv.height/r.height)};}
function hitHandle(l,p){const hs=Math.max(22,D.w/42),t=hs*0.9; const C={tl:[l.x,l.y],tr:[l.x+l.w,l.y],bl:[l.x,l.y+l.h],br:[l.x+l.w,l.y+l.h]}; for(const k in C){const[cx,cy]=C[k]; if(Math.abs(p.x-cx)<=t&&Math.abs(p.y-cy)<=t)return k;} return null;}
function topAt(p){for(let i=D.layers.length-1;i>=0;i--){const l=D.layers[i]; if(l.visible===false)continue; if(p.x>=l.x&&p.x<=l.x+l.w&&p.y>=l.y&&p.y<=l.y+l.h)return l;} return null;}
cv.addEventListener("pointerdown",e=>{
  e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(_){} const p=toXY(e);
  const sel=D.layers.find(l=>l.id===D.sel);
  if(sel){const h=hitHandle(sel,p); if(h){drag={mode:"resize",h,l:sel,sx:p.x,sy:p.y,ox:sel.x,oy:sel.y,ow:sel.w,oh:sel.h}; return;}}
  const t=topAt(p);
  if(t){D.sel=t.id; drag={mode:"move",l:t,sx:p.x,sy:p.y,ox:t.x,oy:t.y}; sync();}
  else {D.sel=null; drag=null; sync();}
});
cv.addEventListener("pointermove",e=>{
  if(!drag) return; e.preventDefault(); if(!drag.committed){commit();drag.committed=true;} const p=toXY(e),dx=p.x-drag.sx,dy=p.y-drag.sy,l=drag.l;
  if(drag.mode==="move"){l.x=drag.ox+dx; l.y=drag.oy+dy;}
  else {let{ox,oy,ow,oh}=drag,nx=ox,ny=oy,nw=ow,nh=oh;
    if(drag.h.includes("r"))nw=Math.max(20,ow+dx);
    if(drag.h.includes("l")){nw=Math.max(20,ow-dx);nx=ox+(ow-nw);}
    if(drag.h.includes("b"))nh=Math.max(20,oh+dy);
    if(drag.h.includes("t")){nh=Math.max(20,oh-dy);ny=oy+(oh-nh);}
    l.x=nx;l.y=ny;l.w=nw;l.h=nh;}
  renderAll();
});
function endDrag(){if(drag){drag=null; sync();}}
cv.addEventListener("pointerup",endDrag); cv.addEventListener("pointercancel",endDrag);

let curTab="props";
function itab(t){curTab=t; document.querySelectorAll(".itabs button").forEach(b=>b.classList.toggle("on",b.dataset.it===t)); ["props","layers","canvas"].forEach(x=>$("it-"+x).classList.toggle("hidden",x!==t)); sync();}
function sync(){renderAll(); if(curTab==="props")renderProps(); else if(curTab==="layers")renderLayers(); else renderCanvasPanel();}
function field(label,html){return `<label class="fl">${label}</label>${html}`;}
function swatches(cb){return `<div class="sw">${PALETTE.map(c=>`<button style="background:${c}" onclick="${cb}('${c}')"></button>`).join("")}<input type="color" oninput="${cb}(this.value)" title="Pick any colour" style="width:24px;height:24px;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);border-radius:6px;cursor:pointer"></div>`;}
function renderProps(){
  const box=$("it-props"); const l=D.layers.find(x=>x.id===D.sel);
  if(!l){box.innerHTML=`<div class="empty">Tap an element on the canvas to edit it.<br><br>Or pick a <b>template</b> on the left and start from there.</div>`; return;}
  let h="";
  if(l.type==="text"){
    h+=field("Text",`<textarea class="inp" oninput="upd('text',this.value)">${String(l.text||"").replace(/</g,"&lt;")}</textarea>`);
    h+=field("Font",`<select class="inp" onchange="upd('font',this.value)">${FONTS.map(f=>`<option ${f===l.font?"selected":""}>${f}</option>`).join("")}</select>`);
    h+=field("Size",`<div class="slider"><div class="t"><span>Size</span><span>${Math.round(l.size)}</span></div><input type="range" min="14" max="220" value="${l.size}" oninput="upd('size',+this.value)"></div>`);

  h+=field("Position &amp; size",`<div class="row"><input class="inp" type="number" value="${Math.round(l.x)}" oninput="upd('x',+this.value)" title="X"><input class="inp" type="number" value="${Math.round(l.y)}" oninput="upd('y',+this.value)" title="Y"></div><div class="row" style="margin-top:4px"><input class="inp" type="number" value="${Math.round(l.w)}" oninput="upd('w',+this.value)" title="Width"><input class="inp" type="number" value="${Math.round(l.h)}" oninput="upd('h',+this.value)" title="Height"></div>`);

function dupe(){const l=L(); if(!l)return; commit(); const c=Object.assign({},l); c.id=nid(); c.x+=24; c.y+=24; c.name=(l.name||l.type)+" copy"; D.layers.push(c); D.sel=c.id; sync();}
function order(dir){const i=D.layers.findIndex(l=>l.id===D.sel); if(i<0)return; const j=i+dir; if(j<0||j>=D.layers.length)return; commit(); const t=D.layers[i]; D.layers[i]=D.layers[j]; D.layers[j]=t; sync();}

// ===== AI ASSIST =====
// On-device draft generator (no API). Suggests HUMANIZED, on-brand copy from a short
// brief and applies it to the current design's text layers. The `genCopy()` function is
// the single hook to swap in Claude Fable 5 later for full humanized generation.
const COLOR_MAP=[["lavender","Dusty Lilac"],["purple","Regal Amethyst"],["blue","Royal Indigo"],["green","Emerald Isle"],["pink","Blush Petal"],["red","Ruby Wine"],["yellow","Saffron Gold"],["gold","Champagne Gold"],["white","Pearl Mist"],["black","Midnight Onyx"],["orange","Rust Terracotta"],["teal","Peacock Teal"],["maroon","Pomegranate"],["cream","Ivory Cream"]];
const OCC=[
 {k:["wedding","bridal","dulhan","shaadi","vidaai"],head:["The day everything changes","The one she'll remember forever","Made for your forever"],sub:"Handcrafted in Surat · Custom-fit on request",cta:"DM to reserve yours"},
 {k:["sangeet"],head:["The night the room turned to look","Dance like the whole city's watching"],sub:"Move-with-you drape · Made in Surat",cta:"DM 'SANGEET' to book"},
 {k:["mehendi","haldi"],head:["Sunlight, henna, and you","The calm before the celebration"],sub:"Breathable · Daytime-ready · Custom-fit",cta:"DM to pick your fit"},
 {k:["diwali","festive","navratri","teej","eid","festival"],head:["Light the room before you enter it","Arrive as the celebration"],sub:"Festive-ready · Handcrafted in Surat",cta:"Shop the Festive Edit"},
 {k:["party","reception","cocktail"],head:["Own every glance in the room","The outfit that ends the debate"],sub:"Statement drape · Custom-fit on request",cta:"DM to reserve"},
 {k:[""],head:["Crafted for moments that matter","Desire to Attire"],sub:"Handcrafted in Surat · Worn everywhere",cta:"Shop now · vastrangam.com"}
];
function genCopy(brief){
  const b=(brief||"").toLowerCase();
  let o=OCC[OCC.length-1];
  for(const cand of OCC){ if(cand.k.some(w=>w&&b.includes(w))){o=cand;break;} }
  let colour=""; for(const[k,v]of COLOR_MAP){ if(b.includes(k)){colour=v;break;} }
  const pm=b.match(/(?:₹|rs\.?|inr)?\s?(\d{3,6})/); const price=pm?("₹ "+Number(pm[1]).toLocaleString("en-IN")):"₹ 2,499";
  const head=o.head[Math.floor(Math.random()*o.head.length)];
  const sub=(colour?colour+" · ":"")+o.sub;
  return {headline:head, sub, price, cta:o.cta+" · vastrangam.com"};
}
function applyCopy(c){
  const setBy=(names,val)=>{ for(const l of D.layers){ if(l.type==="text"&&names.some(n=>(l.name||"").toLowerCase().includes(n))){l.text=val;} } };
  setBy(["headline","big","greeting"],c.headline);
  setBy(["sub","detail"],c.sub);
  setBy(["price"],c.price);
  setBy(["cta","foot","swipe"],c.cta);
  sync();
}

  const ov=document.createElement("div"); ov.id="aiOv";
  ov.style.cssText="position:fixed;inset:0;background:rgba(20,9,31,.6);backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px";
  ov.innerHTML=`<div style="background:#fff;border-radius:14px;max-width:420px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(43,10,94,.4);font-family:'Jost',sans-serif">
    <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:800;color:#4A2D82">✨ AI Assist</div>
    <div style="font-size:11px;color:#7a5fb0;margin:6px 0 12px;line-height:1.5">Describe the product, occasion and price. It drafts on-brand, humanized copy and fills the current design. <b>Tip:</b> pick a template first.</div>
    <textarea id="aiBrief" placeholder="e.g. Teal chinon Anarkali for a reception, ₹2499" style="width:100%;min-height:64px;border:1.5px solid #C9B8EA;border-radius:8px;padding:9px;font-size:13px;font-family:inherit;resize:vertical;color:#14091F"></textarea>
    <input id="aiKey" placeholder="Gemini API key (free · aistudio.google.com/apikey)" style="width:100%;margin-top:8px;padding:8px 10px;border:1.5px solid #C9B8EA;border-radius:8px;font-size:12px;font-family:inherit;color:#14091F">
    <div id="aiStatus" style="font-size:11px;color:#7a5fb0;font-weight:700;margin-top:7px;min-height:14px"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button onclick="closeAI()" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid #C9B8EA;background:#fff;color:#4A2D82;font-weight:700;cursor:pointer;font-family:inherit">Cancel</button>
      <button id="aiGo" onclick="runAI()" style="flex:2;padding:10px;border-radius:8px;border:none;background:linear-gradient(135deg,#5B2D8E,#7B5EA7);color:#fff;font-weight:800;cursor:pointer;font-family:inherit">Generate &amp; Apply</button>
    </div>
    <div style="font-size:9px;color:#9A86C4;margin-top:10px;line-height:1.5">With a key: real humanized copy (Gemini free · shares the key you set in the AI Content Engine). Leave key blank for a quick on-device draft.</div>
  </div>`;
  ov.onclick=e=>{if(e.target===ov)closeAI();};
  document.body.appendChild(ov);
  const c=aiCfg(); const kf=document.getElementById("aiKey"); if(kf&&c.key)kf.value=c.key;
  document.getElementById("aiBrief").focus();
}
function closeAI(){const o=document.getElementById("aiOv");if(o)o.remove();}
function aiCfg(){try{return JSON.parse(localStorage.getItem("vastra_ai_cfg"))||{}}catch(e){return{}}}
async function runAI(){
  const brief=document.getElementById("aiBrief").value.trim();
  const key=document.getElementById("aiKey").value.trim();
  const st=document.getElementById("aiStatus"), go=document.getElementById("aiGo");
  if(!key){ applyCopy(genCopy(brief)); closeAI(); return; }           // offline fallback
  const c=aiCfg(); c.key=key; c.keys=c.keys||{}; c.keys[c.provider||"gemini"]=key; c.provider=c.provider||"gemini"; c.model=c.model||"gemini-2.0-flash"; localStorage.setItem("vastra_ai_cfg",JSON.stringify(c));
  st.textContent="Writing humanized copy…"; go.disabled=true;
  try{
    const sys=`You write ONE short piece of on-brand copy for a Vastrangam (Surat ethnic wear) design. Humanized, emotional, warm. NO product-noun openers, no AI cliches ("elevate","timeless","must-have","turn heads"). Return STRICT JSON only, no markdown: {"headline":"3-6 words, a feeling not the product","sub":"one short human line","price":"₹ formatted, or empty","cta":"short human CTA ending with vastrangam.com"}`;
    const raw=await aiCall(c.provider,key,c.model,sys,"Brief: "+(brief||"a festive Vastrangam outfit"));
    const j=JSON.parse((raw.match(/\{[\s\S]*\}/)||[raw])[0]);
    applyCopy({headline:j.headline||"",sub:j.sub||"",price:j.price||"",cta:j.cta||""});
    closeAI();
  }catch(e){ st.textContent="AI error — used a quick draft ("+((e.message||e)+"").slice(0,60)+")"; applyCopy(genCopy(brief)); go.disabled=false; setTimeout(closeAI,1500); }
}
async function aiCall(prov,key,model,sys,user){
  if(prov==="claude"){const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:model||"claude-sonnet-5",max_tokens:600,system:sys,messages:[{role:"user",content:user}]})});const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||("HTTP "+r.status));return j.content.map(b=>b.text||"").join("");}
  if(prov==="openai"){const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:model||"gpt-4o-mini",max_tokens:600,messages:[{role:"system",content:sys},{role:"user",content:user}]})});const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||("HTTP "+r.status));return j.choices[0].message.content;}
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+(model||"gemini-2.0-flash")+":generateContent?key="+encodeURIComponent(key),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:sys+"\n\n"+user}]}],generationConfig:{temperature:0.95,maxOutputTokens:400}})});const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||("HTTP "+r.status));return j.candidates[0].content.parts.map(p=>p.text).join("");
}

/* ===== CANVA-STYLE FEATURES ===== */
// ---- Undo / Redo history ----
let undoStack=[], redoStack=[], lastKey={k:null,t:0};
function _snap(){return {layers:D.layers.map(l=>Object.assign({},l)),bg:Object.assign({},D.bg),sel:D.sel,w:D.w,h:D.h};}
function _restore(s){D.layers=s.layers.map(l=>Object.assign({},l));D.bg=Object.assign({},s.bg);D.sel=s.sel;D.w=s.w;D.h=s.h;applyZoom();sync();}
function commit(key){const now=Date.now(); if(key&&key===lastKey.k&&now-lastKey.t<700){lastKey.t=now;return;} undoStack.push(_snap()); if(undoStack.length>80)undoStack.shift(); redoStack=[]; lastKey={k:key||null,t:now};}
function resetHistory(){undoStack=[];redoStack=[];lastKey={k:null,t:0};}
function undo(){if(!undoStack.length)return; redoStack.push(_snap()); _restore(undoStack.pop());}
function redo(){if(!redoStack.length)return; undoStack.push(_snap()); _restore(redoStack.pop());}

// ---- Align selected element to the page ----
function alignH(pos){const l=L();if(!l)return;commit(); l.x = pos==='l'?0 : pos==='c'?(D.w-l.w)/2 : D.w-l.w; sync();}
function alignV(pos){const l=L();if(!l)return;commit(); l.y = pos==='t'?0 : pos==='m'?(D.h-l.h)/2 : D.h-l.h; sync();}

// ---- Background image (Canva-style upload) ----
function bgImageUpload(){$("bgIn").click();}
function onBgImage(file){if(!file)return;const rd=new FileReader();rd.onload=e=>{const im=new Image();im.onload=()=>{commit();D.bg.image=im;sync();};im.src=e.target.result;};rd.readAsDataURL(file);}
function clearBgImage(){commit();D.bg.image=null;sync();}

// ---- Export: PNG / JPG / PDF ----
function exportAs(fmt){
  if(fmt==='pdf'){ renderAll(true); const url=cv.toDataURL('image/png'); sync();
    const w=window.open(''); if(!w){alert('Allow pop-ups to export as PDF');return;}
    w.document.write('<html><head><title>Vastrangam Design</title><style>@page{margin:0}body{margin:0}img{width:100%;display:block}</style></head><body><img src="'+url+'" onload="setTimeout(function(){window.print()},250)"></body></html>'); w.document.close();
    if(typeof vosLog==="function")vosLog("export","Exported a design (PDF · "+D.w+"×"+D.h+")");
    return; }
  exportDesign(fmt);
}

// ---- Keyboard shortcuts ----
window.addEventListener('keydown',e=>{
  const tag=e.target.tagName; if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
  const ctrl=e.ctrlKey||e.metaKey;
  if(ctrl&&e.key.toLowerCase()==='z'){e.preventDefault(); e.shiftKey?redo():undo(); return;}
  if(ctrl&&e.key.toLowerCase()==='y'){e.preventDefault(); redo(); return;}
  if(ctrl&&e.key.toLowerCase()==='d'){e.preventDefault(); dupe(); return;}
  if(!D.sel) return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault(); delLayer(); return;}
  if(e.key==='Escape'){D.sel=null; sync(); return;}
  const l=L(); if(!l)return; const step=e.shiftKey?10:1;
  if(e.key==='ArrowLeft'){e.preventDefault();commit('nudge');l.x-=step;sync();}
  else if(e.key==='ArrowRight'){e.preventDefault();commit('nudge');l.x+=step;sync();}
  else if(e.key==='ArrowUp'){e.preventDefault();commit('nudge');l.y-=step;sync();}
  else if(e.key==='ArrowDown'){e.preventDefault();commit('nudge');l.y+=step;sync();}
});

function vosLog(type,msg){try{const a=JSON.parse(localStorage.getItem("vastra_activity"))||[];a.unshift({t:Date.now(),type,msg});localStorage.setItem("vastra_activity",JSON.stringify(a.slice(0,100)));}catch(e){}}

   +'<button id="vosDismiss" style="background:#fff;border:1.5px solid #C9B8EA;color:#4A2D82;border-radius:7px;padding:7px 10px;font-weight:700;cursor:pointer;font-family:inherit">✕</button>';
  document.body.appendChild(b);

  document.getElementById("vosDismiss").onclick=()=>b.remove();
})();
