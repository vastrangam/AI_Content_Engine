<style>/* Vanijo Suite — shared SmartHub-teal design system (system fonts). */
:root{
  --ink:#16302b;--ink2:#3c534e;--mut:#6f827d;
  --cream:#edf5f2;--cream2:#e0efe9;--paper:#fff;
  --gold:#0fae90;--gold-d:#0b8f76;--gold-soft:#d4f1e8;
  --emer:#12a06e;--emer-soft:#e0f3ea;
  --line:#dbe8e4;--line2:#c8ddd6;
  --grn:#12a06e;--red:#e5484d;--amb:#c26a2b;--peach-soft:#ffe7d3;
  --shadow:0 1px 2px rgba(16,42,36,.05),0 1px 3px rgba(16,42,36,.04);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--sans);font-weight:700;letter-spacing:-.01em;margin:0;color:var(--ink)}
.mono{font-family:var(--mono)}
.i{width:1em;height:1em;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.13em}
.app{display:grid;grid-template-columns:224px 1fr;grid-template-rows:54px 1fr;min-height:100vh}
.top{grid-column:1/3;background:#fff;color:var(--ink);display:flex;align-items:center;gap:10px;padding:0 16px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.top .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--ink)}
.top .logo .sm{width:26px;height:26px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.top .logo b{font-weight:800}.top .logo .ap{color:var(--mut);font-weight:600}
.tpill{background:#f3f4f6;border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:12px;color:var(--ink2)}
.tpill b{color:var(--ink)}.sp{flex:1}
.tavatar{width:30px;height:30px;border-radius:8px;background:var(--gold);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.hamb{display:none;background:none;border:none;color:var(--ink);cursor:pointer;padding:4px;margin:0 2px 0 -4px;align-items:center}
.side{background:#12312d;color:#a7c2bb;padding:8px 0;overflow-y:auto}
.side .gg{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#63837b;padding:13px 18px 5px;font-weight:600}
.side a{display:flex;align-items:center;gap:10px;padding:8px 18px;color:#b3cbc4;border-left:3px solid transparent;cursor:pointer;font-size:12.5px;font-weight:500}
.side a.on{background:#1c453e;color:#fff;border-left-color:#2dd4bf;font-weight:600}
.side a:hover{background:#183a34;color:#e6f2ee}
.side a .i{font-size:15px;opacity:.8}.side a.on .i{opacity:1;color:#2dd4bf}
.main{padding:18px 22px 40px;overflow-x:hidden;background:var(--cream)}
.navback{display:none}
.crumb{font-size:11px;color:var(--mut);margin-bottom:4px}
.h1row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:21px}.sub{font-size:12px;color:var(--mut);margin-top:3px}
.note{background:var(--gold-soft);border-bottom:1px solid #bfe6d9;color:var(--gold-d);font-size:11px;text-align:center;padding:6px;font-weight:600;border-radius:8px;margin-bottom:12px}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:6px;transition:.12s}
.btn:hover{background:#f7f8fa}
.btn.p{background:var(--gold);color:#fff;border-color:var(--gold)}.btn.p:hover{background:var(--gold-d)}
.btn.e{background:var(--emer);color:#fff;border-color:var(--emer)}
.btn.d{color:var(--red);border-color:#f2c9c9}.btn.d:hover{background:#fdeceb}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:active{transform:translateY(1px)}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel h3{font-size:13px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.badge{font-size:10.5px;font-weight:600;color:var(--gold-d);background:var(--gold-soft);border-radius:20px;padding:2px 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.kpis.k5{grid-template-columns:repeat(5,1fr)}.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px;box-shadow:var(--shadow)}
.kc .kchead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.kc .l{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kchip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 30px}
.kchip.c-teal{background:var(--gold-soft);color:var(--gold-d)}.kchip.c-green{background:var(--emer-soft);color:var(--emer)}
.kchip.c-blue{background:#dceafe;color:#2563eb}.kchip.c-peach{background:var(--peach-soft);color:var(--amb)}.kchip.c-red{background:#fde3e3;color:var(--red)}
.kc .v{font-size:20px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.kc .v.g{color:var(--grn)}.kc .v.r{color:var(--red)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:7px 9px;border-bottom:1px solid #eef0f3;text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:9.5px;text-transform:uppercase;color:var(--mut);letter-spacing:.04em;font-weight:600;background:#f1f7f5}
td.l,th.l{text-align:left}td.c,th.c{text-align:center}
tbody tr:hover{background:#f5faf8}
.g{color:var(--grn);font-weight:600}.r{color:var(--red);font-weight:600}
.tag{font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.02em;display:inline-block}
.t-grn{background:#d6f3e7;color:#0d8f66}.t-amb{background:#ffe7d3;color:#c2632b}.t-red{background:#fde3e3;color:#d83b40}.t-blu{background:#dceafe;color:#2563eb}.t-gray{background:#eef1f0;color:#6f827d}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form.f2{grid-template-columns:1fr 1fr}
.fld{display:flex;flex-direction:column;gap:4px}.fld.wide{grid-column:span 2}.fld.full{grid-column:1/-1}
.fld.end{justify-content:flex-end}
label{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600}
input,select,textarea{border:1px solid var(--line2);border-radius:7px;padding:8px 10px;font-size:12.5px;font-family:var(--sans);background:#fff;color:var(--ink)}
textarea{font-family:var(--mono);min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.cascade{background:#e6f5ef;border:1px solid #c2e7d8;border-radius:10px;padding:12px 14px;margin-top:12px;font-size:12px;color:var(--ink2)}
.cascade b{color:var(--ink)}.cascade .cl{display:flex;gap:8px;margin:6px 0;align-items:flex-start}
.cascade .d{width:18px;height:18px;border-radius:5px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;background:var(--emer)}
.hint{font-size:11px;color:var(--mut);margin-top:8px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:7px 0;border-bottom:1px solid #eef0f3}
.kv span{color:var(--mut)}.kv b{color:var(--ink);text-align:right}
.bar{height:8px;border-radius:6px;background:#e6efec;overflow:hidden}.bar>i{display:block;height:100%;background:var(--gold);border-radius:6px}
.pill{font-size:10.5px;padding:3px 9px;border-radius:6px;background:#eef1f5;color:var(--ink2);margin-right:5px}
.empty{color:var(--mut);font-size:12.5px;padding:8px 2px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#12312d;color:#fff;padding:10px 18px;border-radius:10px;font-size:12.5px;opacity:0;transition:opacity .2s;z-index:50;box-shadow:0 10px 30px rgba(16,42,36,.28)}
.toast.show{opacity:1}
@media print{.top,.side,.hamb,.h1row .btn,.btn{display:none!important}.app{display:block}.main{padding:0}}
@media(max-width:820px){
  .app{grid-template-columns:1fr}.hamb{display:inline-flex}
  .side{position:fixed;top:54px;left:0;bottom:0;width:250px;transform:translateX(-100%);transition:transform .22s;z-index:45;box-shadow:0 14px 44px rgba(16,42,36,.32)}
  .app.navopen .side{transform:none}
  .navback{position:fixed;inset:54px 0 0 0;background:rgba(16,42,36,.42);z-index:44}.app.navopen .navback{display:block}
  .kpis,.kpis.k5,.kpis.k3{grid-template-columns:1fr 1fr}.form,.form.f2,.two,.three{grid-template-columns:1fr}
}
</style></head><body>

<script>/* Medhava — Connectors: the no-lock-in layer, shared by every app in every module.

   THE RULE THIS ENFORCES
   No Medhava app may depend on one outside service. Every capability an app needs
   (books, channels, AI text, AI images, video, automation, courier, payments,
   messaging, storage, GST, printing, scanning) is declared as a CAPABILITY with a
   list of interchangeable PROVIDERS. You pick one; you can change it any time.

   Three guarantees, each checked by a self-test at every launch:
     1. Every capability has several alternatives — never one.
     2. Every capability has a BUILT-IN or MANUAL option, so the app works with
        nothing connected at all.
     3. Every capability has an option you can HOST YOURSELF, so you are never
        forced to send your data to somebody else's cloud.

   kind: 'built-in'  ships inside Medhava, needs nothing
         'self-host' you run it on your own machine or server
         'cloud'     somebody else's service, via a revocable scoped API key
         'manual'    a human does it, or a CSV goes in and out
*/

  var P = function (id, name, kind, note) { return { id: id, name: name, kind: kind, note: note || '' }; };

  var CAPS = [
    { id: 'ledger', name: 'Books & ledger', what: 'Where the accounting entries actually live.', providers: [
      P('medhava_books', 'Medhava Books', 'built-in', 'The ledger inside Medhava. Nothing else needed.'),
      P('tally', 'Tally', 'cloud', 'Two-way sync via XML/ODBC.'),

      P('marg', 'Marg', 'cloud', 'Two-way sync.'),
      P('zoho_books', 'Zoho Books', 'cloud', 'API sync.'),
      P('quickbooks', 'QuickBooks', 'cloud', 'API sync.'),
      P('erpnext', 'ERPNext', 'self-host', 'Run it on your own server.'),
      P('csv_ledger', 'CSV in / CSV out', 'manual', 'Export a file, hand it to your CA.') ] },

    { id: 'channels', name: 'Sales channels', what: 'Where orders and returns come from.', providers: [
      P('manual_orders', 'Type them in', 'manual', 'No integration at all. Works on day one.'),
      P('csv_orders', 'CSV import', 'manual', 'Download from any panel, drop the file in.'),
      P('amazon', 'Amazon', 'cloud', 'SP-API, scoped key.'),
      P('flipkart', 'Flipkart', 'cloud', 'Seller API, scoped key.'),
      P('myntra', 'Myntra', 'cloud', 'Partner API, scoped key.'),
      P('meesho', 'Meesho', 'cloud', ''), P('ajio', 'Ajio', 'cloud', ''),
      P('nykaa', 'Nykaa', 'cloud', ''), P('jiomart', 'JioMart', 'cloud', ''),
      P('shopify', 'Shopify', 'cloud', ''), P('woocommerce', 'WooCommerce', 'self-host', 'Your own WordPress store.'),
      P('medusa', 'Medusa / self-hosted store', 'self-host', 'Your own storefront, your own server.') ] },

    { id: 'ai_text', name: 'AI writing', what: 'Titles, descriptions, replies, summaries.', providers: [
      P('templates', 'Medhava templates', 'built-in', 'Rule-based text. No AI, no internet, no cost.'),
      P('ollama', 'Ollama (on your own machine)', 'self-host', 'A local model. Nothing leaves your computer.'),
      P('llama', 'Llama (self-hosted)', 'self-host', 'Your own GPU or server.'),
      P('mistral_self', 'Mistral (self-hosted)', 'self-host', ''),
      P('claude', 'Anthropic Claude', 'cloud', ''), P('openai', 'OpenAI GPT', 'cloud', ''),
      P('gemini', 'Google Gemini', 'cloud', ''), P('mistral', 'Mistral (cloud)', 'cloud', ''),
      P('deepseek', 'DeepSeek', 'cloud', ''), P('groq', 'Groq', 'cloud', ''),
      P('write_it', 'Write it yourself', 'manual', 'The app still does everything else.') ] },

    { id: 'ai_image', name: 'AI images', what: 'Product shots, banners, catalogue images.', providers: [
      P('upload_img', 'Upload your own', 'manual', 'Your photographer, your phone. Always available.'),
      P('sd_self', 'Stable Diffusion (self-hosted)', 'self-host', 'ComfyUI or Automatic1111 on your own machine.'),
      P('flux_self', 'Flux (self-hosted)', 'self-host', ''),

      P('dalle', 'OpenAI images', 'cloud', ''), P('imagen', 'Google Imagen', 'cloud', ''),
      P('firefly', 'Adobe Firefly', 'cloud', ''), P('canva', 'Canva', 'cloud', ''),
      P('studio', 'Medhava Image Studio', 'built-in', 'Crop, resize, watermark, channel-size presets — no AI needed.') ] },

    { id: 'ai_video', name: 'Video', what: 'Reels, product videos, ads.', providers: [
      P('upload_vid', 'Upload your own', 'manual', 'Shot on a phone is fine.'),
      P('ffmpeg', 'Medhava video templates (FFmpeg)', 'built-in', 'Stills + music + text, rendered locally.'),
      P('comfy_vid', 'ComfyUI video (self-hosted)', 'self-host', ''),
      P('runway', 'Runway', 'cloud', ''), P('pika', 'Pika', 'cloud', ''),
      P('luma', 'Luma', 'cloud', ''), P('kling', 'Kling', 'cloud', ''),

  ];

  var byId = {}; CAPS.forEach(function (c) { byId[c.id] = c; });
  function cap(id) { return byId[id]; }
  function prov(capId, pid) { var c = cap(capId); if (!c) return null;
    var m = c.providers.filter(function (p) { return p.id === pid; }); return m[0] || null; }
  /* the default is always something that needs nothing outside Medhava */
  function defaultOf(capId) { var c = cap(capId);
    var b = c.providers.filter(function (p) { return p.kind === 'built-in'; })[0];
    return (b || c.providers.filter(function (p) { return p.kind === 'manual'; })[0] || c.providers[0]).id; }

  function seed(DB, uses) { DB.prov = DB.prov || {};
    (uses || []).forEach(function (id) { if (cap(id) && !DB.prov[id]) DB.prov[id] = defaultOf(id); }); }
  function active(DB, capId) { return (DB.prov || {})[capId] || defaultOf(capId); }

  var KIND = { 'built-in': ['grn', 'built in'], 'self-host': ['blu', 'you host it'],
               'cloud': ['amb', 'their cloud'], 'manual': ['gray', 'by hand'] };

  function view(H, DB, uses) {
    uses = (uses || []).filter(function (id) { return !!cap(id); });
    var alts = uses.reduce(function (s, id) { return s + cap(id).providers.length; }, 0);
    var noNet = uses.filter(function (id) { var k = prov(id, active(DB, id)); return k && (k.kind === 'built-in' || k.kind === 'manual'); }).length;

    return H.head('Connectors · Alternatives', 'Connectors',
      'Everything this app touches, and every alternative you can use for it. Nothing is locked to one company.') +
      H.note('<b>The promise, in one line:</b> no Medhava app depends on any single outside service. ' +
        'Every capability below has a built-in or by-hand option, and at least one option you can run on your own machine.') +
      H.kpis([
        { l: 'Capabilities used', v: uses.length, d: 'by this app', icon: 'layers', tone: 'teal' },
        { l: 'Alternatives available', v: alts, d: 'to choose from', icon: 'sync', tone: 'blue' },
        { l: 'Outside services required', v: 0, d: 'none, ever', cls: 'g', icon: 'check', tone: 'green' },
        { l: 'Running with nothing connected', v: noNet + ' / ' + uses.length, d: 'right now', cls: noNet === uses.length ? 'g' : '', icon: 'shield', tone: 'peach' }
      ], '') +
      H.panel('At a glance', H.table([
        { label: 'Capability', align: 'l', fmt: function (r) { return '<b>' + H.esc(r.name) + '</b><div class="hint">' + H.esc(r.what) + '</div>'; } },
        { label: 'You are using', align: 'l', fmt: function (r) { var p = prov(r.id, active(DB, r.id));
          return H.esc(p.name) + ' ' + H.tag(KIND[p.kind][1], KIND[p.kind][0]); } },
        { label: 'Alternatives', fmt: function (r) { return cap(r.id).providers.length; }, cellcls: 'mono' },
        { label: 'Works with nothing connected', align: 'l', fmt: function (r) {
          return cap(r.id).providers.some(function (p) { return p.kind === 'built-in' || p.kind === 'manual'; })
            ? H.tag('yes', 'grn') : H.tag('no', 'red'); } },
        { label: 'Can you host it yourself', align: 'l', fmt: function (r) {
          return cap(r.id).providers.some(function (p) { return p.kind === 'self-host' || p.kind === 'built-in'; })
            ? H.tag('yes', 'grn') : H.tag('no', 'red'); } }
      ], uses.map(function (id) { return cap(id); }))) +
      uses.map(function (id) {
        var c = cap(id), a = active(DB, id);
        return H.panel(H.esc(c.name) + ' <span class="badge">' + c.providers.length + ' choices</span>',
          '<p class="hint">' + H.esc(c.what) + ' Click any one to switch. Your figures do not change — only where the data comes from.</p>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          c.providers.map(function (p) {
            return '<button class="btn sm' + (p.id === a ? ' p' : '') + '" data-act="connpick" data-c="' + id + '" data-p="' + p.id + '">' +
              H.esc(p.name) + '</button>';
          }).join('') + '</div>' +
          H.table([
            { label: 'Option', align: 'l', fmt: function (p) { return (p.id === a ? '<b>' + H.esc(p.name) + '</b>' : H.esc(p.name)); } },
            { label: 'Kind', align: 'l', fmt: function (p) { return H.tag(KIND[p.kind][1], KIND[p.kind][0]); } },
            { label: 'Note', align: 'l', fmt: function (p) { return H.esc(p.note || '—'); } },
            { label: '', align: 'l', fmt: function (p) { return p.id === a ? H.tag('in use', 'grn') : ''; } }
          ], c.providers));
      }).join('') +
      H.panel('Two things worth knowing',
        '<p><b>Switching a provider never changes a figure.</b> The arithmetic lives in Medhava, not in the service. ' +
        'Move from one courier to another and your shipping records stay exactly as they were — only new labels come from somewhere else.</p>' +
        '<p><b>Cloud services are connected with a scoped, revocable key — never your account password.</b> ' +
        'A key can be limited to just what it needs and cancelled in one click, from their side, without changing your login. ' +
        'Medhava will never ask you for a marketplace or bank password.</p>');
  }

  function actions(K) {
    return {
      connpick: function (b) { var DB = K.DB, c = b.getAttribute('data-c'), p = b.getAttribute('data-p');
        if (!prov(c, p)) return; DB.prov = DB.prov || {}; DB.prov[c] = p;
        K.save(); K.toast('Switched to ' + prov(c, p).name); K.render(); }
    };
  }

  function tests(t, DB, uses) {
    uses = (uses || []).filter(function (id) { return true; });
    t('every capability this app uses is a known one', uses.every(function (id) { return !!cap(id); }));
    t('no capability offers only one choice', uses.every(function (id) { return cap(id).providers.length >= 3; }));
    t('every capability works with nothing connected (built-in or by hand)', uses.every(function (id) {
      return cap(id).providers.some(function (p) { return p.kind === 'built-in' || p.kind === 'manual'; }); }));
    t('every capability has an option you can host yourself', uses.every(function (id) {
      return cap(id).providers.some(function (p) { return p.kind === 'self-host' || p.kind === 'built-in'; }); }));
    t('exactly one provider is active per capability', uses.every(function (id) {
      return !!prov(id, active(DB, id)); }));
    t('the default provider never needs an outside service', uses.every(function (id) {
      var p = prov(id, defaultOf(id)); return p.kind === 'built-in' || p.kind === 'manual'; }));
    t('no single company is unavoidable across capabilities', (function () {
      if (uses.length < 2) return true;
      var counts = {};
      uses.forEach(function (id) { cap(id).providers.forEach(function (p) { counts[p.name] = (counts[p.name] || 0) + 1; }); });
      /* a company appearing in every capability would be a hidden dependency */
      return !Object.keys(counts).some(function (n) { return counts[n] >= uses.length && uses.length > 1; });
    })());
    if (uses.length) {
      var id = uses[0], c = cap(id), was = active(DB, id);
      var other = c.providers.filter(function (p) { return p.id !== was; })[0];
      var before = JSON.stringify(Object.keys(DB).filter(function (k) { return k !== 'prov'; }).sort()
        .map(function (k) { return [k, DB[k]]; }));
      DB.prov[id] = other.id;
      t('switching a provider changes which one is active', active(DB, id) === other.id);
      t('switching a provider changes nothing else in your data',
        JSON.stringify(Object.keys(DB).filter(function (k) { return k !== 'prov'; }).sort()
          .map(function (k) { return [k, DB[k]]; })) === before);
      DB.prov[id] = was;
    }
  }

  var API = { CAPS: CAPS, cap: cap, prov: prov, defaultOf: defaultOf, seed: seed, active: active,
              view: view, actions: actions, tests: tests };
  if (typeof window !== 'undefined') window.MedhavaProviders = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})();

<script>/* Medhava Suite kernel — shared UI runtime + components + store + self-tests.
   An app is a spec: { id,name,company,fy, groups?, nav[], seed(DB), views{}, actions{}, tests(t,DB) }. */
(function(){
  var r2=function(n){return Math.round((Number(n)+Number.EPSILON)*100)/100;};
  var num=function(n){return (n==null||n===''||isNaN(n))?0:Number(n);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var money=function(n){n=r2(n);return (n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});};
  var inr=function(n){return Number(r2(n)).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});};
  var $=function(id){return document.getElementById(id);};

  var SPEC=null, state={view:null}, DB={}, KEY='';
  function toast(m){var t=$('toast');if(!t)return;t.textContent=m;t.className='toast show';clearTimeout(t._t);t._t=setTimeout(function(){t.className='toast';},2000);}
  function setStatus(s){var p=$('statusPill');if(p)p.textContent=s;}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));setStatus('saved ✓');}catch(e){setStatus('session only');}}
  function clearDB(){Object.keys(DB).forEach(function(k){delete DB[k];});}

  var H={
    esc:esc, money:money, inr:inr, r2:r2, num:num, toast:toast, val:function(id){var e=$(id);return e?e.value:'';}, numv:function(id){return num(H.val(id));},
    head:function(crumb,h1,sub,actions){return '<div class="crumb">'+esc(crumb)+'</div><div class="h1row"><div><h1>'+esc(h1)+'</h1><div class="sub">'+esc(sub||'')+'</div></div><div>'+(actions||'')+'</div></div>';},
    note:function(t){return '<div class="note">'+t+'</div>';},
    kpis:function(arr,cls){return '<div class="kpis '+(cls||'')+'">'+arr.map(function(k){
      var chip=k.icon?'<div class="kchip c-'+(k.tone||'teal')+'"><svg class="i"><use href="#s-'+k.icon+'"/></svg></div>':'';
      return '<div class="kc"><div class="kchead"><div class="l">'+esc(k.l)+'</div>'+chip+'</div><div class="v '+(k.cls||'')+'">'+k.v+'</div><div class="l" style="margin-top:4px;text-transform:none">'+esc(k.d||'')+'</div></div>';}).join('')+'</div>';},
    /* title is trusted markup (may contain badges/tags); callers must esc() any dynamic data placed in it. */
    panel:function(title,body,actions){return '<div class="panel"><h3>'+title+(actions?'<span>'+actions+'</span>':'')+'</h3>'+body+'</div>';},
    table:function(cols,rows){
      var th=cols.map(function(c){return '<th class="'+(c.align||'')+'">'+esc(c.label||'')+'</th>';}).join('');
      var body=rows.length?rows.map(function(row){return '<tr>'+cols.map(function(c){
        var v=c.fmt?c.fmt(row):row[c.k]; var cls=(c.align||'')+(c.cellcls?' '+(typeof c.cellcls==='function'?c.cellcls(row):c.cellcls):'');
        return '<td class="'+cls+'">'+(v==null?'':v)+'</td>';}).join('')+'</tr>';}).join('')
        :'<tr><td class="l" colspan="'+cols.length+'"><div class="empty">No rows yet.</div></td></tr>';
      return '<table><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table>';
    },
    tag:function(text,tone){return '<span class="tag t-'+(tone||'gray')+'">'+esc(text)+'</span>';},
    bar:function(pct){pct=Math.max(0,Math.min(100,pct));return '<div class="bar"><i style="width:'+pct+'%"></i></div>';},
    fields:function(fields){return fields.map(function(f){
      if(f.type==='select'){var opts=(f.options||[]).map(function(o){var v=typeof o==='object'?o.v:o,l=typeof o==='object'?o.label:o;return '<option value="'+esc(v)+'"'+(f.value==v?' selected':'')+'>'+esc(l)+'</option>';}).join('');
        return '<div class="fld'+(f.wide?' wide':'')+(f.full?' full':'')+'"><label>'+esc(f.label)+'</label><select id="'+f.id+'">'+opts+'</select></div>';}
      if(f.type==='textarea') return '<div class="fld full"><label>'+esc(f.label)+'</label><textarea id="'+f.id+'">'+esc(f.value||'')+'</textarea></div>';
      return '<div class="fld'+(f.wide?' wide':'')+(f.full?' full':'')+'"><label>'+esc(f.label)+'</label><input id="'+f.id+'" type="'+(f.type==='num'?'number':(f.type||'text'))+'" value="'+esc(f.value==null?'':f.value)+'" '+(f.type==='num'?'step="0.01"':'')+' placeholder="'+esc(f.ph||'')+'"></div>';
    }).join('');},
    form:function(fields,submitLabel,act,cls){return '<div class="form '+(cls||'f2')+'">'+H.fields(fields)+'<div class="fld full" style="align-items:flex-end"><button class="btn p" data-act="'+act+'">'+esc(submitLabel)+'</button></div></div>';},
    go:function(v){go(v);}, save:function(){save();}, render:function(){render();}
  };

  function buildShell(){
    var groups=SPEC.groups||[{label:SPEC.name,items:SPEC.nav.map(function(n){return n.v;})}];
    var navMap={}; SPEC.nav.forEach(function(n){navMap[n.v]=n;});
    var nav=groups.map(function(g){return '<div class="gg">'+esc(g.label)+'</div>'+g.items.map(function(v){var n=navMap[v];return n?'<a data-v="'+v+'"><svg class="i"><use href="#s-'+(n.icon||'grid')+'"/></svg> '+esc(n.label)+'</a>':'';}).join('');}).join('');
    $('root').innerHTML='<div class="app" id="appRoot"><div class="top">'+
      '<button class="hamb" id="hamb"><svg class="i" style="width:22px;height:22px;stroke-width:2"><use href="#s-menu"/></svg></button>'+
      '<div class="logo"><span class="sm"><svg width="19" height="19" viewBox="0 0 40 40"><path d="M9 31V15l11 11 11-11v16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 5c.25 3.1.8 3.8 3.9 4.05-3.1.25-3.65.95-3.9 4.05-.25-3.1-.8-3.8-3.9-4.05C19.2 8.8 19.75 8.1 20 5z" fill="#fff"/></svg></span> <b>Medhava</b> <span class="ap">'+esc(SPEC.name)+'</span></div>'+
      '<div class="tpill">'+esc(SPEC.company||'Vastrangam')+'</div><div class="tpill">'+esc(SPEC.fy||'FY 2026-27')+'</div>'+
      '<span class="sp"></span><div class="tpill" id="statusPill">saved ✓</div><div class="tavatar">P</div></div>'+
      '<nav class="side" id="nav">'+nav+'</nav><main class="main" id="main"></main><div class="navback" id="navback"></div></div>';
    var root=$('appRoot');
    $('nav').addEventListener('click',function(e){var a=e.target.closest('a[data-v]');if(a)go(a.getAttribute('data-v'));});
    $('hamb').onclick=function(){root.classList.toggle('navopen');};
    $('navback').onclick=function(){root.classList.remove('navopen');};
    $('main').addEventListener('click',function(e){
      var g=e.target.closest('[data-go]'); if(g){go(g.getAttribute('data-go'));return;}
      var b=e.target.closest('[data-act]'); if(b){var fn=SPEC.actions[b.getAttribute('data-act')]; if(fn)fn(b); }
    });
  }
  function go(v){ if(v!=='backup'&&!(SPEC.views&&SPEC.views[v]))v=SPEC.nav[0].v; state.view=v; var r=$('appRoot'); if(r)r.classList.remove('navopen');
    [].forEach.call(document.querySelectorAll('#nav a[data-v]'),function(a){a.className=a.getAttribute('data-v')===v?'on':'';});
    render(); window.scrollTo(0,0);
  }
  function render(){ var v=state.view; $('main').innerHTML = v==='backup'?backupView():(SPEC.views[v]||SPEC.views[SPEC.nav[0].v])(); }

  function backupView(){
    var t=window.__selftest||{pass:0,fail:0,log:[]};
    var rows=t.log.map(function(l){return {s:l.ok?'<span class="tag t-grn">pass</span>':'<span class="tag t-red">fail</span>',n:esc(l.name)};});
    return H.head('System · Backup','Backup & Health','Your data lives in this browser. Export a JSON backup any time.')+
      H.panel('Data','<div style="display:flex;gap:9px;flex-wrap:wrap">'+
        '<button class="btn p" data-act="_export"><svg class="i"><use href="#s-save"/></svg> Export JSON</button>'+
        '<button class="btn" data-act="_import"><svg class="i"><use href="#s-sync"/></svg> Import JSON</button>'+
        '<button class="btn" data-act="_reseed">Reload demo data</button>'+
        '<button class="btn d" data-act="_wipe">Wipe all</button></div>')+
      H.panel('Self-tests <span class="badge">'+t.pass+'/'+(t.pass+t.fail)+' pass</span>',
        rows.length?H.table([{label:'',align:'l',k:'s'},{label:'Check',align:'l',k:'n'}],rows):'<div class="empty">No self-tests defined.</div>');
  }
  function download(name,text){var b=new Blob([text],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
  function pickFile(cb){var inp=$('fileIn');inp.value='';inp.onchange=function(){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){cb(rd.result);};rd.readAsText(f);};inp.click();}
  var builtins={
    _export:function(){download((SPEC.id||'medhava')+'-backup.json',JSON.stringify(DB,null,2));toast('Backup exported');},
    _import:function(){pickFile(function(txt){try{var o=JSON.parse(txt);clearDB();Object.assign(DB,o);save();toast('Imported ✓');go(SPEC.nav[0].v);}catch(e){toast('Bad file');}});},
    _reseed:function(){if(confirm('Reload demo data? This replaces current data.')){clearDB();SPEC.seed(DB);save();toast('Demo reloaded');go(SPEC.nav[0].v);}},
    _wipe:function(){if(confirm('Wipe ALL data?')){clearDB();save();toast('Wiped');go(SPEC.nav[0].v);}}
  };
  function runTests(){var log=[],pass=0,fail=0;function t(name,cond){var ok=!!cond;log.push({name:name,ok:ok});ok?pass++:fail++;}
    /* tests run against a deep COPY — a self-test must never mutate live data */
    var probe; try{probe=JSON.parse(JSON.stringify(DB));}catch(e){probe=DB;}
    try{if(SPEC.tests)SPEC.tests(t,probe);}catch(e){log.push({name:'tests threw: '+e.message,ok:false});fail++;}
    /* the no-lock-in guarantees are checked in every app, not just the ones that remember to */
    var PR=window.MedhavaProviders;
    if(PR&&SPEC.uses){try{PR.tests(t,probe,SPEC.uses);}catch(e){log.push({name:'connector tests threw: '+e.message,ok:false});fail++;}}
    window.__selftest={pass:pass,fail:fail,log:log};}

  /* Any spec that declares `uses:[capability,...]` automatically gets a Connectors screen,
     its provider defaults seeded, its switch action, and the three no-lock-in self-tests.
     Nothing per-app to remember, so no app can quietly become dependent on one service. */
  function wireProviders(spec){
    var PR=window.MedhavaProviders; if(!PR||!spec.uses||!spec.uses.length) return;
    var seed0=spec.seed;
    spec.seed=function(D){ seed0(D); PR.seed(D,spec.uses); };
    spec.views=spec.views||{};
    spec.views.connect=function(){ return PR.view(H,DB,spec.uses); };
    Object.assign(spec.actions,PR.actions(Medhava));
    if(!spec.nav.some(function(n){return n.v==='connect';}))
      spec.nav.push({v:'connect',label:'Connectors',icon:'plug'});
    if(spec.groups&&!spec.groups.some(function(g){return g.items.indexOf('connect')>=0;}))
      spec.groups.push({label:'Connectors',items:['connect']});
  }
  function boot(){
    KEY='medhava_'+(SPEC.id||'app')+'_v1'; var raw=null; try{raw=localStorage.getItem(KEY);}catch(e){}
    if(raw){try{var o=JSON.parse(raw);Object.assign(DB,o);}catch(e){}}
    if(!Object.keys(DB).length) SPEC.seed(DB);
    if(!SPEC.nav.some(function(n){return n.v==='backup';})) SPEC.nav.push({v:'backup',label:'Backup & Health',icon:'save'});
    if(SPEC.groups&&!SPEC.groups.some(function(g){return g.items.indexOf('backup')>=0;})) SPEC.groups.push({label:'System',items:['backup']});
    Medhava.DB=DB; runTests(); buildShell(); go(SPEC.nav[0].v); save();
  }
  window.Medhava={ H:H, esc:esc, money:money, inr:inr, r2:r2, num:num, toast:toast, DB:DB, save:save, go:go, render:render,
    app:function(spec){ SPEC=spec; spec.actions=Object.assign({},builtins,spec.actions||{}); Medhava.SPEC=spec;
      wireProviders(spec);
      if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot(); } };
})();

/* Medhava — Report Builder (Module 01 · App 2)

var K=typeof Medhava!=='undefined'?Medhava:{}; var H=K.H,money=K.money,inr=K.inr,num=K.num,r2=K.r2,esc=K.esc,toast=K.toast;
var CFG=(typeof CONFIG!=='undefined')?CONFIG:{};
function db(){return K.DB;}
var MONTHS=['2026-04','2026-05','2026-06','2026-07'];
var MLBL={'2026-04':'Apr 2026','2026-05':'May 2026','2026-06':'Jun 2026','2026-07':'Jul 2026'};

/* ── shared transactional seed: identical numbers in both builds ── */
function seedTxns(CH,ITEMS,PARTIES){
  var sales=[],i,c;
  var base={};
  base[CH[0]]=[182000,196000,211000,238000];
  base[CH[1]]=[128000,141000,133000,164000];
  base[CH[2]]=[96000,104000,118000,127000];

  base[CH[4]]=[52000,58000,61000,55000];

  for(i=0;i<MONTHS.length;i++){ for(c=0;c<CH.length;c++){

      {month:'2026-06',cat:'Rent',amount:42000},{month:'2026-06',cat:'Salaries',amount:101000},
      {month:'2026-06',cat:'Marketing',amount:44000},{month:'2026-06',cat:'Logistics',amount:31000},
      {month:'2026-07',cat:'Rent',amount:42000},{month:'2026-07',cat:'Salaries',amount:104000},
      {month:'2026-07',cat:'Marketing',amount:52000},{month:'2026-07',cat:'Logistics',amount:34000}],

    stock:ITEMS,

}

/* ── the five things you can report on ──

var SRC={
  sales:{label:'Sales',icon:'cart',
    note:'One row per channel per month. Returns are already taken off before "Net".',

    rows:function(DB){return (DB.sales||[]).map(function(r){
      return {channel:r.channel,monthLabel:MLBL[r.month],month:r.month,
              gross:num(r.gross),returns:num(r.returns),net:r2(num(r.gross)-num(r.returns)),units:num(r.units)};});}},
  money:{label:'Money owed',icon:'coin',
    note:'Customers who owe you and suppliers you owe, side by side, aged in days.',
    dims:[{k:'party',l:'Party'},{k:'type',l:'Direction'},{k:'status',l:'Status'}],

        amount:num(x.amount),status:x.days>60?'Very overdue':x.days>30?'Overdue':'On time'});});

    rows:function(DB){return (DB.stock||[]).map(function(x){
      return {sku:x.sku,name:x.name,qty:num(x.qty),rop:num(x.rop),cost:num(x.cost),value:r2(num(x.qty)*num(x.cost)),
              status:num(x.qty)<=num(x.rop)?'Reorder now':num(x.qty)<=num(x.rop)*2?'Getting low':'Comfortable'};});}},
  expenses:{label:'Running costs',icon:'scale',
    note:'Everything spent to keep the business running — not the cost of goods.',
    dims:[{k:'cat',l:'Cost head'},{k:'monthLabel',l:'Month'}],

var SRCKEYS=['sales','money','stock','expenses','production'];

function fieldsOf(src){var S=SRC[src];return S.dims.concat(S.measures);}
function isMeasure(src,k){return SRC[src].measures.some(function(m){return m.k===k;});}
function labelOf(src,k){var f=fieldsOf(src).filter(function(x){return x.k===k;})[0];return f?f.l:k;}

/* ── the report engine: one pure function, no screen involved ── */
function passes(row,f,src){
  var v=row[f.field];
  if(isMeasure(src,f.field)){
    var a=num(v),b=num(f.val);
    if(f.op==='>=')return a>=b; if(f.op==='<=')return a<=b;
    if(f.op==='>')return a>b;  if(f.op==='<')return a<b;
    return a===b;
  }
  var s=String(v==null?'':v).toLowerCase(), q=String(f.val==null?'':f.val).toLowerCase();
  if(f.op==='is')return s===q;
  if(f.op==='is not')return s!==q;
  return s.indexOf(q)>=0; /* contains */
}
function report(DB,def){
  var S=SRC[def.src]||SRC.sales, ms=S.measures;
  var all=S.rows(DB);
  var kept=all.filter(function(r){return (def.filters||[]).every(function(f){return passes(r,f,def.src);});});
  var out;
  if(def.group==='none'){
    out=kept.map(function(r){
      var v={};ms.forEach(function(m){v[m.k]=num(r[m.k]);});
      return {label:S.dims.map(function(d){return r[d.k];}).join(' · '),n:1,v:v};});
  }else{
    var map={},order=[];
    kept.forEach(function(r){
      var k=String(r[def.group]);
      if(!map[k]){map[k]={label:k,n:0,v:{}};ms.forEach(function(m){map[k].v[m.k]=0;});order.push(k);}
      map[k].n++; ms.forEach(function(m){map[k].v[m.k]=r2(map[k].v[m.k]+num(r[m.k]));});});
    out=order.map(function(k){return map[k];});
  }
  var sk=def.sort||ms[0].k, dir=def.dir==='asc'?1:-1;
  out.sort(function(a,b){
    if(sk==='label')return a.label<b.label?-dir:a.label>b.label?dir:0;
    if(sk==='n')return (a.n-b.n)*dir;
    return (num(a.v[sk])-num(b.v[sk]))*dir;});
  var total={label:'Total',n:kept.length,v:{}};
  ms.forEach(function(m){total.v[m.k]=r2(kept.reduce(function(s,r){return s+num(r[m.k]);},0));});
  var shown=out, limited=false;
  if(num(def.limit)>0&&out.length>num(def.limit)){shown=out.slice(0,num(def.limit));limited=true;}
  return {rows:shown,allRows:out,total:total,measures:ms,matched:kept.length,scanned:all.length,limited:limited};
}
function csv(rep,def){
  var head=[def.group==='none'?'Row':labelOf(def.src,def.group)].concat(rep.measures.map(function(m){return m.l;})).concat(['Records']);
  var lines=[head.map(q).join(',')];
  rep.rows.forEach(function(r){
    lines.push([q(r.label)].concat(rep.measures.map(function(m){return r.v[m.k];})).concat([r.n]).join(','));});
  lines.push([q('TOTAL')].concat(rep.measures.map(function(m){return rep.total.v[m.k];})).concat([rep.total.n]).join(','));
  return lines.join('\n');
  function q(s){s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
}
function fmtv(m,v){return m.money?money(v):String(v);}

function defaultDef(src){
  var S=SRC[src];
  return {src:src,group:S.dims[0].k,sort:S.measures[0].k,dir:'desc',limit:0,filters:[]};
}

/* Reports read the books and the channels, and go out as a file, an email or a print. */
var SPEC={
  uses:['ledger','channels','storage','email','printing'],
  id:CFG.id, name:CFG.name, company:CFG.company, fy:CFG.fy||'FY 2026-27', tagline:CFG.tagline, about:CFG.about,
  groups:[{label:'Reports',items:['build','lib','saved']},
          {label:'Wiring',items:['wiring']}],
  nav:[{v:'build',label:'Build a report',icon:'chart'},{v:'lib',label:'Ready-made',icon:'book'},
       {v:'saved',label:'My saved reports',icon:'save'},{v:'wiring',label:'Wiring',icon:'flow'}],
  seed:function(DB){
    var t=seedTxns(CFG.channels,JSON.parse(JSON.stringify(CFG.items)),CFG.parties);
    DB.sales=t.sales;DB.expenses=t.expenses;DB.production=t.production;
    DB.stock=t.stock;DB.receivables=t.receivables;DB.payables=t.payables;
    DB.draft=defaultDef('sales'); DB.saved=[];
  },
  views:{
    build:function(){var DB=db();var d=DB.draft||defaultDef('sales');var S=SRC[d.src];var rep=report(DB,d);
      var mx=Math.max.apply(null,rep.rows.map(function(r){return Math.abs(num(r.v[S.measures[0].k]));}).concat([1]))||1;
      var ff=fieldsOf(d.src);
      return H.head('Reports · Builder','Build a report','Pick what to look at, how to group it, and what to leave out. The answer appears straight away.')+
      /* 1 · source */
      H.panel('1 · What do you want to look at?',
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+SRCKEYS.map(function(k){
          return '<button class="btn'+(d.src===k?' p':'')+'" data-act="setsrc" data-s="'+k+'"><svg class="i"><use href="#s-'+SRC[k].icon+'"/></svg> '+esc(SRC[k].label)+'</button>';}).join('')+
        '</div><p class="hint" style="margin-top:9px">'+esc(S.note)+'</p>')+
      /* 2 · shape */
      H.panel('2 · How should it be arranged?',
        '<div class="form f4">'+H.fields([
          {id:'r_group',label:'Group the rows by',type:'select',value:d.group,
            options:S.dims.map(function(x){return {v:x.k,label:x.l};}).concat([{v:'none',label:'Do not group — show every record'}])},
          {id:'r_sort',label:'Sort by',type:'select',value:d.sort,
            options:[{v:'label',label:'Name (A–Z)'}].concat(S.measures.map(function(m){return {v:m.k,label:m.l};})).concat([{v:'n',label:'Number of records'}])},
          {id:'r_dir',label:'Order',type:'select',value:d.dir,options:[{v:'desc',label:'Biggest first'},{v:'asc',label:'Smallest first'}]},
          {id:'r_limit',label:'Show only top',type:'select',value:String(d.limit),
            options:[{v:'0',label:'All rows'},{v:'3',label:'Top 3'},{v:'5',label:'Top 5'},{v:'10',label:'Top 10'}]}
        ])+'<div class="fld full" style="align-items:flex-end"><button class="btn p" data-act="run"><svg class="i"><use href="#s-sync"/></svg> Run this report</button></div></div>')+
      /* 3 · filters */
      H.panel('3 · Leave anything out? <span class="badge">'+(d.filters||[]).length+' filter(s)</span>',
        '<div class="form f4">'+H.fields([
          {id:'f_field',label:'Field',type:'select',options:ff.map(function(x){return {v:x.k,label:x.l};})},
          {id:'f_op',label:'Condition',type:'select',options:['is','is not','contains','>=','<=','>','<']},
          {id:'f_val',label:'Value',type:'text',ph:'e.g. '+esc(String(S.rows(DB)[0]?S.rows(DB)[0][S.dims[0].k]:''))}
        ])+'<div class="fld" style="align-items:flex-end"><button class="btn" data-act="addf">Add filter</button></div></div>'+
        ((d.filters||[]).length
          ? '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">'+d.filters.map(function(f,i){
              return '<span class="tag t-blu">'+esc(labelOf(d.src,f.field)+' '+f.op+' '+f.val)+' <button class="btn sm" data-act="delf" data-i="'+i+'" style="padding:0 6px;margin-left:4px">×</button></span>';}).join('')+
            ' <button class="btn sm" data-act="clearf">Remove all filters</button></div>'
          : '<p class="hint" style="margin-top:6px">No filters — every record is included.</p>'))+
      /* result */
      H.panel('Result <span class="badge">'+rep.matched+' of '+rep.scanned+' records</span>',
        H.table([{label:d.group==='none'?'Record':labelOf(d.src,d.group),align:'l',fmt:function(r){return esc(r.label);}}]
          .concat(S.measures.map(function(m){return {label:m.l,fmt:function(r){return fmtv(m,r.v[m.k]);},cellcls:'mono'};}))
          .concat([{label:'Records',k:'n',cellcls:'mono'},
                   {label:esc(S.measures[0].l)+' — share',align:'l',fmt:function(r){
                     return '<div style="min-width:150px">'+H.bar(Math.abs(num(r.v[S.measures[0].k]))/mx*100)+'</div>';}}]),rep.rows)+
        '<div class="kv" style="margin-top:8px"><span><b>Total</b>'+(rep.limited?' <span class="hint">(all '+rep.allRows.length+' rows, not just the ones shown)</span>':'')+'</span><b>'+
          S.measures.map(function(m){return esc(m.l)+': '+fmtv(m,rep.total.v[m.k]);}).join(' &nbsp;·&nbsp; ')+'</b></div>',
        '<button class="btn sm" data-act="csvdl">Download CSV</button>')+
      H.panel('Keep this report',
        '<div class="form f2">'+H.fields([{id:'r_name',label:'Give it a name',type:'text',ph:'e.g. Best channels this quarter',wide:true}])+
        '<div class="fld" style="align-items:flex-end"><button class="btn p" data-act="savedef">Save report</button></div></div>'+
        '<p class="hint">Saved reports remember the source, grouping, filters and sort — not the numbers. Run one next month and it recalculates on the new data.</p>');
    },
    lib:function(){var DB=db();
      return H.head('Reports · Ready-made','Ready-made reports','Questions most owners ask. One click loads it into the builder — then change anything you like.')+
      H.note('These are starting points, not fixed reports. Load one, then add a filter or change the grouping and it is yours.')+
      '<div class="two">'+(CFG.templates||[]).map(function(t,i){
        return H.panel(esc(t.name),
          '<p>'+esc(t.why)+'</p>'+
          '<p class="hint">Looks at <b>'+esc(SRC[t.def.src].label)+'</b>, grouped by <b>'+esc(t.def.group==='none'?'nothing':labelOf(t.def.src,t.def.group))+'</b>'+
          ((t.def.filters||[]).length?', filtered on '+esc(t.def.filters.map(function(f){return labelOf(t.def.src,f.field)+' '+f.op+' '+f.val;}).join(' and ')):'')+'.</p>'+
          '<button class="btn p" data-act="tpl" data-i="'+i+'">Load &amp; run →</button>');}).join('')+'</div>';
    },
    saved:function(){var DB=db();var sv=DB.saved||[];
      return H.head('Reports · Saved','My saved reports','Your own reports. They recalculate every time you run them.')+
      H.kpis([{l:'Saved reports',v:sv.length,d:'built by you',icon:'save',tone:'teal'},
        {l:'Sources available',v:SRCKEYS.length,d:'to report on',icon:'layers',tone:'blue'},
        {l:'Records on file',v:SRCKEYS.reduce(function(s,k){return s+SRC[k].rows(DB).length;},0),d:'across all sources',icon:'doc',tone:'green'}],'k3')+
      H.panel('Saved reports',sv.length?H.table([
        {label:'Name',align:'l',fmt:function(r){return esc(r.name);}},
        {label:'Source',align:'l',fmt:function(r){return esc(SRC[r.def.src].label);}},
        {label:'Grouped by',align:'l',fmt:function(r){return esc(r.def.group==='none'?'—':labelOf(r.def.src,r.def.group));}},
        {label:'Filters',fmt:function(r){return (r.def.filters||[]).length;},cellcls:'mono'},
        {label:'Rows',fmt:function(r){return report(db(),r.def).allRows.length;},cellcls:'mono'},
        {label:'Answer if you run it now',align:'l',fmt:function(r){
          var rp=report(db(),r.def);var m=rp.measures.filter(function(x){return x.money;})[0]||rp.measures[0];
          return '<span class="mono">'+esc(m.l)+' '+fmtv(m,rp.total.v[m.k])+'</span>';}},
        {label:'',align:'l',fmt:function(r){var i=sv.indexOf(r);
          return '<button class="btn sm p" data-act="runsaved" data-i="'+i+'">Run</button> <button class="btn sm d" data-act="delsaved" data-i="'+i+'">Delete</button>';}}],sv)
        :'<div class="empty">Nothing saved yet. Build a report and press <b>Save report</b>, or load a ready-made one.</div>');
    },
    wiring:function(){var DB=db();
      return H.head('Wiring · Integration','Where every report gets its numbers','The Report Builder stores no figures of its own. It reads the shared Data Core live, every single time you press Run.')+
      H.note('Shared Data Core: Item/SKU · Party · Stock · Ledger/Voucher · Order — every module reads and writes these.')+
      H.panel('The five sources and what feeds them',H.table([
        {label:'Source',align:'l',k:'f'},{label:'Fed by',align:'l',k:'s'},{label:'What one row means',align:'l',k:'h'}],
        CFG.wiring||[]))+
      '<div class="two">'+
      H.panel('What happens when you press Run',
        '<div class="cascade">'+
        '<div class="cl"><span class="d">1</span><div>The chosen <b>source</b> is read fresh from the Data Core — never from a stored copy.</div></div>'+
        '<div class="cl"><span class="d">2</span><div>Your <b>filters</b> drop the rows you did not want.</div></div>'+
        '<div class="cl"><span class="d">3</span><div>What is left is <b>grouped</b> and each measure is added up.</div></div>'+
        '<div class="cl"><span class="d">4</span><div>The result is <b>sorted</b> and trimmed to your Top N — but the Total line still counts every matching row.</div></div>'+
        '<div class="cl"><span class="d">5</span><div>Saving keeps the <b>question</b>, not the answer. Next month the same report shows next month’s numbers.</div></div>'+
        '</div>')+
      H.panel('Why the numbers always agree with the dashboard',
        '<p>Both apps read the <b>same records</b> and use the <b>same rules</b>. A report grouped by channel with no filters adds up to exactly the net sales figure on the CEO Dashboard for the same period.</p>'+
        '<p class="hint">This is checked automatically — see <b>Backup &amp; Health</b>, where the self-tests prove that grouping never changes a total.</p>')+
      '</div>';
    }
  },
  actions:{
    setsrc:function(b){var DB=db();DB.draft=defaultDef(b.getAttribute('data-s'));K.save();K.render();},
    run:function(){var DB=db();var d=DB.draft;
      d.group=H.val('r_group');d.sort=H.val('r_sort');d.dir=H.val('r_dir');d.limit=num(H.val('r_limit'));
      K.save();toast('Report run ✓');K.render();},
    addf:function(){var DB=db();var d=DB.draft;var f={field:H.val('f_field'),op:H.val('f_op'),val:H.val('f_val')};
      if(f.val===''){toast('Type a value first');return;}
      d.filters=d.filters||[];d.filters.push(f);K.save();toast('Filter added');K.render();},
    delf:function(b){var DB=db();DB.draft.filters.splice(num(b.getAttribute('data-i')),1);K.save();K.render();},
    clearf:function(){var DB=db();DB.draft.filters=[];K.save();toast('Filters removed');K.render();},
    savedef:function(){var DB=db();var n=(H.val('r_name')||'').trim();
      if(!n){toast('Give the report a name');return;}
      DB.saved=DB.saved||[];DB.saved.push({name:n,def:JSON.parse(JSON.stringify(DB.draft))});
      K.save();toast('Saved ✓');K.go('saved');},
    runsaved:function(b){var DB=db();var s=DB.saved[num(b.getAttribute('data-i'))];
      if(!s)return;DB.draft=JSON.parse(JSON.stringify(s.def));K.save();toast('Loaded “'+s.name+'”');K.go('build');},
    delsaved:function(b){var DB=db();DB.saved.splice(num(b.getAttribute('data-i')),1);K.save();toast('Deleted');K.render();},
    tpl:function(b){var DB=db();var t=(CFG.templates||[])[num(b.getAttribute('data-i'))];
      if(!t)return;DB.draft=JSON.parse(JSON.stringify(t.def));K.save();toast('Loaded “'+t.name+'”');K.go('build');},
    csvdl:function(){var DB=db();var txt=csv(report(DB,DB.draft),DB.draft);
      try{var bl=new Blob([txt],{type:'text/csv'});var a=document.createElement('a');
        a.href=URL.createObjectURL(bl);a.download=(SPEC.id||'report')+'.csv';a.click();toast('CSV downloaded');}
      catch(e){toast('Download not available here');}}
  },
  tests:function(t,DB){
    var d=defaultDef('sales');
    var rep=report(DB,d);
    t('sales source has one row per channel per month',SRC.sales.rows(DB).length===CFG.channels.length*MONTHS.length);
    t('grouping by channel gives one row per channel',rep.rows.length===CFG.channels.length);
    t('grouped totals equal the ungrouped total',
      r2(rep.rows.reduce(function(s,r){return s+r.v.net;},0))===rep.total.v.net);
    t('net = gross − returns on every row',
      SRC.sales.rows(DB).every(function(r){return r.net===r2(r.gross-r.returns);}));
    t('sorted biggest first',rep.rows.every(function(r,i){return i===0||rep.rows[i-1].v.net>=r.v.net;}));
    var asc=report(DB,{src:'sales',group:'channel',sort:'net',dir:'asc',limit:0,filters:[]});
    t('sorting smallest first reverses the order',asc.rows[0].label===rep.rows[rep.rows.length-1].label);
    var top3=report(DB,{src:'sales',group:'channel',sort:'net',dir:'desc',limit:3,filters:[]});
    t('Top 3 shows exactly 3 rows',top3.rows.length===3);
    t('Top 3 still totals ALL matching rows, not just 3',top3.total.v.net===rep.total.v.net);
    var f1=report(DB,{src:'sales',group:'channel',sort:'net',dir:'desc',limit:0,
      filters:[{field:'channel',op:'is',val:CFG.channels[0]}]});
    t('a filter cuts the records down',f1.matched<rep.matched&&f1.matched>0);
    t('filtering to one channel leaves one group',f1.rows.length===1);
    var f2=report(DB,{src:'sales',group:'monthLabel',sort:'net',dir:'desc',limit:0,
      filters:[{field:'gross',op:'>=',val:150000}]});
    t('a number filter (gross ≥ 1,50,000) works',f2.matched>0&&f2.matched<rep.scanned);
    t('"contains" matches part of a word',
      report(DB,{src:'sales',group:'channel',sort:'net',dir:'desc',limit:0,
        filters:[{field:'channel',op:'contains',val:String(CFG.channels[0]).slice(0,4).toLowerCase()}]}).matched>0);
    t('"is not" is the opposite of "is"',
      report(DB,{src:'sales',group:'channel',sort:'net',dir:'desc',limit:0,
        filters:[{field:'channel',op:'is not',val:CFG.channels[0]}]}).matched===rep.scanned-f1.matched);
    var mo=report(DB,{src:'money',group:'type',sort:'amount',dir:'desc',limit:0,filters:[]});
    t('money report: "to collect" equals the receivables total',
      mo.rows.filter(function(r){return r.label==='To collect';})[0].v.amount===
      r2(DB.receivables.reduce(function(s,x){return s+x.amount;},0)));
    var st=report(DB,{src:'stock',group:'name',sort:'value',dir:'desc',limit:0,filters:[]});
    t('stock report values every item at qty × cost',
      st.total.v.value===r2(DB.stock.reduce(function(s,x){return s+x.qty*x.cost;},0)));
    t('items at or below reorder are flagged "Reorder now"',
      SRC.stock.rows(DB).filter(function(r){return r.status==='Reorder now';}).length===
      DB.stock.filter(function(x){return x.qty<=x.rop;}).length);
    var ex=report(DB,{src:'expenses',group:'cat',sort:'amount',dir:'desc',limit:0,filters:[]});
    t('running costs by head add up to the same total',
      r2(ex.rows.reduce(function(s,r){return s+r.v.amount;},0))===ex.total.v.amount);
    var ung=report(DB,{src:'sales',group:'none',sort:'net',dir:'desc',limit:0,filters:[]});
    t('"do not group" shows every single record',ung.rows.length===rep.scanned);
    t('ungrouped and grouped give the same total',ung.total.v.net===rep.total.v.net);
    var lines=csv(rep,d).split('\n');
    t('CSV has a header, every row, and a total line',lines.length===rep.rows.length+2);
    t('CSV wraps anything containing a comma in quotes',
      csv(report(DB,{src:'money',group:'party',sort:'amount',dir:'desc',limit:0,filters:[]}),
          {src:'money',group:'party'}).indexOf('"')>=0||CFG.parties.r.join('').indexOf(',')<0);
    t('every ready-made report runs without error',(CFG.templates||[]).every(function(tp){
      try{return report(DB,tp.def).matched>=0;}catch(e){return false;}}));
    t('every ready-made report returns at least one row',(CFG.templates||[]).every(function(tp){
      return report(DB,tp.def).rows.length>0;}));
    DB.saved=DB.saved||[];DB.saved.push({name:'probe',def:defaultDef('sales')});
    t('a saved report reruns to the same answer',
      report(DB,DB.saved[DB.saved.length-1].def).total.v.net===rep.total.v.net);
    t('all five sources return rows',SRCKEYS.every(function(k){return SRC[k].rows(DB).length>0;}));
  }
};

if(typeof module!=='undefined'&&module.exports)module.exports=SPEC;
if(typeof Medhava!=='undefined'&&Medhava.app)Medhava.app(SPEC);

})();</script>
