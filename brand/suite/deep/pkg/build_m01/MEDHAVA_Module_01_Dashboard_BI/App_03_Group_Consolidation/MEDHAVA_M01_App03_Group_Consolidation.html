<style>/* Vanijo Suite — shared SmartHub-teal design system (system fonts). */
:root{
  --ink:#16302b;--ink2:#3c534e;--mut:#6f827d;
  --cream:#edf5f2;--cream2:#e0efe9;--paper:#fff;
  --gold:#0fae90;--gold-d:#0b8f76;--gold-soft:#d4f1e8;
  --emer:#12a06e;--emer-soft:#e0f3ea;
  --line:#dbe8e4;--line2:#c8ddd6;
  --grn:#12a06e;--red:#e5484d;--amb:#c26a2b;--peach-soft:#ffe7d3;
  --shadow:0 1px 2px rgba(16,42,36,.05),0 1px 3px rgba(16,42,36,.04);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--sans);font-weight:700;letter-spacing:-.01em;margin:0;color:var(--ink)}
.mono{font-family:var(--mono)}
.i{width:1em;height:1em;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.13em}
.app{display:grid;grid-template-columns:224px 1fr;grid-template-rows:54px 1fr;min-height:100vh}
.top{grid-column:1/3;background:#fff;color:var(--ink);display:flex;align-items:center;gap:10px;padding:0 16px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.top .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--ink)}
.top .logo .sm{width:26px;height:26px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.top .logo b{font-weight:800}.top .logo .ap{color:var(--mut);font-weight:600}
.tpill{background:#f3f4f6;border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:12px;color:var(--ink2)}
.tpill b{color:var(--ink)}.sp{flex:1}
.tavatar{width:30px;height:30px;border-radius:8px;background:var(--gold);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.hamb{display:none;background:none;border:none;color:var(--ink);cursor:pointer;padding:4px;margin:0 2px 0 -4px;align-items:center}
.side{background:#12312d;color:#a7c2bb;padding:8px 0;overflow-y:auto}
.side .gg{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#63837b;padding:13px 18px 5px;font-weight:600}
.side a{display:flex;align-items:center;gap:10px;padding:8px 18px;color:#b3cbc4;border-left:3px solid transparent;cursor:pointer;font-size:12.5px;font-weight:500}
.side a.on{background:#1c453e;color:#fff;border-left-color:#2dd4bf;font-weight:600}
.side a:hover{background:#183a34;color:#e6f2ee}
.side a .i{font-size:15px;opacity:.8}.side a.on .i{opacity:1;color:#2dd4bf}
.main{padding:18px 22px 40px;overflow-x:hidden;background:var(--cream)}
.navback{display:none}
.crumb{font-size:11px;color:var(--mut);margin-bottom:4px}
.h1row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:21px}.sub{font-size:12px;color:var(--mut);margin-top:3px}
.note{background:var(--gold-soft);border-bottom:1px solid #bfe6d9;color:var(--gold-d);font-size:11px;text-align:center;padding:6px;font-weight:600;border-radius:8px;margin-bottom:12px}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:6px;transition:.12s}
.btn:hover{background:#f7f8fa}
.btn.p{background:var(--gold);color:#fff;border-color:var(--gold)}.btn.p:hover{background:var(--gold-d)}
.btn.e{background:var(--emer);color:#fff;border-color:var(--emer)}
.btn.d{color:var(--red);border-color:#f2c9c9}.btn.d:hover{background:#fdeceb}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:active{transform:translateY(1px)}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel h3{font-size:13px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.badge{font-size:10.5px;font-weight:600;color:var(--gold-d);background:var(--gold-soft);border-radius:20px;padding:2px 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.kpis.k5{grid-template-columns:repeat(5,1fr)}.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px;box-shadow:var(--shadow)}
.kc .kchead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.kc .l{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kchip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 30px}
.kchip.c-teal{background:var(--gold-soft);color:var(--gold-d)}.kchip.c-green{background:var(--emer-soft);color:var(--emer)}
.kchip.c-blue{background:#dceafe;color:#2563eb}.kchip.c-peach{background:var(--peach-soft);color:var(--amb)}.kchip.c-red{background:#fde3e3;color:var(--red)}
.kc .v{font-size:20px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.kc .v.g{color:var(--grn)}.kc .v.r{color:var(--red)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:7px 9px;border-bottom:1px solid #eef0f3;text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:9.5px;text-transform:uppercase;color:var(--mut);letter-spacing:.04em;font-weight:600;background:#f1f7f5}
td.l,th.l{text-align:left}td.c,th.c{text-align:center}
tbody tr:hover{background:#f5faf8}
.g{color:var(--grn);font-weight:600}.r{color:var(--red);font-weight:600}
.tag{font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.02em;display:inline-block}
.t-grn{background:#d6f3e7;color:#0d8f66}.t-amb{background:#ffe7d3;color:#c2632b}.t-red{background:#fde3e3;color:#d83b40}.t-blu{background:#dceafe;color:#2563eb}.t-gray{background:#eef1f0;color:#6f827d}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form.f2{grid-template-columns:1fr 1fr}
.fld{display:flex;flex-direction:column;gap:4px}.fld.wide{grid-column:span 2}.fld.full{grid-column:1/-1}
.fld.end{justify-content:flex-end}
label{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600}
input,select,textarea{border:1px solid var(--line2);border-radius:7px;padding:8px 10px;font-size:12.5px;font-family:var(--sans);background:#fff;color:var(--ink)}
textarea{font-family:var(--mono);min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.cascade{background:#e6f5ef;border:1px solid #c2e7d8;border-radius:10px;padding:12px 14px;margin-top:12px;font-size:12px;color:var(--ink2)}
.cascade b{color:var(--ink)}.cascade .cl{display:flex;gap:8px;margin:6px 0;align-items:flex-start}
.cascade .d{width:18px;height:18px;border-radius:5px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;background:var(--emer)}
.hint{font-size:11px;color:var(--mut);margin-top:8px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:7px 0;border-bottom:1px solid #eef0f3}
.kv span{color:var(--mut)}.kv b{color:var(--ink);text-align:right}
.bar{height:8px;border-radius:6px;background:#e6efec;overflow:hidden}.bar>i{display:block;height:100%;background:var(--gold);border-radius:6px}
.pill{font-size:10.5px;padding:3px 9px;border-radius:6px;background:#eef1f5;color:var(--ink2);margin-right:5px}
.empty{color:var(--mut);font-size:12.5px;padding:8px 2px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#12312d;color:#fff;padding:10px 18px;border-radius:10px;font-size:12.5px;opacity:0;transition:opacity .2s;z-index:50;box-shadow:0 10px 30px rgba(16,42,36,.28)}
.toast.show{opacity:1}
@media print{.top,.side,.hamb,.h1row .btn,.btn{display:none!important}.app{display:block}.main{padding:0}}
@media(max-width:820px){
  .app{grid-template-columns:1fr}.hamb{display:inline-flex}
  .side{position:fixed;top:54px;left:0;bottom:0;width:250px;transform:translateX(-100%);transition:transform .22s;z-index:45;box-shadow:0 14px 44px rgba(16,42,36,.32)}
  .app.navopen .side{transform:none}
  .navback{position:fixed;inset:54px 0 0 0;background:rgba(16,42,36,.42);z-index:44}.app.navopen .navback{display:block}
  .kpis,.kpis.k5,.kpis.k3{grid-template-columns:1fr 1fr}.form,.form.f2,.two,.three{grid-template-columns:1fr}
}

<script>/* Medhava — Connectors: the no-lock-in layer, shared by every app in every module.

   THE RULE THIS ENFORCES
   No Medhava app may depend on one outside service. Every capability an app needs
   (books, channels, AI text, AI images, video, automation, courier, payments,
   messaging, storage, GST, printing, scanning) is declared as a CAPABILITY with a
   list of interchangeable PROVIDERS. You pick one; you can change it any time.

   Three guarantees, each checked by a self-test at every launch:
     1. Every capability has several alternatives — never one.
     2. Every capability has a BUILT-IN or MANUAL option, so the app works with
        nothing connected at all.
     3. Every capability has an option you can HOST YOURSELF, so you are never
        forced to send your data to somebody else's cloud.

   kind: 'built-in'  ships inside Medhava, needs nothing
         'self-host' you run it on your own machine or server
         'cloud'     somebody else's service, via a revocable scoped API key
         'manual'    a human does it, or a CSV goes in and out
*/

      P('medhava_rules', 'Medhava Rules', 'built-in', 'The rule engine inside Medhava. No outside tool.'),
      P('n8n', 'n8n (self-hosted)', 'self-host', 'Your own n8n instance.'),
      P('nodered', 'Node-RED (self-hosted)', 'self-host', ''),
      P('windmill', 'Windmill (self-hosted)', 'self-host', ''),
      P('airflow', 'Apache Airflow', 'self-host', ''),
      P('n8n_cloud', 'n8n Cloud', 'cloud', ''), P('make', 'Make', 'cloud', ''),
      P('zapier', 'Zapier', 'cloud', ''), P('pipedream', 'Pipedream', 'cloud', ''),
      P('cron', 'Cron + webhook', 'self-host', 'The simplest possible option.'),
      P('do_it', 'Do it by hand', 'manual', '') ] },

    { id: 'courier', name: 'Shipping & couriers', what: 'Labels, tracking, delivery.', providers: [
      P('manual_awb', 'Type the AWB in', 'manual', 'Any courier, no integration.'),
      P('own_delivery', 'Your own delivery', 'built-in', 'Own rider, own van, counter pickup.'),
      P('delhivery', 'Delhivery', 'cloud', ''), P('bluedart', 'Blue Dart', 'cloud', ''),
      P('dtdc', 'DTDC', 'cloud', ''), P('ecom', 'Ecom Express', 'cloud', ''),
      P('xpressbees', 'XpressBees', 'cloud', ''), P('indiapost', 'India Post', 'cloud', ''),
      P('shiprocket', 'Shiprocket (aggregator)', 'cloud', ''), P('nimbus', 'NimbusPost (aggregator)', 'cloud', '') ] },

    { id: 'payments', name: 'Payments', what: 'Taking money in.', providers: [
      P('cash', 'Cash / bank transfer', 'manual', 'Record it yourself. Always works.'),
      P('upi_direct', 'UPI direct (your own VPA)', 'built-in', 'A QR code. No gateway, no commission.'),
      P('razorpay', 'Razorpay', 'cloud', ''), P('payu', 'PayU', 'cloud', ''),
      P('cashfree', 'Cashfree', 'cloud', ''), P('phonepe', 'PhonePe', 'cloud', ''),
      P('paytm', 'Paytm', 'cloud', ''), P('stripe', 'Stripe', 'cloud', ''),
      P('ccavenue', 'CCAvenue', 'cloud', '') ] },

    { id: 'messaging', name: 'Customer messaging', what: 'Order updates, reminders, follow-ups.', providers: [
      P('copy_paste', 'Copy the message and send it yourself', 'manual', 'From your own phone.'),
      P('wa_cloud', 'WhatsApp Cloud API', 'cloud', ''), P('gupshup', 'Gupshup', 'cloud', ''),
      P('interakt', 'Interakt', 'cloud', ''), P('msg91', 'MSG91', 'cloud', ''),
      P('twilio', 'Twilio', 'cloud', ''), P('smtp_msg', 'Email instead (any SMTP)', 'self-host', ''),
      P('chatwoot', 'Chatwoot (self-hosted)', 'self-host', '') ] },

    { id: 'email', name: 'Email sending', what: 'Invoices, statements, reports.', providers: [
      P('download_send', 'Download the PDF and email it yourself', 'manual', ''),
      P('smtp', 'Any SMTP server', 'self-host', 'Your own mail server or your existing mailbox.'),
      P('ses', 'Amazon SES', 'cloud', ''), P('sendgrid', 'SendGrid', 'cloud', ''),
      P('postmark', 'Postmark', 'cloud', ''), P('mailgun', 'Mailgun', 'cloud', ''),
      P('zoho_mail', 'Zoho Mail', 'cloud', ''), P('brevo', 'Brevo', 'cloud', '') ] },

    { id: 'storage', name: 'Files & backups', what: 'Where backups and documents are kept.', providers: [
      P('this_device', 'This device', 'built-in', 'The browser on this machine. The default.'),
      P('usb', 'A USB drive', 'manual', ''),
      P('minio', 'MinIO (self-hosted)', 'self-host', 'Your own S3-compatible store.'),
      P('nextcloud', 'Nextcloud (self-hosted)', 'self-host', ''),
      P('gdrive', 'Google Drive', 'cloud', ''), P('dropbox', 'Dropbox', 'cloud', ''),
      P('onedrive', 'OneDrive', 'cloud', ''), P('s3', 'Amazon S3', 'cloud', ''),
      P('b2', 'Backblaze B2', 'cloud', '') ] },

    { id: 'gst', name: 'GST & returns', what: 'Filing, e-invoice, e-way bill.', providers: [
      P('ca_manual', 'Your CA files it', 'manual', 'You hand over a report. How most businesses work.'),
      P('medhava_gst', 'Medhava GST returns', 'built-in', 'Works out GSTR-1 and 3B and writes the JSON for you to upload yourself.'),
      P('offline_util', 'GST offline utility (your own machine)', 'self-host', 'The government’s own desktop tool. Nothing goes through a third party.'),
      P('gstn', 'GSTN portal direct', 'cloud', ''), P('cleartax', 'ClearTax', 'cloud', ''),
      P('tally_gst', 'Tally', 'cloud', ''), P('busy_gst', 'BUSY', 'cloud', ''),
      P('zoho_gst', 'Zoho Books', 'cloud', ''), P('marg_gst', 'Marg', 'cloud', '') ] },

    { id: 'printing', name: 'Printing', what: 'Invoices, labels, counter bills.', providers: [
      P('browser_print', 'Browser print / PDF', 'built-in', 'Works on every device, every printer.'),
      P('escpos', 'Any ESC/POS thermal printer', 'self-host', 'The standard almost every till printer speaks.'),
      P('zebra', 'Zebra label printer', 'self-host', ''), P('tvs', 'TVS printer', 'self-host', ''),
      P('no_printer', 'No printer — share the PDF', 'manual', '') ] },

    { id: 'barcode', name: 'Barcode & scanning', what: 'Picking, packing, stock counts.', providers: [
      P('type_it', 'Type the code', 'manual', 'Always available.'),
      P('phone_cam', 'Phone camera', 'built-in', 'No hardware to buy.'),
      P('usb_scanner', 'USB scanner', 'self-host', 'Any keyboard-wedge scanner.'),
      P('bt_scanner', 'Bluetooth scanner', 'self-host', ''),
      P('zebra_gun', 'Zebra / Honeywell gun', 'self-host', '') ] }
  ];

  var byId = {}; CAPS.forEach(function (c) { byId[c.id] = c; });
  function cap(id) { return byId[id]; }
  function prov(capId, pid) { var c = cap(capId); if (!c) return null;
    var m = c.providers.filter(function (p) { return p.id === pid; }); return m[0] || null; }
  /* the default is always something that needs nothing outside Medhava */
  function defaultOf(capId) { var c = cap(capId);
    var b = c.providers.filter(function (p) { return p.kind === 'built-in'; })[0];
    return (b || c.providers.filter(function (p) { return p.kind === 'manual'; })[0] || c.providers[0]).id; }

  function seed(DB, uses) { DB.prov = DB.prov || {};
    (uses || []).forEach(function (id) { if (cap(id) && !DB.prov[id]) DB.prov[id] = defaultOf(id); }); }
  function active(DB, capId) { return (DB.prov || {})[capId] || defaultOf(capId); }

  var KIND = { 'built-in': ['grn', 'built in'], 'self-host': ['blu', 'you host it'],
               'cloud': ['amb', 'their cloud'], 'manual': ['gray', 'by hand'] };

  function view(H, DB, uses) {
    uses = (uses || []).filter(function (id) { return !!cap(id); });
    var alts = uses.reduce(function (s, id) { return s + cap(id).providers.length; }, 0);
    var noNet = uses.filter(function (id) { var k = prov(id, active(DB, id)); return k && (k.kind === 'built-in' || k.kind === 'manual'); }).length;

    return H.head('Connectors · Alternatives', 'Connectors',
      'Everything this app touches, and every alternative you can use for it. Nothing is locked to one company.') +
      H.note('<b>The promise, in one line:</b> no Medhava app depends on any single outside service. ' +
        'Every capability below has a built-in or by-hand option, and at least one option you can run on your own machine.') +
      H.kpis([
        { l: 'Capabilities used', v: uses.length, d: 'by this app', icon: 'layers', tone: 'teal' },
        { l: 'Alternatives available', v: alts, d: 'to choose from', icon: 'sync', tone: 'blue' },
        { l: 'Outside services required', v: 0, d: 'none, ever', cls: 'g', icon: 'check', tone: 'green' },
        { l: 'Running with nothing connected', v: noNet + ' / ' + uses.length, d: 'right now', cls: noNet === uses.length ? 'g' : '', icon: 'shield', tone: 'peach' }
      ], '') +
      H.panel('At a glance', H.table([
        { label: 'Capability', align: 'l', fmt: function (r) { return '<b>' + H.esc(r.name) + '</b><div class="hint">' + H.esc(r.what) + '</div>'; } },
        { label: 'You are using', align: 'l', fmt: function (r) { var p = prov(r.id, active(DB, r.id));
          return H.esc(p.name) + ' ' + H.tag(KIND[p.kind][1], KIND[p.kind][0]); } },
        { label: 'Alternatives', fmt: function (r) { return cap(r.id).providers.length; }, cellcls: 'mono' },
        { label: 'Works with nothing connected', align: 'l', fmt: function (r) {
          return cap(r.id).providers.some(function (p) { return p.kind === 'built-in' || p.kind === 'manual'; })
            ? H.tag('yes', 'grn') : H.tag('no', 'red'); } },
        { label: 'Can you host it yourself', align: 'l', fmt: function (r) {
          return cap(r.id).providers.some(function (p) { return p.kind === 'self-host' || p.kind === 'built-in'; })
            ? H.tag('yes', 'grn') : H.tag('no', 'red'); } }
      ], uses.map(function (id) { return cap(id); }))) +
      uses.map(function (id) {
        var c = cap(id), a = active(DB, id);
        return H.panel(H.esc(c.name) + ' <span class="badge">' + c.providers.length + ' choices</span>',
          '<p class="hint">' + H.esc(c.what) + ' Click any one to switch. Your figures do not change — only where the data comes from.</p>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          c.providers.map(function (p) {
            return '<button class="btn sm' + (p.id === a ? ' p' : '') + '" data-act="connpick" data-c="' + id + '" data-p="' + p.id + '">' +
              H.esc(p.name) + '</button>';
          }).join('') + '</div>' +
          H.table([
            { label: 'Option', align: 'l', fmt: function (p) { return (p.id === a ? '<b>' + H.esc(p.name) + '</b>' : H.esc(p.name)); } },
            { label: 'Kind', align: 'l', fmt: function (p) { return H.tag(KIND[p.kind][1], KIND[p.kind][0]); } },
            { label: 'Note', align: 'l', fmt: function (p) { return H.esc(p.note || '—'); } },
            { label: '', align: 'l', fmt: function (p) { return p.id === a ? H.tag('in use', 'grn') : ''; } }
          ], c.providers));
      }).join('') +
      H.panel('Two things worth knowing',
        '<p><b>Switching a provider never changes a figure.</b> The arithmetic lives in Medhava, not in the service. ' +
        'Move from one courier to another and your shipping records stay exactly as they were — only new labels come from somewhere else.</p>' +
        '<p><b>Cloud services are connected with a scoped, revocable key — never your account password.</b> ' +
        'A key can be limited to just what it needs and cancelled in one click, from their side, without changing your login. ' +
        'Medhava will never ask you for a marketplace or bank password.</p>');
  }

  function actions(K) {
    return {
      connpick: function (b) { var DB = K.DB, c = b.getAttribute('data-c'), p = b.getAttribute('data-p');
        if (!prov(c, p)) return; DB.prov = DB.prov || {}; DB.prov[c] = p;
        K.save(); K.toast('Switched to ' + prov(c, p).name); K.render(); }
    };
  }

  function tests(t, DB, uses) {
    uses = (uses || []).filter(function (id) { return true; });
    t('every capability this app uses is a known one', uses.every(function (id) { return !!cap(id); }));
    t('no capability offers only one choice', uses.every(function (id) { return cap(id).providers.length >= 3; }));
    t('every capability works with nothing connected (built-in or by hand)', uses.every(function (id) {
      return cap(id).providers.some(function (p) { return p.kind === 'built-in' || p.kind === 'manual'; }); }));
    t('every capability has an option you can host yourself', uses.every(function (id) {
      return cap(id).providers.some(function (p) { return p.kind === 'self-host' || p.kind === 'built-in'; }); }));
    t('exactly one provider is active per capability', uses.every(function (id) {
      return !!prov(id, active(DB, id)); }));
    t('the default provider never needs an outside service', uses.every(function (id) {
      var p = prov(id, defaultOf(id)); return p.kind === 'built-in' || p.kind === 'manual'; }));
    t('no single company is unavoidable across capabilities', (function () {
      if (uses.length < 2) return true;
      var counts = {};
      uses.forEach(function (id) { cap(id).providers.forEach(function (p) { counts[p.name] = (counts[p.name] || 0) + 1; }); });
      /* a company appearing in every capability would be a hidden dependency */
      return !Object.keys(counts).some(function (n) { return counts[n] >= uses.length && uses.length > 1; });
    })());
    if (uses.length) {
      var id = uses[0], c = cap(id), was = active(DB, id);
      var other = c.providers.filter(function (p) { return p.id !== was; })[0];
      var before = JSON.stringify(Object.keys(DB).filter(function (k) { return k !== 'prov'; }).sort()
        .map(function (k) { return [k, DB[k]]; }));
      DB.prov[id] = other.id;
      t('switching a provider changes which one is active', active(DB, id) === other.id);
      t('switching a provider changes nothing else in your data',
        JSON.stringify(Object.keys(DB).filter(function (k) { return k !== 'prov'; }).sort()
          .map(function (k) { return [k, DB[k]]; })) === before);
      DB.prov[id] = was;
    }
  }

  var API = { CAPS: CAPS, cap: cap, prov: prov, defaultOf: defaultOf, seed: seed, active: active,
              view: view, actions: actions, tests: tests };
  if (typeof window !== 'undefined') window.MedhavaProviders = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})();
</script>
<script>/* Medhava Suite kernel — shared UI runtime + components + store + self-tests.
   An app is a spec: { id,name,company,fy, groups?, nav[], seed(DB), views{}, actions{}, tests(t,DB) }. */
(function(){
  var r2=function(n){return Math.round((Number(n)+Number.EPSILON)*100)/100;};
  var num=function(n){return (n==null||n===''||isNaN(n))?0:Number(n);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var money=function(n){n=r2(n);return (n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});};
  var inr=function(n){return Number(r2(n)).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});};
  var $=function(id){return document.getElementById(id);};

  var SPEC=null, state={view:null}, DB={}, KEY='';
  function toast(m){var t=$('toast');if(!t)return;t.textContent=m;t.className='toast show';clearTimeout(t._t);t._t=setTimeout(function(){t.className='toast';},2000);}
  function setStatus(s){var p=$('statusPill');if(p)p.textContent=s;}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));setStatus('saved ✓');}catch(e){setStatus('session only');}}
  function clearDB(){Object.keys(DB).forEach(function(k){delete DB[k];});}

  var H={
    esc:esc, money:money, inr:inr, r2:r2, num:num, toast:toast, val:function(id){var e=$(id);return e?e.value:'';}, numv:function(id){return num(H.val(id));},
    head:function(crumb,h1,sub,actions){return '<div class="crumb">'+esc(crumb)+'</div><div class="h1row"><div><h1>'+esc(h1)+'</h1><div class="sub">'+esc(sub||'')+'</div></div><div>'+(actions||'')+'</div></div>';},
    note:function(t){return '<div class="note">'+t+'</div>';},
    kpis:function(arr,cls){return '<div class="kpis '+(cls||'')+'">'+arr.map(function(k){
      var chip=k.icon?'<div class="kchip c-'+(k.tone||'teal')+'"><svg class="i"><use href="#s-'+k.icon+'"/></svg></div>':'';
      return '<div class="kc"><div class="kchead"><div class="l">'+esc(k.l)+'</div>'+chip+'</div><div class="v '+(k.cls||'')+'">'+k.v+'</div><div class="l" style="margin-top:4px;text-transform:none">'+esc(k.d||'')+'</div></div>';}).join('')+'</div>';},
    /* title is trusted markup (may contain badges/tags); callers must esc() any dynamic data placed in it. */
    panel:function(title,body,actions){return '<div class="panel"><h3>'+title+(actions?'<span>'+actions+'</span>':'')+'</h3>'+body+'</div>';},
    table:function(cols,rows){
      var th=cols.map(function(c){return '<th class="'+(c.align||'')+'">'+esc(c.label||'')+'</th>';}).join('');
      var body=rows.length?rows.map(function(row){return '<tr>'+cols.map(function(c){
        var v=c.fmt?c.fmt(row):row[c.k]; var cls=(c.align||'')+(c.cellcls?' '+(typeof c.cellcls==='function'?c.cellcls(row):c.cellcls):'');
        return '<td class="'+cls+'">'+(v==null?'':v)+'</td>';}).join('')+'</tr>';}).join('')
        :'<tr><td class="l" colspan="'+cols.length+'"><div class="empty">No rows yet.</div></td></tr>';
      return '<table><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table>';
    },
    tag:function(text,tone){return '<span class="tag t-'+(tone||'gray')+'">'+esc(text)+'</span>';},
    bar:function(pct){pct=Math.max(0,Math.min(100,pct));return '<div class="bar"><i style="width:'+pct+'%"></i></div>';},
    fields:function(fields){return fields.map(function(f){
      if(f.type==='select'){var opts=(f.options||[]).map(function(o){var v=typeof o==='object'?o.v:o,l=typeof o==='object'?o.label:o;return '<option value="'+esc(v)+'"'+(f.value==v?' selected':'')+'>'+esc(l)+'</option>';}).join('');
        return '<div class="fld'+(f.wide?' wide':'')+(f.full?' full':'')+'"><label>'+esc(f.label)+'</label><select id="'+f.id+'">'+opts+'</select></div>';}
      if(f.type==='textarea') return '<div class="fld full"><label>'+esc(f.label)+'</label><textarea id="'+f.id+'">'+esc(f.value||'')+'</textarea></div>';
      return '<div class="fld'+(f.wide?' wide':'')+(f.full?' full':'')+'"><label>'+esc(f.label)+'</label><input id="'+f.id+'" type="'+(f.type==='num'?'number':(f.type||'text'))+'" value="'+esc(f.value==null?'':f.value)+'" '+(f.type==='num'?'step="0.01"':'')+' placeholder="'+esc(f.ph||'')+'"></div>';
    }).join('');},
    form:function(fields,submitLabel,act,cls){return '<div class="form '+(cls||'f2')+'">'+H.fields(fields)+'<div class="fld full" style="align-items:flex-end"><button class="btn p" data-act="'+act+'">'+esc(submitLabel)+'</button></div></div>';},
    go:function(v){go(v);}, save:function(){save();}, render:function(){render();}
  };

  function buildShell(){
    var groups=SPEC.groups||[{label:SPEC.name,items:SPEC.nav.map(function(n){return n.v;})}];
    var navMap={}; SPEC.nav.forEach(function(n){navMap[n.v]=n;});
    var nav=groups.map(function(g){return '<div class="gg">'+esc(g.label)+'</div>'+g.items.map(function(v){var n=navMap[v];return n?'<a data-v="'+v+'"><svg class="i"><use href="#s-'+(n.icon||'grid')+'"/></svg> '+esc(n.label)+'</a>':'';}).join('');}).join('');
    $('root').innerHTML='<div class="app" id="appRoot"><div class="top">'+
      '<button class="hamb" id="hamb"><svg class="i" style="width:22px;height:22px;stroke-width:2"><use href="#s-menu"/></svg></button>'+
      '<div class="logo"><span class="sm"><svg width="19" height="19" viewBox="0 0 40 40"><path d="M9 31V15l11 11 11-11v16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 5c.25 3.1.8 3.8 3.9 4.05-3.1.25-3.65.95-3.9 4.05-.25-3.1-.8-3.8-3.9-4.05C19.2 8.8 19.75 8.1 20 5z" fill="#fff"/></svg></span> <b>Medhava</b> <span class="ap">'+esc(SPEC.name)+'</span></div>'+
      '<div class="tpill">'+esc(SPEC.company||'Vastrangam')+'</div><div class="tpill">'+esc(SPEC.fy||'FY 2026-27')+'</div>'+
      '<span class="sp"></span><div class="tpill" id="statusPill">saved ✓</div><div class="tavatar">P</div></div>'+
      '<nav class="side" id="nav">'+nav+'</nav><main class="main" id="main"></main><div class="navback" id="navback"></div></div>';
    var root=$('appRoot');
    $('nav').addEventListener('click',function(e){var a=e.target.closest('a[data-v]');if(a)go(a.getAttribute('data-v'));});
    $('hamb').onclick=function(){root.classList.toggle('navopen');};
    $('navback').onclick=function(){root.classList.remove('navopen');};
    $('main').addEventListener('click',function(e){
      var g=e.target.closest('[data-go]'); if(g){go(g.getAttribute('data-go'));return;}
      var b=e.target.closest('[data-act]'); if(b){var fn=SPEC.actions[b.getAttribute('data-act')]; if(fn)fn(b); }
    });
  }
  function go(v){ if(v!=='backup'&&!(SPEC.views&&SPEC.views[v]))v=SPEC.nav[0].v; state.view=v; var r=$('appRoot'); if(r)r.classList.remove('navopen');
    [].forEach.call(document.querySelectorAll('#nav a[data-v]'),function(a){a.className=a.getAttribute('data-v')===v?'on':'';});
    render(); window.scrollTo(0,0);
  }
  function render(){ var v=state.view; $('main').innerHTML = v==='backup'?backupView():(SPEC.views[v]||SPEC.views[SPEC.nav[0].v])(); }

  function backupView(){
    var t=window.__selftest||{pass:0,fail:0,log:[]};
    var rows=t.log.map(function(l){return {s:l.ok?'<span class="tag t-grn">pass</span>':'<span class="tag t-red">fail</span>',n:esc(l.name)};});
    return H.head('System · Backup','Backup & Health','Your data lives in this browser. Export a JSON backup any time.')+
      H.panel('Data','<div style="display:flex;gap:9px;flex-wrap:wrap">'+
        '<button class="btn p" data-act="_export"><svg class="i"><use href="#s-save"/></svg> Export JSON</button>'+
        '<button class="btn" data-act="_import"><svg class="i"><use href="#s-sync"/></svg> Import JSON</button>'+
        '<button class="btn" data-act="_reseed">Reload demo data</button>'+
        '<button class="btn d" data-act="_wipe">Wipe all</button></div>')+
      H.panel('Self-tests <span class="badge">'+t.pass+'/'+(t.pass+t.fail)+' pass</span>',
        rows.length?H.table([{label:'',align:'l',k:'s'},{label:'Check',align:'l',k:'n'}],rows):'<div class="empty">No self-tests defined.</div>');
  }
  function download(name,text){var b=new Blob([text],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
  function pickFile(cb){var inp=$('fileIn');inp.value='';inp.onchange=function(){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){cb(rd.result);};rd.readAsText(f);};inp.click();}
  var builtins={
    _export:function(){download((SPEC.id||'medhava')+'-backup.json',JSON.stringify(DB,null,2));toast('Backup exported');},
    _import:function(){pickFile(function(txt){try{var o=JSON.parse(txt);clearDB();Object.assign(DB,o);save();toast('Imported ✓');go(SPEC.nav[0].v);}catch(e){toast('Bad file');}});},
    _reseed:function(){if(confirm('Reload demo data? This replaces current data.')){clearDB();SPEC.seed(DB);save();toast('Demo reloaded');go(SPEC.nav[0].v);}},
    _wipe:function(){if(confirm('Wipe ALL data?')){clearDB();save();toast('Wiped');go(SPEC.nav[0].v);}}
  };

  }

  /* ═══════════════ 4 · THE FIGURES ═══════════════ */
  function sum(list, f) { return r2(list.reduce(function (s, x) { return s + num(f(x)); }, 0)); }

  function grossSales(DB) { return sum(rows(DB, 'sales'), function (x) { return x.gross; }); }
  function returnsVal(DB) { return sum(rows(DB, 'sales'), function (x) { return x.returns; }); }
  function netSales(DB) { return r2(grossSales(DB) - returnsVal(DB)); }
  function unitsSold(DB) { return rows(DB, 'sales').reduce(function (s, x) { return s + num(x.units); }, 0); }
  function returnRate(DB) { var g = grossSales(DB); return g ? Math.round(returnsVal(DB) / g * 100) : 0; }
  function purchases(DB) { return sum(rows(DB, 'purchases'), function (x) { return x.amount; }); }
  function expenses(DB) { return sum(rows(DB, 'expenses'), function (x) { return x.amount; }); }
  function wages(DB) { return sum(rows(DB, 'production'), function (x) { return x.wages; }); }
  function piecesMade(DB) { return rows(DB, 'production').reduce(function (s, x) { return s + num(x.pieces); }, 0); }
  function grossProfit(DB) { return r2(netSales(DB) - purchases(DB) - wages(DB)); }
  function netProfit(DB) { return r2(grossProfit(DB) - expenses(DB)); }
  function marginPct(DB) { var n = netSales(DB); return n ? Math.round(netProfit(DB) / n * 100) : 0; }
  function opening(DB) { return sum(held(DB, 'openings'), function (x) { return num(x.cash) + num(x.bank); }); }
  function cash(DB) {
    /* a true position: opening plus everything earned or spent since, whatever period is on screen */
    var all = scope(DB, 'all', DB.co);
    return r2(opening(DB) + netProfit(all));
  }
  function receivable(DB) { return sum(held(DB, 'receivables'), function (x) { return x.amount; }); }
  function payable(DB) { return sum(held(DB, 'payables'), function (x) { return x.amount; }); }
  function stockValue(DB) { return sum(held(DB, 'stock'), function (x) { return num(x.qty) * num(x.cost); }); }
  function lowStock(DB) { return held(DB, 'stock').filter(function (x) { return num(x.qty) <= num(x.rop); }); }

  /* A view of the same records under different dials. Used wherever a figure has to be worked
     out for another period or another company without disturbing what is on screen. */
  function scope(DB, period, co) {
    var v = { period: period, co: co, icChannel: DB.icChannel };
    ['sales', 'purchases', 'expenses', 'production', 'stock', 'receivables', 'payables',
     'openings', 'intercompany', 'companies', 'brands'].forEach(function (k) { v[k] = DB[k]; });
    return v;
  }

  function byChannel(DB) {
    var m = {};
    rows(DB, 'sales').forEach(function (x) {
      var e = m[x.channel] = m[x.channel] || { gross: 0, returns: 0, units: 0 };
      e.gross = r2(e.gross + num(x.gross)); e.returns = r2(e.returns + num(x.returns)); e.units += num(x.units);
    });
    return Object.keys(m).map(function (c) {
      var e = m[c];
      return { channel: c, gross: e.gross, returns: e.returns, net: r2(e.gross - e.returns), units: e.units,
        rr: e.gross ? Math.round(e.returns / e.gross * 100) : 0 };
    }).sort(function (a, b) { return b.net - a.net; });
  }
  function monthSeries(DB) {
    return MONTHS.map(function (m) {
      var one = scope(DB, m, DB.co);
      return { month: m, label: MSHORT[m], net: netSales(one), profit: netProfit(one) };
    });
  }
  function growthPct(DB) {
    var s = monthSeries(DB); if (s.length < 2) return 0;
    var a = s[s.length - 2].net, b = s[s.length - 1].net;
    return a ? Math.round((b - a) / a * 100) : 0;
  }

  /* Alerts are worked out from live figures every time a screen opens. Nobody types them in,
     and clearing one only records that you have seen it. */
  function alerts(DB) {
    var out = [], done = DB.resolved || {}, money = K.money || String;
    lowStock(DB).forEach(function (it) {
      out.push({ id: 'stock-' + it.sku + '-' + it.co, sev: 'high', area: 'Inventory',
        what: it.name + ' is down to ' + it.qty + ' — reorder point is ' + it.rop, go: 'stock' });
    });
    held(DB, 'receivables').filter(function (x) { return x.days > 30; }).forEach(function (x) {
      out.push({ id: 'rec-' + x.party, sev: x.days > 60 ? 'high' : 'med', area: 'Money',
        what: x.party + ' owes ' + money(x.amount) + ', ' + x.days + ' days overdue', go: 'money' });
    });
    held(DB, 'payables').filter(function (x) { return x.days > 0; }).forEach(function (x) {
      out.push({ id: 'pay-' + x.party, sev: x.days > 60 ? 'high' : 'med', area: 'Money',
        what: 'You owe ' + x.party + ' ' + money(x.amount) + ', ' + x.days + ' days late', go: 'money' });
    });
    byChannel(DB).filter(function (c) { return c.rr >= 12; }).forEach(function (c) {
      out.push({ id: 'ret-' + c.channel, sev: 'med', area: 'Sales',
        what: c.channel + ' return rate is ' + c.rr + '% — above the 12% line', go: 'sales' });
    });
    /* a company kept in the group books with no tax registration is a fact to know about,
       not a fault to fix — so it is a watch, and it names what it means */
    (DB.companies || []).filter(function (c) { return !String(c.gstin || '').trim(); }).forEach(function (c) {
      out.push({ id: 'gst-' + c.id, sev: 'med', area: 'Group',
        what: c.name + ' has no tax registration — it counts in group figures but is left out of returns', go: 'companies' });
    });
    return out.filter(function (a) { return !done[a.id]; });
  }

  /* ═══════════════ 5 · THE REPORT ENGINE ═══════════════
     Each source flattens records into plain rows, so grouping, filtering and sorting work the
     same way whatever you are looking at. Every source respects the period and company dials,
     which is why a report grouped by channel equals the dashboard's net sales exactly. */
  var SRC = {
    sales: { label: 'Sales', icon: 'cart',
      note: 'One row per company per channel per month. Returns are already taken off before "Net".',
      dims: [{ k: 'channel', l: 'Channel' }, { k: 'monthLabel', l: 'Month' }, { k: 'company', l: 'Company' }],
      measures: [{ k: 'gross', l: 'Gross', money: 1 }, { k: 'returns', l: 'Returns', money: 1 }, { k: 'net', l: 'Net sales', money: 1 }, { k: 'units', l: 'Units' }],
      rows: function (DB) { return rows(DB, 'sales').map(function (r) {
        return { channel: r.channel, monthLabel: MLBL[r.month], month: r.month, company: coName(DB, r.co), co: r.co,
          gross: num(r.gross), returns: num(r.returns), net: r2(num(r.gross) - num(r.returns)), units: num(r.units) }; }); } },
    money: { label: 'Money owed', icon: 'coin',
      note: 'Who owes you and who you owe, side by side, aged in days.',
      dims: [{ k: 'party', l: 'Party' }, { k: 'type', l: 'Direction' }, { k: 'status', l: 'Status' }, { k: 'company', l: 'Company' }],
      measures: [{ k: 'amount', l: 'Amount', money: 1 }, { k: 'days', l: 'Days' }],
      rows: function (DB) { var out = [];
        held(DB, 'receivables').forEach(function (x) { out.push({ party: x.party, type: 'To collect', days: num(x.days),
          amount: num(x.amount), company: coName(DB, x.co), co: x.co,
          status: x.days > 60 ? 'Very overdue' : x.days > 30 ? 'Overdue' : 'On time' }); });
        held(DB, 'payables').forEach(function (x) { out.push({ party: x.party, type: 'To pay', days: num(x.days),
          amount: num(x.amount), company: coName(DB, x.co), co: x.co,
          status: x.days > 60 ? 'Very late' : x.days > 0 ? 'Late' : 'On time' }); });
        return out; } },
    stock: { label: 'Stock', icon: 'box',
      note: 'What you are holding right now, valued at cost, with anything below its reorder point flagged.',
      dims: [{ k: 'name', l: 'Item' }, { k: 'status', l: 'Status' }, { k: 'company', l: 'Company' }],
      measures: [{ k: 'qty', l: 'Quantity' }, { k: 'value', l: 'Value at cost', money: 1 }],
      rows: function (DB) { return held(DB, 'stock').map(function (x) {
        return { sku: x.sku, name: x.name, qty: num(x.qty), rop: num(x.rop), cost: num(x.cost),
          value: r2(num(x.qty) * num(x.cost)), company: coName(DB, x.co), co: x.co,
          status: num(x.qty) <= num(x.rop) ? 'Reorder now' : num(x.qty) <= num(x.rop) * 2 ? 'Getting low' : 'Comfortable' }; }); } },
    expenses: { label: 'Running costs', icon: 'scale',
      note: 'Everything spent to keep the business running — not the cost of what you sell.',
      dims: [{ k: 'cat', l: 'Cost head' }, { k: 'monthLabel', l: 'Month' }, { k: 'company', l: 'Company' }],
      measures: [{ k: 'amount', l: 'Amount', money: 1 }],
      rows: function (DB) { return rows(DB, 'expenses').map(function (x) {
        return { cat: x.cat, monthLabel: MLBL[x.month], month: x.month, amount: num(x.amount), company: coName(DB, x.co), co: x.co }; }); } },
    production: { label: 'Production', icon: 'wrench',
      note: 'What was actually finished each month, and what it cost in wages.',
      dims: [{ k: 'monthLabel', l: 'Month' }, { k: 'company', l: 'Company' }],
      measures: [{ k: 'pieces', l: 'Pieces made' }, { k: 'wages', l: 'Wages', money: 1 }],
      rows: function (DB) { return rows(DB, 'production').map(function (x) {
        return { monthLabel: MLBL[x.month], month: x.month, pieces: num(x.pieces), wages: num(x.wages),
          cpp: num(x.pieces) ? r2(num(x.wages) / num(x.pieces)) : 0, company: coName(DB, x.co), co: x.co }; }); } },
    purchases: { label: 'Purchases', icon: 'truck',
      note: 'What you bought in, by supplier and month.',
      dims: [{ k: 'party', l: 'Supplier' }, { k: 'monthLabel', l: 'Month' }, { k: 'company', l: 'Company' }],
      measures: [{ k: 'amount', l: 'Amount', money: 1 }],
      rows: function (DB) { return rows(DB, 'purchases').map(function (x) {
        return { party: x.party, monthLabel: MLBL[x.month], month: x.month, amount: num(x.amount), company: coName(DB, x.co), co: x.co }; }); } }
  };
  var SRCKEYS = ['sales', 'money', 'stock', 'expenses', 'production', 'purchases'];

  function fieldsOf(src) { var S = SRC[src]; return S.dims.concat(S.measures); }
  function isMeasure(src, k) { return SRC[src].measures.some(function (m) { return m.k === k; }); }
  function labelOf(src, k) { var f = fieldsOf(src).filter(function (x) { return x.k === k; })[0]; return f ? f.l : k; }

  function passes(row, f, src) {
    var v = row[f.field];
    if (isMeasure(src, f.field)) {
      var a = num(v), b = num(f.val);
      if (f.op === '>=') return a >= b; if (f.op === '<=') return a <= b;
      if (f.op === '>') return a > b; if (f.op === '<') return a < b;
      return a === b;
    }
    var s = String(v == null ? '' : v).toLowerCase(), q = String(f.val == null ? '' : f.val).toLowerCase();
    if (f.op === 'is') return s === q;
    if (f.op === 'is not') return s !== q;
    return s.indexOf(q) >= 0;
  }
  function report(DB, def) {
    var S = SRC[def.src] || SRC.sales, ms = S.measures;
    var all = S.rows(DB);
    var kept = all.filter(function (r) { return (def.filters || []).every(function (f) { return passes(r, f, def.src); }); });
    var out;
    if (def.group === 'none') {
      out = kept.map(function (r) { var v = {}; ms.forEach(function (m) { v[m.k] = num(r[m.k]); });
        return { label: S.dims.map(function (d) { return r[d.k]; }).join(' · '), n: 1, v: v }; });
    } else {
      var map = {}, order = [];
      kept.forEach(function (r) {
        var k = String(r[def.group]);
        if (!map[k]) { map[k] = { label: k, n: 0, v: {} }; ms.forEach(function (m) { map[k].v[m.k] = 0; }); order.push(k); }
        map[k].n++; ms.forEach(function (m) { map[k].v[m.k] = r2(map[k].v[m.k] + num(r[m.k])); });
      });
      out = order.map(function (k) { return map[k]; });
    }
    var sk = def.sort || ms[0].k, dir = def.dir === 'asc' ? 1 : -1;
    out.sort(function (a, b) {
      if (sk === 'label') return a.label < b.label ? -dir : a.label > b.label ? dir : 0;
      if (sk === 'n') return (a.n - b.n) * dir;
      return (num(a.v[sk]) - num(b.v[sk])) * dir;
    });
    var total = { label: 'Total', n: kept.length, v: {} };
    ms.forEach(function (m) { total.v[m.k] = r2(kept.reduce(function (s, r) { return s + num(r[m.k]); }, 0)); });
    var shown = out, limited = false;
    if (num(def.limit) > 0 && out.length > num(def.limit)) { shown = out.slice(0, num(def.limit)); limited = true; }
    return { rows: shown, allRows: out, total: total, measures: ms, matched: kept.length, scanned: all.length, limited: limited };
  }
  function csvOf(rep, def) {
    var head = [def.group === 'none' ? 'Row' : labelOf(def.src, def.group)]
      .concat(rep.measures.map(function (m) { return m.l; })).concat(['Records']);
    var lines = [head.map(q).join(',')];
    rep.rows.forEach(function (r) {
      lines.push([q(r.label)].concat(rep.measures.map(function (m) { return r.v[m.k]; })).concat([r.n]).join(','));
    });
    lines.push([q('TOTAL')].concat(rep.measures.map(function (m) { return rep.total.v[m.k]; })).concat([rep.total.n]).join(','));
    return lines.join('\n');
    function q(s) { s = String(s == null ? '' : s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  }
  function defaultDef(src) {
    var S = SRC[src];
    return { src: src, group: S.dims[0].k, sort: S.measures[0].k, dir: 'desc', limit: 0, filters: [] };
  }

  /* ═══════════════ 6 · CONSOLIDATION ═══════════════
     Several companies, one set of figures. Three things have to be true for a group total to
     mean anything, and each of them is a rule here rather than a note in a manual. */

  /* Per-company figures, always at group period, ignoring whatever company filter is on screen. */
  function perCompany(DB) {
    return (DB.companies || []).map(function (c) {
      var v = scope(DB, DB.period, c.id);
      return { id: c.id, name: c.name, gstin: String(c.gstin || '').trim(), note: c.note || '',
        gross: grossSales(v), returns: returnsVal(v), net: netSales(v), units: unitsSold(v),
        purchases: purchases(v), wages: wages(v), expenses: expenses(v),
        grossProfit: grossProfit(v), profit: netProfit(v), margin: marginPct(v),
        cash: cash(v), receivable: receivable(v), payable: payable(v), stock: stockValue(v),
        registered: !!String(c.gstin || '').trim() };
    });
  }
  /* Inter-company billing for the period: real to each company, not a sale for the group. */
  function interco(DB) {
    return (DB.intercompany || []).filter(function (x) { return inPeriod(DB, x.month); });
  }
  function intercoTotal(DB) { return sum(interco(DB), function (x) { return x.amount; }); }

  /* The group figures. Sales and purchases are reduced by what the companies billed each
     other; profit is not, because both halves of an internal bill cancel out on their own. */
  function groupFigures(DB) {
    var per = perCompany(DB), el = intercoTotal(DB);
    var add = function (f) { return r2(per.reduce(function (s, c) { return s + c[f]; }, 0)); };
    var netAdded = add('net'), purAdded = add('purchases');
    return {
      companies: per.length,
      registered: per.filter(function (c) { return c.registered; }).length,
      addedNet: netAdded, eliminated: el, net: r2(netAdded - el),
      addedPurchases: purAdded, purchases: r2(purAdded - el),
      gross: r2(add('gross') - el), returns: add('returns'), units: per.reduce(function (s, c) { return s + c.units; }, 0),
      wages: add('wages'), expenses: add('expenses'),
      grossProfit: r2(netAdded - el - (purAdded - el) - add('wages')),
      profit: add('profit'), cash: add('cash'), receivable: add('receivable'),
      payable: add('payable'), stock: add('stock')
    };
  }
  /* THE GATE. A company with no tax registration is a company like any other in the group
     books — and must never be dragged into a tax return it has no business being in. Asking
     for one is refused here, in the engine, not warned about on a screen somebody can ignore. */
  function gstReturn(DB, coId) {
    var c = (DB.companies || []).filter(function (x) { return x.id === coId; })[0];
    if (!c) return { ok: false, reason: 'No such company.' };
    if (!String(c.gstin || '').trim())
      return { ok: false, refused: true, company: c.name,
        reason: c.name + ' has no tax registration of its own, so it cannot file a return. ' +
          'Its figures still count in every group total — that is a different question from filing.' };
    var v = scope(DB, DB.period, coId);
    return { ok: true, company: c.name, gstin: c.gstin, gross: grossSales(v), returns: returnsVal(v),
      net: netSales(v), purchases: purchases(v) };
  }
  /* THE SECOND GATE. A trading name is not a company. Selling under two names on one
     marketplace does not create a second business, and the group must never count it twice. */
  function brandOwner(DB, name) {
    var b = (DB.brands || []).filter(function (x) { return String(x.name).toLowerCase() === String(name).toLowerCase(); })[0];
    return b ? b.co : null;
  }
  function addCompany(DB, rec) {
    var cap = (DB.plan && DB.plan.companyCap) || 20;
    if ((DB.companies || []).length >= cap)
      return { ok: false, refused: true, reason: 'Your ' + ((DB.plan && DB.plan.name) || 'current') +
        ' plan covers ' + cap + ' companies and you already have ' + DB.companies.length +
        '. The software has no limit of its own — moving up a plan raises this.' };
    var id = String(rec.id || '').trim().toUpperCase();
    if (!id) return { ok: false, reason: 'A company needs a short code.' };
    if ((DB.companies || []).some(function (c) { return c.id === id; }))
      return { ok: false, reason: 'The code ' + id + ' is already used by another company.' };
    if (brandOwner(DB, rec.name))
      return { ok: false, refused: true, reason: '"' + rec.name + '" is already a trading name of ' +
        coName(DB, brandOwner(DB, rec.name)) + '. A name you sell under is not a separate company — ' +
        'making it one would count the same sales twice in every group figure.' };
    DB.companies.push({ id: id, name: String(rec.name || '').trim() || id, gstin: String(rec.gstin || '').trim(), note: rec.note || '' });
    return { ok: true, id: id };
  }

  /* ═══════════════ 7 · IMPORT AND EXPORT ═══════════════
     A row that cannot be trusted is never quietly dropped and never quietly fixed. It is
     rejected, counted, and the reason is shown next to it. */
  function validate(DB, key, rec) {
    var t = TBL[key], bad = [];
    t.cols.forEach(function (c) {
      var v = rec[c.k];
      if (c.req && (v === '' || v == null)) bad.push(c.l + ' is required');
      if (c.type === 'num' && v !== '' && v != null && isNaN(v)) bad.push(c.l + ' is not a number');
      if (c.type === 'co' && v && coIds(DB).indexOf(String(v)) < 0 && !(DB.companies || []).some(function (x) { return x.name === v; }))
        bad.push('there is no company "' + v + '" — add the company first');
      if (c.type === 'month' && v && MONTHS.indexOf(String(v)) < 0 && !/^\d{4}-\d{2}$/.test(String(v)))
        bad.push(c.l + ' must look like 2026-07');
    });
    return bad;
  }
  /* Company columns may arrive as a code or as a full name — both are what a person would type. */
  function normalise(DB, key, rec) {
    var t = TBL[key], out = {};
    t.cols.forEach(function (c) {
      var v = rec[c.k];
      if (c.type === 'num') v = num(v);
      else v = String(v == null ? '' : v).trim();
      if (c.type === 'co' && v) {
        var hit = (DB.companies || []).filter(function (x) { return x.id === v || x.name === v; })[0];
        if (hit) v = hit.id;
      }
      out[c.k] = v;
    });
    return out;
  }
  function importRows(DB, key, list) {
    var okRows = [], bad = [];
    (list || []).forEach(function (raw, i) {
      var rec = normalise(DB, key, raw), errs = validate(DB, key, rec);
      if (errs.length) bad.push({ line: i + 2, why: errs.join('; '), row: raw });
      else { rec.id = uid(key.slice(0, 2)); okRows.push(rec); }
    });
    return { rows: okRows, rejected: bad };
  }
  function sheetsOf(DB) {
    var out = {};
    TABLES.forEach(function (t) {
      out[t.label] = [t.cols.map(function (c) { return c.l; })].concat(
        (DB[t.key] || []).map(function (r) { return t.cols.map(function (c) { return r[c.k] == null ? '' : r[c.k]; }); }));
    });
    return out;
  }
  /* Which table does an uploaded sheet belong to? Its name if it matches, otherwise whichever
     table its column headings fit best — so a sheet called "Sheet1" still lands correctly. */
  function guessTable(sheetName, rows) {
    var n = String(sheetName || '').toLowerCase().replace(/[^a-z]/g, '');
    var byName = TABLES.filter(function (t) {
      var l = t.label.toLowerCase().replace(/[^a-z]/g, '');
      return n === l || n === t.key || (n.length > 3 && (n.indexOf(t.key) >= 0 || l.indexOf(n) >= 0));
    })[0];
    if (byName) return byName.key;
    if (!rows || !rows.length) return null;
    var head = (rows[0] || []).map(function (h) { return String(h).toLowerCase().replace(/[^a-z0-9]/g, ''); });
    var best = null, bestScore = 0;
    TABLES.forEach(function (t) {
      var score = t.cols.filter(function (c) {
        return head.indexOf(c.k.toLowerCase()) >= 0 || head.indexOf(c.l.toLowerCase().replace(/[^a-z0-9]/g, '')) >= 0;
      }).length;
      if (score > bestScore) { bestScore = score; best = t.key; }
    });
    return bestScore >= 2 ? best : null;
  }

  return {
    MONTHS: MONTHS, MSHORT: MSHORT, MLBL: MLBL, TABLES: TABLES, TBL: TBL,
    uid: uid, split: split, seed: seed, scope: scope,
    inPeriod: inPeriod, inCo: inCo, months: months, rows: rows, held: held,
    coName: coName, coIds: coIds, icChannel: icChannel, isInternal: isInternal, externalGross: externalGross,
    grossSales: grossSales, returnsVal: returnsVal, netSales: netSales, unitsSold: unitsSold,
    returnRate: returnRate, purchases: purchases, expenses: expenses, wages: wages,
    piecesMade: piecesMade, grossProfit: grossProfit, netProfit: netProfit, marginPct: marginPct,
    opening: opening, cash: cash, receivable: receivable, payable: payable,
    stockValue: stockValue, lowStock: lowStock, byChannel: byChannel,
    monthSeries: monthSeries, growthPct: growthPct, alerts: alerts,
    SRC: SRC, SRCKEYS: SRCKEYS, fieldsOf: fieldsOf, isMeasure: isMeasure, labelOf: labelOf,
    report: report, csvOf: csvOf, defaultDef: defaultDef,
    perCompany: perCompany, interco: interco, intercoTotal: intercoTotal, groupFigures: groupFigures,

  /* ══════════ the actions, shared the same way ══════════ */
  function actions(CFG) {
    CFG = CFG || {};
    var A = {};
    A.setp = function (b) { var DB = db(); DB.period = b.getAttribute('data-p'); K.save(); K.render(); };
    A.setco = function (b) { var DB = db(); DB.co = b.getAttribute('data-c'); K.save(); K.render(); };
    A.clear = function (b) { var DB = db(); DB.resolved = DB.resolved || {}; DB.resolved[b.getAttribute('data-id')] = 1;
      K.save(); toast('Alert cleared ✓'); setTimeout(function () { K.render(); }, 350); };
    A.unclear = function () { var DB = db(); DB.resolved = {}; K.save(); toast('All alerts restored'); setTimeout(function () { K.render(); }, 350); };

    A.setsrc = function (b) { var DB = db(); DB.draft = M01.defaultDef(b.getAttribute('data-s')); K.save(); K.render(); };
    A.run = function () { var DB = db(), d = DB.draft;
      d.group = H.val('r_group'); d.sort = H.val('r_sort'); d.dir = H.val('r_dir'); d.limit = num(H.val('r_limit'));
      K.save(); toast('Report run ✓'); K.render(); };
    A.addf = function () { var DB = db(), d = DB.draft, f = { field: H.val('f_field'), op: H.val('f_op'), val: H.val('f_val') };
      if (f.val === '') { toast('Type a value first'); return; }
      d.filters = d.filters || []; d.filters.push(f); K.save(); toast('Filter added'); K.render(); };
    A.delf = function (b) { var DB = db(); DB.draft.filters.splice(num(b.getAttribute('data-i')), 1); K.save(); K.render(); };
    A.clearf = function () { var DB = db(); DB.draft.filters = []; K.save(); toast('Filters removed'); K.render(); };
    A.savedef = function () { var DB = db(), n = (H.val('r_name') || '').trim();
      if (!n) { toast('Give the report a name'); return; }
      DB.saved = DB.saved || []; DB.saved.push({ name: n, def: JSON.parse(JSON.stringify(DB.draft)) });
      K.save(); toast('Saved ✓'); K.go('saved'); };
    A.runsaved = function (b) { var DB = db(), s = DB.saved[num(b.getAttribute('data-i'))];
      if (!s) return; DB.draft = JSON.parse(JSON.stringify(s.def)); K.save(); toast('Loaded “' + s.name + '”'); K.go('build'); };
    A.delsaved = function (b) { var DB = db(); DB.saved.splice(num(b.getAttribute('data-i')), 1); K.save(); toast('Deleted'); K.render(); };
    A.tpl = function (b) { var DB = db(), t = (CFG.templates || [])[num(b.getAttribute('data-i'))];
      if (!t) return; DB.draft = JSON.parse(JSON.stringify(t.def)); K.save(); toast('Loaded “' + t.name + '”'); K.go('build'); };
    A.csvdl = function () { var DB = db(), txt = M01.csvOf(M01.report(DB, DB.draft), DB.draft);
      try { var bl = new Blob([txt], { type: 'text/csv' }); var a = document.createElement('a');

/* Medhava — Group Consolidation (Module 01 · App 3)

   Several companies, one set of figures. Three things have to be true before a group total
   means anything, and each of them is enforced in the engine rather than described in a manual:

     1. WHAT YOUR COMPANIES BILLED EACH OTHER COMES BACK OUT. A group cannot sell to itself.
        The bill is real for the company that raised it and real for the company that paid it;
        it is not revenue for the group, and adding it in would inflate every share you quote.

     2. A COMPANY WITH NO TAX REGISTRATION IS STILL A COMPANY. A job-work arm, a venture not
        registered yet — it counts in every group figure, and it is REFUSED entry to a tax
        return. Those are two different questions and the software answers both correctly.

     3. A NAME YOU SELL UNDER IS NOT A COMPANY. Two seller names on one marketplace do not make
        two businesses. Turning one into a company is refused, because it would count the same
        orders twice in every figure on this screen.

   The arithmetic comes from M01 and the screens from M01V — the same shared files the CEO
   Dashboard and the Report Builder are built from. */
var K = typeof Medhava !== 'undefined' ? Medhava : {};
var H = K.H, esc = K.esc, r2 = K.r2;
var CFG = (typeof CONFIG !== 'undefined') ? CONFIG : {};

var V = M01V.make(CFG, {
  co: false,   /* no company switcher: this app's whole job is all of them at once */
  wiringTitle: 'Where every group figure comes from',
  wiringSub: 'This app owns no records. It reads the same Data Core as every other app and rolls it up.',
  wiringPanels: function () {
    var DB = K.DB;
    return H.panel('The three rules, in one place',
      '<div class="cascade">' +
      '<div class="cl"><span class="d">1</span><div><b>Internal billing comes out.</b> A group cannot sell to itself. It is removed from group sales and group purchases, and it never touches group profit.</div></div>' +
      '<div class="cl"><span class="d">2</span><div><b>No registration is not no company.</b> It counts in every group figure; it is refused a return.</div></div>' +
      '<div class="cl"><span class="d">3</span><div><b>A trading name is not a company.</b> Its orders are the sales of the company it belongs to, counted once.</div></div>' +
      '</div>') +
    H.panel('How many companies you may have',
      '<p><b>The software sets no limit.</b> Twenty companies, or two. What limits you is the plan you are on — currently <b>' +
      esc((DB.plan && DB.plan.name) || 'Enterprise') + '</b>, which covers <b>' + ((DB.plan && DB.plan.companyCap) || 20) + '</b>.</p>' +
      '<p class="hint">That distinction matters when you are choosing software: a cap written into the product is a rebuild, and a cap written into a plan is a decision you can change on a Tuesday.</p>');
  }
});

/* It reads the books and the channels, files (or refuses to file) a return, and prints. */
var SPEC = {
  uses: ['ledger', 'channels', 'gst', 'storage', 'printing'],
  id: CFG.id, name: CFG.name, company: CFG.company, fy: CFG.fy || 'FY 2026-27',
  tagline: CFG.tagline, about: CFG.about,
  groups: [{ label: 'The group', items: ['group', 'compare', 'internal'] },
           { label: 'Set up', items: ['cos', 'returns'] },
           { label: 'Wiring', items: ['wiring'] }],
  nav: [{ v: 'group', label: 'Group figures', icon: 'layers' }, { v: 'compare', label: 'Company by company', icon: 'chart' },
        { v: 'internal', label: 'Between your companies', icon: 'sync' },
        { v: 'cos', label: 'Companies & names', icon: 'store' }, { v: 'returns', label: 'Who may file', icon: 'shield' },
        { v: 'wiring', label: 'Wiring', icon: 'flow' }],
  seed: function (DB) { M01.seed(DB, CFG); DB.lastRefusal = null; DB.lastReturn = null; },
  views: { group: V.group, compare: V.compare, internal: V.internal, cos: V.cos, returns: V.returns, wiring: V.wiring },
  actions: M01V.actions(CFG),

  tests: function (t, DB) {
    DB.period = '2026-07'; DB.co = 'all';
    var per = M01.perCompany(DB), g = M01.groupFigures(DB), ids = M01.coIds(DB);

    /* rule 1 — internal billing */
    t('group net sales = every company added up, minus internal billing',
      g.net === r2(g.addedNet - g.eliminated));
    t('removing internal billing never changes group profit',
      g.profit === r2(per.reduce(function (s, c) { return s + c.profit; }, 0)));
    t('group sales after removal equal what was sold outside the group',
      g.gross === M01.externalGross(M01.scope(DB, DB.period, 'all')));
    t('every internal invoice has a company on both sides',
      M01.interco(DB).every(function (x) { return ids.indexOf(x.from) >= 0 && ids.indexOf(x.to) >= 0 && x.from !== x.to; }));
    t('internal billing is on its own channel, never mixed into a real one',
      M01.rows(M01.scope(DB, DB.period, 'all'), 'sales')
        .filter(function (x) { return M01.isInternal(DB, x.channel); })
        .reduce(function (s, x) { return r2(s + x.gross); }, 0) === g.eliminated);

    /* rule 2 — a company with no registration */
    var unreg = per.filter(function (c) { return !c.registered; })[0];
    t('there is a company with no tax registration in the group', !!unreg);
    t('a company with no registration still counts in the group figures', unreg && unreg.net > 0);
    var refused = M01.gstReturn(DB, unreg.id);
    t('asking for its return is refused, not warned about', refused.ok === false && refused.refused === true);
    t('the refusal says why, in words a person can act on',
      /no tax registration/.test(refused.reason) && /still count/.test(refused.reason));
    var reg = per.filter(function (c) { return c.registered; })[0];
    t('a registered company can build its return', M01.gstReturn(DB, reg.id).ok === true);
    t('its return uses its own figures, not the group’s',
      M01.gstReturn(DB, reg.id).net === reg.net && reg.net !== g.net);

    /* rule 3 — a trading name is not a company */
    t('there is at least one trading name on file', (DB.brands || []).length > 0);
    t('every trading name belongs to a company that exists',
      (DB.brands || []).every(function (b) { return ids.indexOf(b.co) >= 0; }));
    var brand = DB.brands[DB.brands.length - 1];
    var asCo = M01.addCompany(DB, { id: 'XX', name: brand.name });
    t('turning a trading name into a company is refused', asCo.ok === false && asCo.refused === true);
    t('the company list did not grow when that was refused', DB.companies.length === per.length);

    /* the plan, not the software, is what limits you */
    t('the plan names a company limit and it is more than one', (DB.plan.companyCap || 0) > 1);
    var saved = DB.plan.companyCap; DB.plan.companyCap = DB.companies.length;
    var capped = M01.addCompany(DB, { id: 'ZZ', name: 'One company too many' });
    t('adding past the plan limit is refused', capped.ok === false && capped.refused === true);
    t('the refusal blames the plan, not the software',
      /plan/.test(capped.reason) && /no limit of its own/.test(capped.reason));
    DB.plan.companyCap = saved;
    var added = M01.addCompany(DB, { id: 'ZZ', name: 'A brand new venture', gstin: '' });
    t('a company can be added once there is room', added.ok === true);
    t('a company added with no registration is accepted as a company',
      DB.companies[DB.companies.length - 1].gstin === '');
    t('two companies can never share a code',
      M01.addCompany(DB, { id: 'ZZ', name: 'Another one' }).ok === false);
    DB.companies.pop();

    /* the period dial, here too */
    var yr = M01.groupFigures(M01.scope(DB, 'all', 'all'));
    t('the group figures obey the period', yr.net > g.net);
    t('every month added up equals the full year',
      r2(M01.MONTHS.reduce(function (s, m) { return s + M01.groupFigures(M01.scope(DB, m, 'all')).net; }, 0)) === yr.net);
    t('group cash is a position — it does not move with the period', yr.cash === g.cash);
    t('group figures equal the dashboard when one company is picked',
      M01.perCompany(DB)[0].net === M01.netSales(M01.scope(DB, DB.period, ids[0])));
  }
};

if (typeof module !== 'undefined' && module.exports) module.exports = SPEC;
if (typeof Medhava !== 'undefined' && Medhava.app) Medhava.app(SPEC);

})();</script>
