<style>/* Vanijo Suite — shared SmartHub-teal design system (system fonts). */
:root{
  --ink:#16302b;--ink2:#3c534e;--mut:#6f827d;
  --cream:#edf5f2;--cream2:#e0efe9;--paper:#fff;
  --gold:#0fae90;--gold-d:#0b8f76;--gold-soft:#d4f1e8;
  --emer:#12a06e;--emer-soft:#e0f3ea;
  --line:#dbe8e4;--line2:#c8ddd6;
  --grn:#12a06e;--red:#e5484d;--amb:#c26a2b;--peach-soft:#ffe7d3;
  --shadow:0 1px 2px rgba(16,42,36,.05),0 1px 3px rgba(16,42,36,.04);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--sans);font-weight:700;letter-spacing:-.01em;margin:0;color:var(--ink)}
.mono{font-family:var(--mono)}
.i{width:1em;height:1em;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.13em}
.app{display:grid;grid-template-columns:224px 1fr;grid-template-rows:54px 1fr;min-height:100vh}
.top{grid-column:1/3;background:#fff;color:var(--ink);display:flex;align-items:center;gap:10px;padding:0 16px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.top .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--ink)}
.top .logo .sm{width:26px;height:26px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.top .logo b{font-weight:800}.top .logo .ap{color:var(--mut);font-weight:600}
.tpill{background:#f3f4f6;border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:12px;color:var(--ink2)}
.tpill b{color:var(--ink)}.sp{flex:1}
.tavatar{width:30px;height:30px;border-radius:8px;background:var(--gold);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.hamb{display:none;background:none;border:none;color:var(--ink);cursor:pointer;padding:4px;margin:0 2px 0 -4px;align-items:center}
.side{background:#12312d;color:#a7c2bb;padding:8px 0;overflow-y:auto}
.side .gg{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#63837b;padding:13px 18px 5px;font-weight:600}
.side a{display:flex;align-items:center;gap:10px;padding:8px 18px;color:#b3cbc4;border-left:3px solid transparent;cursor:pointer;font-size:12.5px;font-weight:500}
.side a.on{background:#1c453e;color:#fff;border-left-color:#2dd4bf;font-weight:600}
.side a:hover{background:#183a34;color:#e6f2ee}
.side a .i{font-size:15px;opacity:.8}.side a.on .i{opacity:1;color:#2dd4bf}
.main{padding:18px 22px 40px;overflow-x:hidden;background:var(--cream)}
.navback{display:none}
.crumb{font-size:11px;color:var(--mut);margin-bottom:4px}
.h1row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:21px}.sub{font-size:12px;color:var(--mut);margin-top:3px}
.note{background:var(--gold-soft);border-bottom:1px solid #bfe6d9;color:var(--gold-d);font-size:11px;text-align:center;padding:6px;font-weight:600;border-radius:8px;margin-bottom:12px}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:6px;transition:.12s}
.btn:hover{background:#f7f8fa}
.btn.p{background:var(--gold);color:#fff;border-color:var(--gold)}.btn.p:hover{background:var(--gold-d)}
.btn.e{background:var(--emer);color:#fff;border-color:var(--emer)}
.btn.d{color:var(--red);border-color:#f2c9c9}.btn.d:hover{background:#fdeceb}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:active{transform:translateY(1px)}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel h3{font-size:13px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.badge{font-size:10.5px;font-weight:600;color:var(--gold-d);background:var(--gold-soft);border-radius:20px;padding:2px 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.kpis.k5{grid-template-columns:repeat(5,1fr)}.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px;box-shadow:var(--shadow)}
.kc .kchead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.kc .l{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kchip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 30px}
.kchip.c-teal{background:var(--gold-soft);color:var(--gold-d)}.kchip.c-green{background:var(--emer-soft);color:var(--emer)}
.kchip.c-blue{background:#dceafe;color:#2563eb}.kchip.c-peach{background:var(--peach-soft);color:var(--amb)}.kchip.c-red{background:#fde3e3;color:var(--red)}
.kc .v{font-size:20px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.kc .v.g{color:var(--grn)}.kc .v.r{color:var(--red)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:7px 9px;border-bottom:1px solid #eef0f3;text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:9.5px;text-transform:uppercase;color:var(--mut);letter-spacing:.04em;font-weight:600;background:#f1f7f5}
td.l,th.l{text-align:left}td.c,th.c{text-align:center}
tbody tr:hover{background:#f5faf8}
.g{color:var(--grn);font-weight:600}.r{color:var(--red);font-weight:600}
.tag{font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.02em;display:inline-block}
.t-grn{background:#d6f3e7;color:#0d8f66}.t-amb{background:#ffe7d3;color:#c2632b}.t-red{background:#fde3e3;color:#d83b40}.t-blu{background:#dceafe;color:#2563eb}.t-gray{background:#eef1f0;color:#6f827d}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form.f2{grid-template-columns:1fr 1fr}
.fld{display:flex;flex-direction:column;gap:4px}.fld.wide{grid-column:span 2}.fld.full{grid-column:1/-1}
.fld.end{justify-content:flex-end}
label{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600}
input,select,textarea{border:1px solid var(--line2);border-radius:7px;padding:8px 10px;font-size:12.5px;font-family:var(--sans);background:#fff;color:var(--ink)}
textarea{font-family:var(--mono);min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.cascade{background:#e6f5ef;border:1px solid #c2e7d8;border-radius:10px;padding:12px 14px;margin-top:12px;font-size:12px;color:var(--ink2)}
.cascade b{color:var(--ink)}.cascade .cl{display:flex;gap:8px;margin:6px 0;align-items:flex-start}
.cascade .d{width:18px;height:18px;border-radius:5px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;background:var(--emer)}
.hint{font-size:11px;color:var(--mut);margin-top:8px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:7px 0;border-bottom:1px solid #eef0f3}
.kv span{color:var(--mut)}.kv b{color:var(--ink);text-align:right}
.bar{height:8px;border-radius:6px;background:#e6efec;overflow:hidden}.bar>i{display:block;height:100%;background:var(--gold);border-radius:6px}
.pill{font-size:10.5px;padding:3px 9px;border-radius:6px;background:#eef1f5;color:var(--ink2);margin-right:5px}
.empty{color:var(--mut);font-size:12.5px;padding:8px 2px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#12312d;color:#fff;padding:10px 18px;border-radius:10px;font-size:12.5px;opacity:0;transition:opacity .2s;z-index:50;box-shadow:0 10px 30px rgba(16,42,36,.28)}
.toast.show{opacity:1}
@media print{.top,.side,.hamb,.h1row .btn,.btn{display:none!important}.app{display:block}.main{padding:0}}
@media(max-width:820px){
  .app{grid-template-columns:1fr}.hamb{display:inline-flex}
  .side{position:fixed;top:54px;left:0;bottom:0;width:250px;transform:translateX(-100%);transition:transform .22s;z-index:45;box-shadow:0 14px 44px rgba(16,42,36,.32)}
  .app.navopen .side{transform:none}
  .navback{position:fixed;inset:54px 0 0 0;background:rgba(16,42,36,.42);z-index:44}.app.navopen .navback{display:block}
  .kpis,.kpis.k5,.kpis.k3{grid-template-columns:1fr 1fr}.form,.form.f2,.two,.three{grid-template-columns:1fr}
}
</style></head><body>

<script>/* Medhava — Connectors: the no-lock-in layer, shared by every app in every module.

   THE RULE THIS ENFORCES
   No Medhava app may depend on one outside service. Every capability an app needs
   (books, channels, AI text, AI images, video, automation, courier, payments,
   messaging, storage, GST, printing, scanning) is declared as a CAPABILITY with a
   list of interchangeable PROVIDERS. You pick one; you can change it any time.

   Three guarantees, each checked by a self-test at every launch:
     1. Every capability has several alternatives — never one.
     2. Every capability has a BUILT-IN or MANUAL option, so the app works with
        nothing connected at all.
     3. Every capability has an option you can HOST YOURSELF, so you are never
        forced to send your data to somebody else's cloud.

   kind: 'built-in'  ships inside Medhava, needs nothing
         'self-host' you run it on your own machine or server
         'cloud'     somebody else's service, via a revocable scoped API key
         'manual'    a human does it, or a CSV goes in and out
*/

      P('amazon', 'Amazon', 'cloud', 'SP-API, scoped key.'),

      P('shopify', 'Shopify', 'cloud', ''), P('woocommerce', 'WooCommerce', 'self-host', 'Your own WordPress store.'),

    { id: 'ai_image', name: 'AI images', what: 'Product shots, banners, catalogue images.', providers: [

    { id: 'ai_video', name: 'Video', what: 'Reels, product videos, ads.', providers: [

      P('zebra_gun', 'Zebra / Honeywell gun', 'self-host', '') ] }
  ];

  var byId = {}; CAPS.forEach(function (c) { byId[c.id] = c; });
  function cap(id) { return byId[id]; }
  function prov(capId, pid) { var c = cap(capId); if (!c) return null;
    var m = c.providers.filter(function (p) { return p.id === pid; }); return m[0] || null; }
  /* the default is always something that needs nothing outside Medhava */
  function defaultOf(capId) { var c = cap(capId);
    var b = c.providers.filter(function (p) { return p.kind === 'built-in'; })[0];
    return (b || c.providers.filter(function (p) { return p.kind === 'manual'; })[0] || c.providers[0]).id; }

  function seed(DB, uses) { DB.prov = DB.prov || {};
    (uses || []).forEach(function (id) { if (cap(id) && !DB.prov[id]) DB.prov[id] = defaultOf(id); }); }
  function active(DB, capId) { return (DB.prov || {})[capId] || defaultOf(capId); }

  var KIND = { 'built-in': ['grn', 'built in'], 'self-host': ['blu', 'you host it'],
               'cloud': ['amb', 'their cloud'], 'manual': ['gray', 'by hand'] };

  function view(H, DB, uses) {
    uses = (uses || []).filter(function (id) { return !!cap(id); });
    var alts = uses.reduce(function (s, id) { return s + cap(id).providers.length; }, 0);
    var noNet = uses.filter(function (id) { var k = prov(id, active(DB, id)); return k && (k.kind === 'built-in' || k.kind === 'manual'); }).length;

    return H.head('Connectors · Alternatives', 'Connectors',
      'Everything this app touches, and every alternative you can use for it. Nothing is locked to one company.') +
      H.note('<b>The promise, in one line:</b> no Medhava app depends on any single outside service. ' +
        'Every capability below has a built-in or by-hand option, and at least one option you can run on your own machine.') +
      H.kpis([
        { l: 'Capabilities used', v: uses.length, d: 'by this app', icon: 'layers', tone: 'teal' },
        { l: 'Alternatives available', v: alts, d: 'to choose from', icon: 'sync', tone: 'blue' },
        { l: 'Outside services required', v: 0, d: 'none, ever', cls: 'g', icon: 'check', tone: 'green' },
        { l: 'Running with nothing connected', v: noNet + ' / ' + uses.length, d: 'right now', cls: noNet === uses.length ? 'g' : '', icon: 'shield', tone: 'peach' }
      ], '') +
      H.panel('At a glance', H.table([
        { label: 'Capability', align: 'l', fmt: function (r) { return '<b>' + H.esc(r.name) + '</b><div class="hint">' + H.esc(r.what) + '</div>'; } },
        { label: 'You are using', align: 'l', fmt: function (r) { var p = prov(r.id, active(DB, r.id));
          return H.esc(p.name) + ' ' + H.tag(KIND[p.kind][1], KIND[p.kind][0]); } },
        { label: 'Alternatives', fmt: function (r) { return cap(r.id).providers.length; }, cellcls: 'mono' },
        { label: 'Works with nothing connected', align: 'l', fmt: function (r) {
          return cap(r.id).providers.some(function (p) { return p.kind === 'built-in' || p.kind === 'manual'; })
            ? H.tag('yes', 'grn') : H.tag('no', 'red'); } },
        { label: 'Can you host it yourself', align: 'l', fmt: function (r) {
          return cap(r.id).providers.some(function (p) { return p.kind === 'self-host' || p.kind === 'built-in'; })
            ? H.tag('yes', 'grn') : H.tag('no', 'red'); } }
      ], uses.map(function (id) { return cap(id); }))) +
      uses.map(function (id) {
        var c = cap(id), a = active(DB, id);
        return H.panel(H.esc(c.name) + ' <span class="badge">' + c.providers.length + ' choices</span>',
          '<p class="hint">' + H.esc(c.what) + ' Click any one to switch. Your figures do not change — only where the data comes from.</p>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          c.providers.map(function (p) {
            return '<button class="btn sm' + (p.id === a ? ' p' : '') + '" data-act="connpick" data-c="' + id + '" data-p="' + p.id + '">' +
              H.esc(p.name) + '</button>';
          }).join('') + '</div>' +
          H.table([
            { label: 'Option', align: 'l', fmt: function (p) { return (p.id === a ? '<b>' + H.esc(p.name) + '</b>' : H.esc(p.name)); } },
            { label: 'Kind', align: 'l', fmt: function (p) { return H.tag(KIND[p.kind][1], KIND[p.kind][0]); } },
            { label: 'Note', align: 'l', fmt: function (p) { return H.esc(p.note || '—'); } },
            { label: '', align: 'l', fmt: function (p) { return p.id === a ? H.tag('in use', 'grn') : ''; } }
          ], c.providers));
      }).join('') +
      H.panel('Two things worth knowing',
        '<p><b>Switching a provider never changes a figure.</b> The arithmetic lives in Medhava, not in the service. ' +
        'Move from one courier to another and your shipping records stay exactly as they were — only new labels come from somewhere else.</p>' +
        '<p><b>Cloud services are connected with a scoped, revocable key — never your account password.</b> ' +
        'A key can be limited to just what it needs and cancelled in one click, from their side, without changing your login. ' +
        'Medhava will never ask you for a marketplace or bank password.</p>');
  }

  function actions(K) {
    return {
      connpick: function (b) { var DB = K.DB, c = b.getAttribute('data-c'), p = b.getAttribute('data-p');
        if (!prov(c, p)) return; DB.prov = DB.prov || {}; DB.prov[c] = p;
        K.save(); K.toast('Switched to ' + prov(c, p).name); K.render(); }
    };
  }

  function tests(t, DB, uses) {
    uses = (uses || []).filter(function (id) { return true; });
    t('every capability this app uses is a known one', uses.every(function (id) { return !!cap(id); }));
    t('no capability offers only one choice', uses.every(function (id) { return cap(id).providers.length >= 3; }));
    t('every capability works with nothing connected (built-in or by hand)', uses.every(function (id) {
      return cap(id).providers.some(function (p) { return p.kind === 'built-in' || p.kind === 'manual'; }); }));
    t('every capability has an option you can host yourself', uses.every(function (id) {
      return cap(id).providers.some(function (p) { return p.kind === 'self-host' || p.kind === 'built-in'; }); }));
    t('exactly one provider is active per capability', uses.every(function (id) {
      return !!prov(id, active(DB, id)); }));
    t('the default provider never needs an outside service', uses.every(function (id) {
      var p = prov(id, defaultOf(id)); return p.kind === 'built-in' || p.kind === 'manual'; }));
    t('no single company is unavoidable across capabilities', (function () {
      if (uses.length < 2) return true;
      var counts = {};
      uses.forEach(function (id) { cap(id).providers.forEach(function (p) { counts[p.name] = (counts[p.name] || 0) + 1; }); });
      /* a company appearing in every capability would be a hidden dependency */
      return !Object.keys(counts).some(function (n) { return counts[n] >= uses.length && uses.length > 1; });
    })());
    if (uses.length) {
      var id = uses[0], c = cap(id), was = active(DB, id);
      var other = c.providers.filter(function (p) { return p.id !== was; })[0];
      var before = JSON.stringify(Object.keys(DB).filter(function (k) { return k !== 'prov'; }).sort()
        .map(function (k) { return [k, DB[k]]; }));
      DB.prov[id] = other.id;
      t('switching a provider changes which one is active', active(DB, id) === other.id);
      t('switching a provider changes nothing else in your data',
        JSON.stringify(Object.keys(DB).filter(function (k) { return k !== 'prov'; }).sort()
          .map(function (k) { return [k, DB[k]]; })) === before);
      DB.prov[id] = was;
    }
  }

  var API = { CAPS: CAPS, cap: cap, prov: prov, defaultOf: defaultOf, seed: seed, active: active,
              view: view, actions: actions, tests: tests };
  if (typeof window !== 'undefined') window.MedhavaProviders = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})();
</script>
<script>/* Medhava Suite kernel — shared UI runtime + components + store + self-tests.
   An app is a spec: { id,name,company,fy, groups?, nav[], seed(DB), views{}, actions{}, tests(t,DB) }. */
(function(){
  var r2=function(n){return Math.round((Number(n)+Number.EPSILON)*100)/100;};
  var num=function(n){return (n==null||n===''||isNaN(n))?0:Number(n);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var money=function(n){n=r2(n);return (n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});};
  var inr=function(n){return Number(r2(n)).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});};
  var $=function(id){return document.getElementById(id);};

  var SPEC=null, state={view:null}, DB={}, KEY='';
  function toast(m){var t=$('toast');if(!t)return;t.textContent=m;t.className='toast show';clearTimeout(t._t);t._t=setTimeout(function(){t.className='toast';},2000);}
  function setStatus(s){var p=$('statusPill');if(p)p.textContent=s;}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));setStatus('saved ✓');}catch(e){setStatus('session only');}}
  function clearDB(){Object.keys(DB).forEach(function(k){delete DB[k];});}

  var H={
    esc:esc, money:money, inr:inr, r2:r2, num:num, toast:toast, val:function(id){var e=$(id);return e?e.value:'';}, numv:function(id){return num(H.val(id));},
    head:function(crumb,h1,sub,actions){return '<div class="crumb">'+esc(crumb)+'</div><div class="h1row"><div><h1>'+esc(h1)+'</h1><div class="sub">'+esc(sub||'')+'</div></div><div>'+(actions||'')+'</div></div>';},
    note:function(t){return '<div class="note">'+t+'</div>';},
    kpis:function(arr,cls){return '<div class="kpis '+(cls||'')+'">'+arr.map(function(k){
      var chip=k.icon?'<div class="kchip c-'+(k.tone||'teal')+'"><svg class="i"><use href="#s-'+k.icon+'"/></svg></div>':'';
      return '<div class="kc"><div class="kchead"><div class="l">'+esc(k.l)+'</div>'+chip+'</div><div class="v '+(k.cls||'')+'">'+k.v+'</div><div class="l" style="margin-top:4px;text-transform:none">'+esc(k.d||'')+'</div></div>';}).join('')+'</div>';},
    /* title is trusted markup (may contain badges/tags); callers must esc() any dynamic data placed in it. */
    panel:function(title,body,actions){return '<div class="panel"><h3>'+title+(actions?'<span>'+actions+'</span>':'')+'</h3>'+body+'</div>';},
    table:function(cols,rows){
      var th=cols.map(function(c){return '<th class="'+(c.align||'')+'">'+esc(c.label||'')+'</th>';}).join('');
      var body=rows.length?rows.map(function(row){return '<tr>'+cols.map(function(c){
        var v=c.fmt?c.fmt(row):row[c.k]; var cls=(c.align||'')+(c.cellcls?' '+(typeof c.cellcls==='function'?c.cellcls(row):c.cellcls):'');
        return '<td class="'+cls+'">'+(v==null?'':v)+'</td>';}).join('')+'</tr>';}).join('')
        :'<tr><td class="l" colspan="'+cols.length+'"><div class="empty">No rows yet.</div></td></tr>';
      return '<table><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table>';
    },
    tag:function(text,tone){return '<span class="tag t-'+(tone||'gray')+'">'+esc(text)+'</span>';},
    bar:function(pct){pct=Math.max(0,Math.min(100,pct));return '<div class="bar"><i style="width:'+pct+'%"></i></div>';},
    fields:function(fields){return fields.map(function(f){
      if(f.type==='select'){var opts=(f.options||[]).map(function(o){var v=typeof o==='object'?o.v:o,l=typeof o==='object'?o.label:o;return '<option value="'+esc(v)+'"'+(f.value==v?' selected':'')+'>'+esc(l)+'</option>';}).join('');
        return '<div class="fld'+(f.wide?' wide':'')+(f.full?' full':'')+'"><label>'+esc(f.label)+'</label><select id="'+f.id+'">'+opts+'</select></div>';}
      if(f.type==='textarea') return '<div class="fld full"><label>'+esc(f.label)+'</label><textarea id="'+f.id+'">'+esc(f.value||'')+'</textarea></div>';
      return '<div class="fld'+(f.wide?' wide':'')+(f.full?' full':'')+'"><label>'+esc(f.label)+'</label><input id="'+f.id+'" type="'+(f.type==='num'?'number':(f.type||'text'))+'" value="'+esc(f.value==null?'':f.value)+'" '+(f.type==='num'?'step="0.01"':'')+' placeholder="'+esc(f.ph||'')+'"></div>';
    }).join('');},
    form:function(fields,submitLabel,act,cls){return '<div class="form '+(cls||'f2')+'">'+H.fields(fields)+'<div class="fld full" style="align-items:flex-end"><button class="btn p" data-act="'+act+'">'+esc(submitLabel)+'</button></div></div>';},
    go:function(v){go(v);}, save:function(){save();}, render:function(){render();}
  };

  function buildShell(){
    var groups=SPEC.groups||[{label:SPEC.name,items:SPEC.nav.map(function(n){return n.v;})}];
    var navMap={}; SPEC.nav.forEach(function(n){navMap[n.v]=n;});
    var nav=groups.map(function(g){return '<div class="gg">'+esc(g.label)+'</div>'+g.items.map(function(v){var n=navMap[v];return n?'<a data-v="'+v+'"><svg class="i"><use href="#s-'+(n.icon||'grid')+'"/></svg> '+esc(n.label)+'</a>':'';}).join('');}).join('');
    $('root').innerHTML='<div class="app" id="appRoot"><div class="top">'+
      '<button class="hamb" id="hamb"><svg class="i" style="width:22px;height:22px;stroke-width:2"><use href="#s-menu"/></svg></button>'+
      '<div class="logo"><span class="sm"><svg width="19" height="19" viewBox="0 0 40 40"><path d="M9 31V15l11 11 11-11v16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 5c.25 3.1.8 3.8 3.9 4.05-3.1.25-3.65.95-3.9 4.05-.25-3.1-.8-3.8-3.9-4.05C19.2 8.8 19.75 8.1 20 5z" fill="#fff"/></svg></span> <b>Medhava</b> <span class="ap">'+esc(SPEC.name)+'</span></div>'+
      '<div class="tpill">'+esc(SPEC.company||'Vastrangam')+'</div><div class="tpill">'+esc(SPEC.fy||'FY 2026-27')+'</div>'+
      '<span class="sp"></span><div class="tpill" id="statusPill">saved ✓</div><div class="tavatar">P</div></div>'+
      '<nav class="side" id="nav">'+nav+'</nav><main class="main" id="main"></main><div class="navback" id="navback"></div></div>';
    var root=$('appRoot');
    $('nav').addEventListener('click',function(e){var a=e.target.closest('a[data-v]');if(a)go(a.getAttribute('data-v'));});
    $('hamb').onclick=function(){root.classList.toggle('navopen');};
    $('navback').onclick=function(){root.classList.remove('navopen');};
    $('main').addEventListener('click',function(e){
      var g=e.target.closest('[data-go]'); if(g){go(g.getAttribute('data-go'));return;}
      var b=e.target.closest('[data-act]'); if(b){var fn=SPEC.actions[b.getAttribute('data-act')]; if(fn)fn(b); }
    });
  }
  function go(v){ if(v!=='backup'&&!(SPEC.views&&SPEC.views[v]))v=SPEC.nav[0].v; state.view=v; var r=$('appRoot'); if(r)r.classList.remove('navopen');
    [].forEach.call(document.querySelectorAll('#nav a[data-v]'),function(a){a.className=a.getAttribute('data-v')===v?'on':'';});
    render(); window.scrollTo(0,0);
  }
  function render(){ var v=state.view; $('main').innerHTML = v==='backup'?backupView():(SPEC.views[v]||SPEC.views[SPEC.nav[0].v])(); }

  function backupView(){
    var t=window.__selftest||{pass:0,fail:0,log:[]};
    var rows=t.log.map(function(l){return {s:l.ok?'<span class="tag t-grn">pass</span>':'<span class="tag t-red">fail</span>',n:esc(l.name)};});
    return H.head('System · Backup','Backup & Health','Your data lives in this browser. Export a JSON backup any time.')+
      H.panel('Data','<div style="display:flex;gap:9px;flex-wrap:wrap">'+
        '<button class="btn p" data-act="_export"><svg class="i"><use href="#s-save"/></svg> Export JSON</button>'+
        '<button class="btn" data-act="_import"><svg class="i"><use href="#s-sync"/></svg> Import JSON</button>'+
        '<button class="btn" data-act="_reseed">Reload demo data</button>'+
        '<button class="btn d" data-act="_wipe">Wipe all</button></div>')+
      H.panel('Self-tests <span class="badge">'+t.pass+'/'+(t.pass+t.fail)+' pass</span>',
        rows.length?H.table([{label:'',align:'l',k:'s'},{label:'Check',align:'l',k:'n'}],rows):'<div class="empty">No self-tests defined.</div>');
  }
  function download(name,text){var b=new Blob([text],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
  function pickFile(cb){var inp=$('fileIn');inp.value='';inp.onchange=function(){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){cb(rd.result);};rd.readAsText(f);};inp.click();}
  var builtins={
    _export:function(){download((SPEC.id||'medhava')+'-backup.json',JSON.stringify(DB,null,2));toast('Backup exported');},
    _import:function(){pickFile(function(txt){try{var o=JSON.parse(txt);clearDB();Object.assign(DB,o);save();toast('Imported ✓');go(SPEC.nav[0].v);}catch(e){toast('Bad file');}});},
    /* The store is shared across every module now, so these two say exactly
       what they will touch. Reseeding replaces only the collections this app

      cols: [ { k: 'id', l: 'Reference', type: 'text', req: 1 },
              { k: 'title', l: 'Title', type: 'text', req: 1 },
              { k: 'type', l: 'Kind of document', type: 'text', req: 1 },
              { k: 'againstKind', l: 'Filed against', type: 'text', req: 1 },
              { k: 'against', l: 'Which record', type: 'text', req: 1 },
              { k: 'issued', l: 'Issued on', type: 'date', req: 1 },
              { k: 'expires', l: 'Expires on', type: 'date' },
              { k: 'status', l: 'State', type: 'text', req: 1 },
              { k: 'signer', l: 'Who signs it', type: 'text' },
              { k: 'signedOn', l: 'Signed on', type: 'date' },
              { k: 'code', l: 'One-time code used', type: 'text' } ] },
    { key: 'tickets', label: 'Tickets', icon: 'bell', one: 'ticket',
      note: 'A question arriving by chat, email or phone, tied to the party and usually to the order it is about.',
      cols: [ { k: 'id', l: 'Ticket', type: 'text', req: 1 },
              { k: 'party', l: 'Party', type: 'party', req: 1 },
              { k: 'order', l: 'About which order', type: 'text' },
              { k: 'channel', l: 'Arrived by', type: 'text', req: 1 },
              { k: 'subject', l: 'Subject', type: 'text', req: 1 },
              { k: 'priority', l: 'Priority', type: 'text' },
              { k: 'agent', l: 'Handled by', type: 'text' },
              { k: 'opened', l: 'Opened at', type: 'stamp', req: 1 },
              { k: 'closed', l: 'Closed at', type: 'stamp' } ] },
    { key: 'messages', label: 'Ticket messages', icon: 'mail', one: 'message',
      note: 'What was actually said, and when. The first-reply clock is worked out from these — never typed in.',
      cols: [ { k: 'id', l: 'Reference', type: 'text', req: 1 },
              { k: 'ticket', l: 'Ticket', type: 'text', req: 1 },
              { k: 'who', l: 'Customer or us', type: 'text', req: 1 },
              { k: 'at', l: 'At', type: 'stamp', req: 1 },
              { k: 'text', l: 'What was said', type: 'text' } ] },
    { key: 'notes', label: 'Conversation log', icon: 'thread', one: 'note',
      note: 'Calls, visits and promises. The only thing in this module a person types from scratch.',
      cols: [ { k: 'id', l: 'Reference', type: 'text', req: 1 },
              { k: 'party', l: 'Party', type: 'party', req: 1 },
              { k: 'date', l: 'Date', type: 'date', req: 1 },
              { k: 'kind', l: 'Call / visit / email', type: 'text' },
              { k: 'text', l: 'What happened', type: 'text' } ] },
  ];
  var TBL = {}; TABLES.forEach(function (t) { TBL[t.key] = t; });

  var seq = 0;
  function uid(p) { seq++; return p + '-' + (Date.now() % 100000) + '-' + seq; }

  /* ═══════════════ 2 · THE PIPELINE ═══════════════
     Five stages, each carrying a real probability of closing, so the forecast is honest
     instead of hopeful. The probabilities are config, not code — every trade argues about
     them and every trade should be able to set its own. */
  var STAGES = [{ k: 'new', l: 'New', p: 10 }, { k: 'contacted', l: 'Contacted', p: 25 },
                { k: 'quoted', l: 'Quoted', p: 50 }, { k: 'negotiation', l: 'Negotiation', p: 75 }];
  function stageOf(k) { return STAGES.filter(function (s) { return s.k === k; })[0] || STAGES[0]; }
  function openLeads(DB) { return (DB.leads || []).filter(function (l) { return l.status === 'open'; }); }
  function wonLeads(DB) { return (DB.leads || []).filter(function (l) { return l.status === 'won'; }); }
  function lostLeads(DB) { return (DB.leads || []).filter(function (l) { return l.status === 'lost'; }); }
  function pipelineValue(DB) { return r2(openLeads(DB).reduce(function (s, l) { return s + num(l.value); }, 0)); }
  function weightedPipeline(DB) {
    return r2(openLeads(DB).reduce(function (s, l) { return s + num(l.value) * stageOf(l.stage).p / 100; }, 0));
  }
  function wonValue(DB) { return r2(wonLeads(DB).reduce(function (s, l) { return s + num(l.value); }, 0)); }
  function winRate(DB) { var w = wonLeads(DB).length, l = lostLeads(DB).length; return (w + l) ? Math.round(w / (w + l) * 100) : 0; }
  function avgDeal(DB) { var w = wonLeads(DB); return w.length ? r2(wonValue(DB) / w.length) : 0; }
  function byStage(DB) {
    return STAGES.map(function (s) {
      var rows = openLeads(DB).filter(function (l) { return l.stage === s.k; });
      return { stage: s.l, key: s.k, prob: s.p, n: rows.length,
        value: r2(rows.reduce(function (t, l) { return t + num(l.value); }, 0)),
        weighted: r2(rows.reduce(function (t, l) { return t + num(l.value) * s.p / 100; }, 0)) };
    });
  }
  function lostReasons(DB) {
    var m = {};
    lostLeads(DB).forEach(function (l) {
      var r = l.reason || 'Not given';
      m[r] = m[r] || { reason: r, n: 0, value: 0 };
      m[r].n++; m[r].value = r2(m[r].value + num(l.value));
    });
    return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return b.value - a.value; });
  }

  /* THE FIRST GATE. Winning a lead must produce ONE party, never a second copy of one you
     already have. Two records for one customer is how a business ends up with two different
     answers to "what are they worth", and nobody can say which is right. */
  function findParty(DB, name) {
    var n = String(name || '').trim().toLowerCase();
    return (DB.parties || []).filter(function (p) { return String(p.name).trim().toLowerCase() === n; })[0] || null;
  }
  function winLead(DB, leadId, cfg) {
    var lead = (DB.leads || []).filter(function (l) { return l.id === leadId; })[0];
    if (!lead) return { ok: false, reason: 'No such lead.' };
    if (lead.status === 'won')
      return { ok: false, refused: true,
        reason: lead.name + '’s deal has already been won, and it already became ' +
          partyName(DB, lead.party) + '. Winning it twice would put the same work in the ' +
          'forecast twice and the same customer on the books twice.' };
    var existing = findParty(DB, lead.co || lead.name);
    lead.status = 'won';
    if (existing) {
      lead.party = existing.id;
      return { ok: true, party: existing.id, reused: true,
        note: existing.name + ' is already on the books, so the deal was attached to that record ' +
          'rather than a second one. Their history now includes this win.' };
    }
    var id = 'P' + ((DB.parties || []).length + 1);
    while ((DB.parties || []).some(function (p) { return p.id === id; })) id = id + 'x';
    DB.parties.push({ id: id, name: lead.co || lead.name, type: (cfg && cfg.wonType) || 'Customer',
      city: (cfg && cfg.wonCity) || '', email: '', since: dateOnly(TODAY) });
    lead.party = id;
    return { ok: true, party: id, reused: false, note: 'A new party record was opened for them.' };
  }

  /* ═══════════════ 3 · THE PARTY, AND WHAT IT IS WORTH ═══════════════ */
  function partyName(DB, id) {
    var p = (DB.parties || []).filter(function (x) { return x.id === id; })[0];
    return p ? p.name : (id || '—');
  }
  function ordersOf(DB, pid) { return (DB.orders || []).filter(function (o) { return o.party === pid; }); }
  function profile(DB, p) {
    var os = ordersOf(DB, p.id);
    var gross = r2(os.reduce(function (s, o) { return s + num(o.amount); }, 0));
    var ret = r2(os.reduce(function (s, o) { return s + num(o.returned); }, 0));
    var last = os.length ? os.map(function (o) { return o.date; }).sort().slice(-1)[0] : null;
    return { id: p.id, name: p.name, type: p.type, city: p.city, since: p.since, email: p.email,
      orders: os.length, gross: gross, returns: ret, value: r2(gross - ret),
      aov: os.length ? r2((gross - ret) / os.length) : 0,
      rr: gross ? Math.round(ret / gross * 100) : 0,
      last: last, lastAge: last ? days(last) : 9999, age: days(p.since),
      docs: docsFor(DB, 'Party', p.id).length,
      openTickets: ticketsOf(DB, p.id).filter(function (t) { return !t.closed; }).length };
  }
  function profiles(DB) { return (DB.parties || []).map(function (p) { return profile(DB, p); }); }
  function channelMix(DB, pid) {
    var m = {};
    ordersOf(DB, pid).forEach(function (o) {
      var e = m[o.channel] = m[o.channel] || { channel: o.channel, n: 0, gross: 0, ret: 0 };
      e.n++; e.gross = r2(e.gross + num(o.amount)); e.ret = r2(e.ret + num(o.returned));
    });
    return Object.keys(m).map(function (k) {
      var e = m[k]; e.kept = r2(e.gross - e.ret); e.rr = e.gross ? Math.round(e.ret / e.gross * 100) : 0; return e;
    }).sort(function (a, b) { return b.kept - a.kept; });
  }

  /* Six behaviour groups, worked out by rule from how often somebody buys and how long ago —
     never tagged by hand, so they update themselves the moment somebody buys or goes quiet. */
  var SEGMENTS = ['Champion', 'Loyal', 'Needs attention', 'At risk', 'Sleeping', 'New'];
  function segmentOf(p) {
    if (p.orders === 0) return 'New';
    if (p.lastAge > 180) return 'Sleeping';
    if (p.lastAge > 90) return 'At risk';
    if (p.orders >= 4 && p.lastAge <= 45) return 'Champion';
    if (p.orders >= 2) return p.lastAge <= 60 ? 'Loyal' : 'Needs attention';
    return 'New';
  }
  function segCounts(DB) {
    var m = {}; SEGMENTS.forEach(function (s) { m[s] = { seg: s, n: 0, value: 0 }; });
    profiles(DB).forEach(function (p) { var s = segmentOf(p); m[s].n++; m[s].value = r2(m[s].value + p.value); });
    return SEGMENTS.map(function (s) { return m[s]; });
  }
  function totalValue(DB) { return r2(profiles(DB).reduce(function (s, p) { return s + p.value; }, 0)); }
  function repeatRate(DB) {
    var ps = profiles(DB).filter(function (p) { return p.orders > 0; });
    return ps.length ? Math.round(ps.filter(function (p) { return p.orders >= 2; }).length / ps.length * 100) : 0;
  }
  function atRisk(DB) {
    return profiles(DB).filter(function (p) { return segmentOf(p) === 'At risk' || segmentOf(p) === 'Sleeping'; });
  }
  function notesOf(DB, pid) {
    return (DB.notes || []).filter(function (n) { return n.party === pid; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }

  /* ═══════════════ 4 · DOCUMENTS ═══════════════
     A document belongs to a RECORD, not to a folder. What kind of record is a setting, not
     an assumption — a law firm files against a case, a workshop against a job, a clothing
     house against a style, and all three are this one field. */
  var DOCSTATES = ['draft', 'sent', 'signed', 'declined', 'filed'];
  function docsFor(DB, kind, id) {
    return (DB.docs || []).filter(function (d) { return d.againstKind === kind && String(d.against) === String(id); });
  }
  function docsOfParty(DB, pid) {
    /* a document is that party's if it is filed against them, or against one of their orders */
    var mine = ordersOf(DB, pid).map(function (o) { return o.id; });
    return (DB.docs || []).filter(function (d) {
      return (d.againstKind === 'Party' && d.against === pid) ||
             (d.againstKind === 'Order' && mine.indexOf(d.against) >= 0);
    });
  }
  function docByStatus(DB) {
    var m = {};
    DOCSTATES.forEach(function (s) { m[s] = 0; });
    (DB.docs || []).forEach(function (d) { m[d.status] = (m[d.status] || 0) + 1; });
    return DOCSTATES.map(function (s) { return { status: s, n: m[s] || 0 }; });
  }
  function awaitingSignature(DB) { return (DB.docs || []).filter(function (d) { return d.status === 'sent'; }); }
  function expiringSoon(DB, within) {
    within = within || 60;
    return (DB.docs || []).filter(function (d) {
      if (!d.expires) return false;
      var left = days(TODAY, d.expires);
      return left <= within;
    }).sort(function (a, b) { return a.expires < b.expires ? -1 : 1; });
  }
  function daysLeft(d) { return d.expires ? days(TODAY, d.expires) : null; }

  /* Does the record a document claims to be filed against actually exist? A document filed
     against nothing is a document nobody will ever find again. */
  function recordExists(DB, kind, id) {
    if (kind === 'Party') return (DB.parties || []).some(function (p) { return p.id === id; });
    if (kind === 'Order') return (DB.orders || []).some(function (o) { return o.id === id; });
    /* Projects, cases, jobs and people live in other modules; here they are named, and a
       named record is accepted as long as it is actually named. */
    return String(id || '').trim().length > 0;
  }
  function orphanDocs(DB) {
    return (DB.docs || []).filter(function (d) { return !recordExists(DB, d.againstKind, d.against); });
  }

  /* THE SECOND GATE. A document is not signed because somebody ticked a box. It is signed
     because a one-time code was sent to the signer and came back. No code, no signature —
     and the app will not pretend otherwise, because a signature nobody can evidence is worse
     than no signature at all. */
  function signDoc(DB, docId, code) {
    var d = (DB.docs || []).filter(function (x) { return x.id === docId; })[0];
    if (!d) return { ok: false, reason: 'No such document.' };
    if (d.status === 'signed')
      return { ok: false, refused: true, reason: d.title + ' was already signed on ' + d.signedOn + '.' };
    if (d.status === 'draft')
      return { ok: false, refused: true,
        reason: d.title + ' has not been sent to anybody yet. Send it for signature first — ' +
          'a document cannot come back signed before it goes out.' };
    if (!String(code || '').trim())
      return { ok: false, refused: true,
        reason: 'No one-time code was given. A signature is only a signature if it can be evidenced: ' +
          'the code goes to ' + (d.signer || 'the signer') + ', comes back from them, and is recorded ' +
          'against the document. Ticking a box is not a signature.' };
    if (!/^\d{6}$/.test(String(code).trim()))
      return { ok: false, refused: true,
        reason: 'A one-time code is six digits. "' + code + '" is not one, so nothing has been recorded.' };
    d.status = 'signed'; d.signedOn = dateOnly(TODAY); d.code = String(code).trim();
    return { ok: true, doc: d };
  }
  function sendDoc(DB, docId) {
    var d = (DB.docs || []).filter(function (x) { return x.id === docId; })[0];
    if (!d) return { ok: false, reason: 'No such document.' };
    if (d.status !== 'draft')
      return { ok: false, refused: true, reason: d.title + ' has already been sent — it is "' + d.status + '".' };
    if (!String(d.signer || '').trim())
      return { ok: false, refused: true,
        reason: 'Nobody is named as the signer, so there is nowhere to send the one-time code to.' };
    d.status = 'sent';
    return { ok: true, doc: d };
  }

  /* ═══════════════ 5 · TICKETS ═══════════════ */
  function ticketsOf(DB, pid) { return (DB.tickets || []).filter(function (t) { return t.party === pid; }); }
  function msgsOf(DB, tid) {
    return (DB.messages || []).filter(function (m) { return m.ticket === tid; })
      .sort(function (a, b) { return a.at < b.at ? -1 : 1; });
  }
  /* THE THIRD GATE, and the most quietly important one: the first-reply clock is WORKED OUT
     from the messages. It is not a field anybody can set. A support metric you can type is a
     support metric that will be typed. */
  function firstReplyMins(DB, t) {
    var ours = msgsOf(DB, t.id).filter(function (m) { return m.who === 'us' && m.at > t.opened; })[0];
    return ours ? mins(t.opened, ours.at) : null;
  }
  function resolveMins(DB, t) { return t.closed ? mins(t.opened, t.closed) : null; }
  function slaFirst(DB) { return num(DB.sla && DB.sla.firstReplyMins) || 120; }
  function slaResolve(DB) { return num(DB.sla && DB.sla.resolveMins) || 2880; }
  function ticketRow(DB, t) {
    var fr = firstReplyMins(DB, t), rs = resolveMins(DB, t);
    return { id: t.id, party: t.party, partyName: partyName(DB, t.party), order: t.order,
      channel: t.channel, subject: t.subject, priority: t.priority || 'Normal', agent: t.agent || '—',
      opened: t.opened, closed: t.closed || '', open: !t.closed,
      firstReply: fr, replied: fr !== null,
      firstLate: fr === null ? mins(t.opened, nowStamp()) > slaFirst(DB) : fr > slaFirst(DB),
      resolveMins: rs, resolveLate: rs !== null && rs > slaResolve(DB),
      ageMins: mins(t.opened, t.closed || nowStamp()) };
  }
  function nowStamp() { return TODAY + 'T18:00'; }
  function ticketRows(DB) { return (DB.tickets || []).map(function (t) { return ticketRow(DB, t); }); }
  function openTickets(DB) { return ticketRows(DB).filter(function (t) { return t.open; }); }
  function unanswered(DB) { return ticketRows(DB).filter(function (t) { return t.open && !t.replied; }); }
  function breached(DB) { return ticketRows(DB).filter(function (t) { return t.firstLate; }); }
  function firstReplyPct(DB) {
    var rows = ticketRows(DB).filter(function (t) { return t.replied; });
    return rows.length ? Math.round(rows.filter(function (t) { return !t.firstLate; }).length / rows.length * 100) : 0;
  }
  function medianFirstReply(DB) {
    var v = ticketRows(DB).filter(function (t) { return t.replied; }).map(function (t) { return t.firstReply; }).sort(function (a, b) { return a - b; });
    if (!v.length) return 0;
    var mid = Math.floor(v.length / 2);
    return v.length % 2 ? v[mid] : Math.round((v[mid - 1] + v[mid]) / 2);
  }
  function byChannel(DB) {
    var m = {};
    ticketRows(DB).forEach(function (t) {
      var e = m[t.channel] = m[t.channel] || { channel: t.channel, n: 0, open: 0, late: 0, replySum: 0, replied: 0 };
      e.n++; if (t.open) e.open++; if (t.firstLate) e.late++;
      if (t.replied) { e.replySum += t.firstReply; e.replied++; }
    });
    return Object.keys(m).map(function (k) {
      var e = m[k]; e.avgReply = e.replied ? Math.round(e.replySum / e.replied) : null; return e;
    }).sort(function (a, b) { return b.n - a.n; });
  }
  function byAgent(DB) {
    var m = {};
    ticketRows(DB).forEach(function (t) {
      var e = m[t.agent] = m[t.agent] || { agent: t.agent, n: 0, open: 0, closed: 0, replySum: 0, replied: 0 };
      e.n++; if (t.open) e.open++; else e.closed++;
      if (t.replied) { e.replySum += t.firstReply; e.replied++; }
    });
    return Object.keys(m).map(function (k) {
      var e = m[k]; e.avgReply = e.replied ? Math.round(e.replySum / e.replied) : null; return e;
    }).sort(function (a, b) { return b.n - a.n; });
  }
  /* A ticket may name one of that party's own orders, and no one else's. Attaching a
     complaint to a stranger's order is how support ends up telling the wrong customer about
     the wrong delivery. */
  function attachOrder(DB, ticketId, orderId) {
    var t = (DB.tickets || []).filter(function (x) { return x.id === ticketId; })[0];
    if (!t) return { ok: false, reason: 'No such ticket.' };
    if (!orderId) { t.order = ''; return { ok: true }; }
    var o = (DB.orders || []).filter(function (x) { return x.id === orderId; })[0];
    if (!o) return { ok: false, refused: true, reason: 'There is no order ' + orderId + '.' };
    if (o.party !== t.party)
      return { ok: false, refused: true,
        reason: 'Order ' + orderId + ' belongs to ' + partyName(DB, o.party) + ', and this ticket is ' +
          partyName(DB, t.party) + '’s. Attaching it would put one customer’s delivery on another ' +
          'customer’s screen.' };
    t.order = orderId;
    return { ok: true };
  }
  function reply(DB, ticketId, text) {
    var t = (DB.tickets || []).filter(function (x) { return x.id === ticketId; })[0];
    if (!t) return { ok: false, reason: 'No such ticket.' };
    if (!String(text || '').trim()) return { ok: false, reason: 'Type something first.' };
    DB.messages.push({ id: uid('msg'), ticket: ticketId, who: 'us', at: nowStamp(), text: String(text).trim() });
    return { ok: true };
  }
  function closeTicket(DB, ticketId) {
    var t = (DB.tickets || []).filter(function (x) { return x.id === ticketId; })[0];
    if (!t) return { ok: false, reason: 'No such ticket.' };
    if (t.closed) return { ok: false, refused: true, reason: 'That ticket is already closed.' };
    if (!msgsOf(DB, t.id).some(function (m) { return m.who === 'us'; }))
      return { ok: false, refused: true,
        reason: 'Nobody has answered ' + partyName(DB, t.party) + ' yet. A ticket closed without a ' +
          'single reply is a customer who was ignored and then marked "resolved" — so this is refused.' };
    t.closed = nowStamp();
    return { ok: true };
  }

  /* ═══════════════ 6 · THE TIMELINE — the reason these three are one module ═══════════════
     Everything that ever happened with one party, from all three apps, in one list. This is
     the whole argument for the module: a person on the phone should not have to open three
     programs to find out what has been going on. */
  function timeline(DB, pid) {
    var out = [];
    ordersOf(DB, pid).forEach(function (o) {
      out.push({ at: o.date, kind: 'Order', icon: 'cart', what: o.id + ' · ' + (o.channel || ''),
        detail: 'Ordered', amount: num(o.amount), extra: num(o.returned) ? 'returned ' + o.returned : '' });
    });
    docsOfParty(DB, pid).forEach(function (d) {
      out.push({ at: d.signedOn || d.issued, kind: 'Document', icon: 'doc', what: d.title,
        detail: d.type + ' · ' + d.status, amount: null,
        extra: d.status === 'signed' ? 'signed with a one-time code' : (d.expires ? 'expires ' + d.expires : '') });
    });
    ticketsOf(DB, pid).forEach(function (t) {
      var r = ticketRow(DB, t);
      out.push({ at: dateOnly(t.opened), kind: 'Ticket', icon: 'bell', what: t.subject,
        detail: t.channel + ' · ' + (r.open ? 'open' : 'closed'), amount: null,
        extra: r.replied ? 'first reply in ' + r.firstReply + ' min' : 'not answered yet' });
    });
    notesOf(DB, pid).forEach(function (n) {
      out.push({ at: n.date, kind: 'Note', icon: 'thread', what: n.kind || 'Note', detail: n.text, amount: null, extra: '' });
    });
    (DB.leads || []).filter(function (l) { return l.party === pid; }).forEach(function (l) {
      out.push({ at: l.created, kind: 'Lead', icon: 'flow', what: l.name + ' · ' + (l.co || ''),
        detail: 'Came in from ' + (l.src || 'somewhere') + ' · ' + l.status, amount: num(l.value), extra: '' });
    });
    return out.sort(function (a, b) { return a.at < b.at ? 1 : a.at > b.at ? -1 : 0; });
  }

  /* ═══════════════ 7 · IMPORT AND EXPORT ═══════════════ */
  function validate(DB, key, rec) {
    var t = TBL[key], bad = [];
    t.cols.forEach(function (c) {
      var v = rec[c.k];

  /* ══════════ the actions, shared the same way ══════════ */
  function actions(CFG) {
    CFG = CFG || {};
    var A = {};
    var refuse = function (DB, reason, kind) {
      DB.lastRefusal = { kind: kind || 'a rule, not an error', reason: reason };
      K.save(); toast('Refused'); K.render();
    };
    A.dismiss = function () { var DB = db(); DB.lastRefusal = null; K.save(); K.render(); };
    A.setparty = function (b) { var DB = db(); DB.sel = b.getAttribute('data-p'); K.save(); K.go('person'); };
    A.setseg = function (b) { var DB = db(); DB.seg = b.getAttribute('data-s'); K.save(); K.render(); };
    A.setdocf = function (b) { var DB = db(); DB.docFilter = b.getAttribute('data-f'); K.save(); K.render(); };
    A.settktf = function (b) { var DB = db(); DB.tktFilter = b.getAttribute('data-f'); K.save(); K.render(); };
    A.seldoc = function (b) { var DB = db(); DB.selDoc = b.getAttribute('data-id'); DB.lastRefusal = null; K.save(); K.render(); };
    A.seltkt = function (b) { var DB = db(); DB.selTicket = b.getAttribute('data-id'); DB.lastRefusal = null; K.save(); K.go('ticket'); };

    A.win = function (b) {
      var DB = db(), res = M02.winLead(DB, b.getAttribute('data-id'), CFG);
      if (!res.ok) return refuse(DB, res.reason);
      DB.lastRefusal = null; DB.sel = res.party;
      K.save(); toast(res.reused ? 'Won — attached to the record you already had' : 'Won — a new party record was opened'); K.render();
    };
    A.addnote = function () {
      var DB = db(), text = (H.val('n_text') || '').trim();
      if (!text) { toast('Type what happened first'); return; }
      DB.notes.push({ id: M02.uid('n'), party: DB.sel, date: M02.dateOnly(M02.TODAY), kind: H.val('n_kind'), text: text });
      K.save(); toast('Recorded ✓'); K.render();
    };

    A.senddoc = function (b) {
      var DB = db(), res = M02.sendDoc(DB, b.getAttribute('data-id'));
      if (!res.ok) return refuse(DB, res.reason);
      DB.lastRefusal = null; DB.selDoc = res.doc.id;
      K.save(); toast('Sent — a one-time code went to ' + res.doc.signer); K.render();
    };
    A.signdoc = function () {
      var DB = db(), res = M02.signDoc(DB, DB.selDoc, H.val('sg_code'));
      if (!res.ok) return refuse(DB, res.reason);
      DB.lastRefusal = null; DB.selDoc = null;
      K.save(); toast('Signed ✓ — the code is recorded against it'); K.render();
    };
    A.adddoc = function () {
      var DB = db();
      var rec = { id: 'D-' + (2100 + (DB.docs || []).length), title: (H.val('d_title') || '').trim(),
        type: H.val('d_type'), againstKind: H.val('d_kind'), against: (H.val('d_against') || '').trim(),
        issued: M02.dateOnly(M02.TODAY), expires: (H.val('d_expires') || '').trim(),
        status: (H.val('d_signer') || '').trim() ? 'draft' : 'filed',
        signer: (H.val('d_signer') || '').trim(), signedOn: '', code: '' };
      if (!rec.title) { toast('Give it a title'); return; }
      if (!rec.against) return refuse(DB, 'A document has to be filed against something. Filing against nothing is how a document is never found again.');
      if (!M02.recordExists(DB, rec.againstKind, rec.against))
        return refuse(DB, 'There is no ' + rec.againstKind.toLowerCase() + ' "' + rec.against + '". ' +
          'A document filed against a record that does not exist cannot be found from that record — which is the only way anybody looks for one.');
      DB.docs.push(rec); DB.lastRefusal = null;
      K.save(); toast('Filed against ' + rec.againstKind + ' ' + rec.against); K.render();
    };

    A.replytkt = function () {
      var DB = db(), res = M02.reply(DB, DB.selTicket, H.val('tk_reply'));
      if (!res.ok) { toast(res.reason); return; }
      K.save(); toast('Sent — the first-reply clock is worked out from this'); K.render();
    };
    A.closetkt = function () {
      var DB = db(), res = M02.closeTicket(DB, DB.selTicket);
      if (!res.ok) return refuse(DB, res.reason);
      DB.lastRefusal = null; K.save(); toast('Closed'); K.render();
    };
    A.attachorder = function () {
      var DB = db(), res = M02.attachOrder(DB, DB.selTicket, (H.val('tk_order') || '').trim());
      if (!res.ok) return refuse(DB, res.reason);
      DB.lastRefusal = null; K.save(); toast('Attached'); K.render();
    };
    return A;
  }

  /* ══════════ what a screen can actually be pressed on ══════════
     Renders every screen of an app with the states that reveal its conditional buttons
     already set, and hands back the whole lot as one string. Each app then asserts that
     every action it declares appears in it.

     A button that exists in the code and on no screen is a promise the app does not keep —
     and it is silent, because nothing errors. It is only found by somebody looking for the
     button, which is to say by a customer. */
  /* True only where the screens can actually be built — the browser. build_deep.js runs each
     spec in a bare Node sandbox with no renderer at all, so there is nothing to probe there.
     The check is not skipped, it moves: the app itself runs it every time it opens, and
     check_deep.js and verify_m02_manual.js both refuse a build where it did not run. */

/* Reachable from the browser console, the same way M02 is — so "which button is missing?"

/* Medhava — CRM & Customer 360 (Module 02 · App 1)

   Lead → contacted → quoted → negotiation → won, and then the same record carries the whole
   lifetime: every order, every return, what the customer is actually worth, and which of six
   behaviour groups they fall into.

   THE GATE THIS APP REFUSES ON: winning a deal produces ONE party, never a second copy of one
   you already have. Two records for one customer is how a business ends up with two different
   answers to "what are they worth" and nobody able to say which is right. Win a deal for an
   organisation already on the books and the win attaches to the record you have.

   And because this module has one spine, the customer record also carries what the other two
   apps know: every document filed against that party or its orders, and every question they
   have ever asked. Not copied here — read from there. That is what the timeline on Customer
   360 is, and it is the whole argument for these three being one module.

   work them. Sending a document for signature and answering a ticket belong to the apps whose
   job that is. */
var K = typeof Medhava !== 'undefined' ? Medhava : {};
var H = K.H, esc = K.esc;
var CFG = (typeof CONFIG !== 'undefined') ? CONFIG : {};

var V = M02V.make(CFG, {
  own: { docs: false, desk: false },   /* it can win a deal and record a note; it cannot sign a document or answer a ticket */
  title: CFG.name,
  wiringTitle: 'Where every number on a customer record comes from',
  wiringSub: 'This app owns the leads and the conversation log. Everything else on the record is read from the module that owns it.',
  wiringPanels: function () {
    return H.panel('One record, from first enquiry to last order',
      '<div class="cascade">' +
      '<div class="cl"><span class="d">1</span><div>An enquiry arrives and becomes a <b>lead</b>, with a stage and a real probability.</div></div>' +
      '<div class="cl"><span class="d">2</span><div>You win it. The <b>same record</b> becomes the party — or attaches to the party you already had.</div></div>' +
      '<div class="cl"><span class="d">3</span><div>Orders arrive from Sales and the marketplaces. Worth, returns and last-order age are worked out, never typed.</div></div>' +
      '<div class="cl"><span class="d">4</span><div>Documents filed against them, and tickets they raise, appear on the same record.</div></div>' +
      '<div class="cl"><span class="d">5</span><div>Their behaviour group changes itself the moment any of that moves.</div></div>' +
      '</div>') +
    H.panel('What this app deliberately will not do',
      '<p>It shows documents and tickets; it does not <b>work</b> them. Sending an agreement for signature belongs to ' +
      '<b>Documents &amp; eSign</b>, and answering a question belongs to <b>Helpdesk &amp; Live Chat</b> — the apps whose ' +
      'rules those are.</p>' +
      '<p class="hint">Same records, same engine, different responsibilities. In the combined app of this module you get all three sets of buttons on one screen.</p>');

/* The whole of what this app can DO. The kernel adds backup and connector buttons of its own

})(M02V.actions(CFG));

var SPEC = {
  uses: ['channels', 'ledger', 'messaging', 'email', 'storage', 'automation'],
  id: CFG.id, name: CFG.name, company: CFG.company, fy: CFG.fy || 'FY 2026-27',
  tagline: CFG.tagline, about: CFG.about,
  groups: [{ label: 'Winning work', items: ['dash', 'pipe'] },
           { label: 'Customers', items: ['cust', 'person', 'segs'] },
           { label: 'Wiring', items: ['wiring'] }],
  nav: [{ v: 'dash', label: 'Overview', icon: 'grid' }, { v: 'pipe', label: 'Pipeline', icon: 'flow' },
        { v: 'cust', label: 'Customers', icon: 'users' }, { v: 'person', label: 'Customer 360', icon: 'doc' },
        { v: 'segs', label: 'Segments & offers', icon: 'spark' }, { v: 'wiring', label: 'Wiring', icon: 'flow' }],
  seed: function (DB) { M02.seed(DB, CFG); },
  views: { dash: V.dash, pipe: V.pipe, cust: V.cust, person: V.person, segs: V.segs, wiring: V.wiring },
  actions: OWN,

  tests: function (t, DB) {
    /* ── every button this app declares is a button one of its screens renders ── */
    t('every button this app offers is really on one of its own screens',
      M02V.unreachable(SPEC, DB, OWN).length === 0, M02V.unreachable(SPEC, DB, OWN).join(', '));

    /* ── the pipeline ── */
    t('open, won and lost together are every lead',
      M02.openLeads(DB).length + M02.wonLeads(DB).length + M02.lostLeads(DB).length === DB.leads.length);
    t('open pipeline is the open deals added up',
      M02.pipelineValue(DB) === Math.round(M02.openLeads(DB).reduce(function (s, l) { return s + l.value; }, 0) * 100) / 100);
    t('the weighted pipeline is always smaller than the raw one',
      M02.weightedPipeline(DB) < M02.pipelineValue(DB) && M02.weightedPipeline(DB) > 0);
    t('each stage weights by its own odds',
      M02.byStage(DB).every(function (s) { return s.weighted === Math.round(s.value * s.prob) / 100 || s.n === 0 || Math.abs(s.weighted - s.value * s.prob / 100) < 0.01; }));
    t('win rate counts only settled deals, never the open ones',
      M02.winRate(DB) === Math.round(M02.wonLeads(DB).length / (M02.wonLeads(DB).length + M02.lostLeads(DB).length) * 100));
    t('every lost deal carries a reason', M02.lostLeads(DB).every(function (l) { return !!l.reason; }));
    t('the lost-reason totals add back up to the lost value',
      Math.round(M02.lostReasons(DB).reduce(function (s, r) { return s + r.value; }, 0) * 100) ===
      Math.round(M02.lostLeads(DB).reduce(function (s, l) { return s + l.value; }, 0) * 100));

    /* ── the duplicate-party gate ── */
    var before = DB.parties.length;
    var known = M02.openLeads(DB).filter(function (l) { return M02.findParty(DB, l.co); })[0];
    t('there is an open deal with an organisation already on the books', !!known);
    var res = M02.winLead(DB, known.id, CFG);
    t('winning it attaches to the record we already had', res.ok === true && res.reused === true);
    t('and does NOT create a second party', DB.parties.length === before);
    t('winning the same deal twice is refused', M02.winLead(DB, known.id, CFG).refused === true);
    var stranger = M02.openLeads(DB).filter(function (l) { return !M02.findParty(DB, l.co); })[0];
    var res2 = M02.winLead(DB, stranger.id, CFG);
    t('winning a genuinely new organisation does open a record', res2.ok === true && res2.reused === false);
    t('and the party count goes up by exactly one', DB.parties.length === before + 1);
    t('the won lead now points at the party it became',
      DB.leads.filter(function (l) { return l.id === stranger.id; })[0].party === res2.party);

    /* ── customer worth ── */
    var p = M02.profile(DB, DB.parties.filter(function (x) { return x.id === 'P1'; })[0]);
    t('customer worth is orders minus returns',
      p.value === Math.round((p.gross - p.returns) * 100) / 100);
    t('average order value is worth divided by orders', p.aov === Math.round(p.value / p.orders * 100) / 100);
    t('return % is returns over gross', p.rr === Math.round(p.returns / p.gross * 100));
    t('everybody added together is the total worth',
      Math.round(M02.profiles(DB).reduce(function (s, x) { return s + x.value; }, 0) * 100) / 100 === M02.totalValue(DB));
    t('the channel mix for one party adds back up to their worth',
      Math.round(M02.channelMix(DB, 'P1').reduce(function (s, c) { return s + c.kept; }, 0) * 100) / 100 === p.value);

    /* ── segments ── */
    t('every party lands in exactly one group',
      M02.profiles(DB).every(function (x) { return M02.SEGMENTS.indexOf(M02.segmentOf(x)) >= 0; }));
    t('the group counts add up to every party',
      M02.segCounts(DB).reduce(function (s, g) { return s + g.n; }, 0) === DB.parties.length);
    t('a party who has never ordered is New',
      M02.profiles(DB).filter(function (x) { return x.orders === 0; }).every(function (x) { return M02.segmentOf(x) === 'New'; }));
    t('a party quiet for over 180 days is Sleeping',
      M02.profiles(DB).filter(function (x) { return x.orders > 0 && x.lastAge > 180; }).every(function (x) { return M02.segmentOf(x) === 'Sleeping'; }));
    t('every group has an agreed action against it',
      M02.SEGMENTS.every(function (s) { return !!(CFG.offers || {})[s]; }));
    t('nobody is tagged by hand — no party record carries a group',
      DB.parties.every(function (x) { return x.segment === undefined && x.group === undefined; }));

    /* ── the spine: one record carries all three apps ── */
    t('a customer record shows the documents filed against them', M02.docsOfParty(DB, 'P1').length > 0);
    t('a customer record shows the questions they have asked', M02.ticketsOf(DB, 'P1').length > 0);
    var tl = M02.timeline(DB, 'P1');
    t('the timeline carries orders, documents, tickets and notes together',
      ['Order', 'Document', 'Ticket', 'Note'].every(function (k) { return tl.some(function (e) { return e.kind === k; }); }));
    t('the timeline is newest first', tl.every(function (e, i) { return i === 0 || tl[i - 1].at >= e.at; }));
    t('every order on that party appears on their timeline',
      M02.ordersOf(DB, 'P1').length === tl.filter(function (e) { return e.kind === 'Order'; }).length);

    /* ── what this app will not do ── */
    t('this app can do five things, and signing and answering are not among them',
      Object.keys(OWN).sort().join(',') === 'addnote,dismiss,setparty,setseg,win');
    t('none of them can sign a document or close a ticket',
      Object.keys(OWN).every(function (k) {
        return !/signDoc|closeTicket|sendDoc/.test(String(OWN[k])); }));
  }
};

if (typeof module !== 'undefined' && module.exports) module.exports = SPEC;
if (typeof Medhava !== 'undefined' && Medhava.app) Medhava.app(SPEC);

})();</script>
