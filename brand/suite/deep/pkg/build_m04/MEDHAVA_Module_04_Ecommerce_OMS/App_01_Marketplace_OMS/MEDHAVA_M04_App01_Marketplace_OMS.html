<style>/* Vanijo Suite — shared SmartHub-teal design system (system fonts). */
:root{
  --ink:#16302b;--ink2:#3c534e;--mut:#6f827d;
  --cream:#edf5f2;--cream2:#e0efe9;--paper:#fff;
  --gold:#0fae90;--gold-d:#0b8f76;--gold-soft:#d4f1e8;
  --emer:#12a06e;--emer-soft:#e0f3ea;
  --line:#dbe8e4;--line2:#c8ddd6;
  --grn:#12a06e;--red:#e5484d;--amb:#c26a2b;--peach-soft:#ffe7d3;
  --shadow:0 1px 2px rgba(16,42,36,.05),0 1px 3px rgba(16,42,36,.04);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--sans);font-weight:700;letter-spacing:-.01em;margin:0;color:var(--ink)}
.mono{font-family:var(--mono)}
.i{width:1em;height:1em;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.13em}
.app{display:grid;grid-template-columns:224px 1fr;grid-template-rows:54px 1fr;min-height:100vh}
.top{grid-column:1/3;background:#fff;color:var(--ink);display:flex;align-items:center;gap:10px;padding:0 16px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.top .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--ink)}
.top .logo .sm{width:26px;height:26px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.top .logo b{font-weight:800}.top .logo .ap{color:var(--mut);font-weight:600}
.tpill{background:#f3f4f6;border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:12px;color:var(--ink2)}
.tpill b{color:var(--ink)}.sp{flex:1}
.tavatar{width:30px;height:30px;border-radius:8px;background:var(--gold);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.hamb{display:none;background:none;border:none;color:var(--ink);cursor:pointer;padding:4px;margin:0 2px 0 -4px;align-items:center}
.side{background:#12312d;color:#a7c2bb;padding:8px 0;overflow-y:auto}
.side .gg{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#63837b;padding:13px 18px 5px;font-weight:600}
.side a{display:flex;align-items:center;gap:10px;padding:8px 18px;color:#b3cbc4;border-left:3px solid transparent;cursor:pointer;font-size:12.5px;font-weight:500}
.side a.on{background:#1c453e;color:#fff;border-left-color:#2dd4bf;font-weight:600}
.side a:hover{background:#183a34;color:#e6f2ee}
.side a .i{font-size:15px;opacity:.8}.side a.on .i{opacity:1;color:#2dd4bf}
.main{padding:18px 22px 40px;overflow-x:hidden;background:var(--cream)}
.navback{display:none}
.crumb{font-size:11px;color:var(--mut);margin-bottom:4px}
.h1row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:21px}.sub{font-size:12px;color:var(--mut);margin-top:3px}
.note{background:var(--gold-soft);border-bottom:1px solid #bfe6d9;color:var(--gold-d);font-size:11px;text-align:center;padding:6px;font-weight:600;border-radius:8px;margin-bottom:12px}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:6px;transition:.12s}
.btn:hover{background:#f7f8fa}
.btn.p{background:var(--gold);color:#fff;border-color:var(--gold)}.btn.p:hover{background:var(--gold-d)}
.btn.e{background:var(--emer);color:#fff;border-color:var(--emer)}
.btn.d{color:var(--red);border-color:#f2c9c9}.btn.d:hover{background:#fdeceb}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:active{transform:translateY(1px)}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel h3{font-size:13px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.badge{font-size:10.5px;font-weight:600;color:var(--gold-d);background:var(--gold-soft);border-radius:20px;padding:2px 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.kpis.k5{grid-template-columns:repeat(5,1fr)}.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px;box-shadow:var(--shadow)}
.kc .kchead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.kc .l{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kchip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 30px}
.kchip.c-teal{background:var(--gold-soft);color:var(--gold-d)}.kchip.c-green{background:var(--emer-soft);color:var(--emer)}
.kchip.c-blue{background:#dceafe;color:#2563eb}.kchip.c-peach{background:var(--peach-soft);color:var(--amb)}.kchip.c-red{background:#fde3e3;color:var(--red)}
.kc .v{font-size:20px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.kc .v.g{color:var(--grn)}.kc .v.r{color:var(--red)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:7px 9px;border-bottom:1px solid #eef0f3;text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:9.5px;text-transform:uppercase;color:var(--mut);letter-spacing:.04em;font-weight:600;background:#f1f7f5}
td.l,th.l{text-align:left}td.c,th.c{text-align:center}
tbody tr:hover{background:#f5faf8}
.g{color:var(--grn);font-weight:600}.r{color:var(--red);font-weight:600}
.tag{font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.02em;display:inline-block}
.t-grn{background:#d6f3e7;color:#0d8f66}.t-amb{background:#ffe7d3;color:#c2632b}.t-red{background:#fde3e3;color:#d83b40}.t-blu{background:#dceafe;color:#2563eb}.t-gray{background:#eef1f0;color:#6f827d}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form.f2{grid-template-columns:1fr 1fr}
.fld{display:flex;flex-direction:column;gap:4px}.fld.wide{grid-column:span 2}.fld.full{grid-column:1/-1}
.fld.end{justify-content:flex-end}
label{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600}
input,select,textarea{border:1px solid var(--line2);border-radius:7px;padding:8px 10px;font-size:12.5px;font-family:var(--sans);background:#fff;color:var(--ink)}
textarea{font-family:var(--mono);min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.cascade{background:#e6f5ef;border:1px solid #c2e7d8;border-radius:10px;padding:12px 14px;margin-top:12px;font-size:12px;color:var(--ink2)}
.cascade b{color:var(--ink)}.cascade .cl{display:flex;gap:8px;margin:6px 0;align-items:flex-start}
.cascade .d{width:18px;height:18px;border-radius:5px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;background:var(--emer)}
.hint{font-size:11px;color:var(--mut);margin-top:8px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:7px 0;border-bottom:1px solid #eef0f3}
.kv span{color:var(--mut)}.kv b{color:var(--ink);text-align:right}
.bar{height:8px;border-radius:6px;background:#e6efec;overflow:hidden}.bar>i{display:block;height:100%;background:var(--gold);border-radius:6px}
.pill{font-size:10.5px;padding:3px 9px;border-radius:6px;background:#eef1f5;color:var(--ink2);margin-right:5px}
.empty{color:var(--mut);font-size:12.5px;padding:8px 2px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#12312d;color:#fff;padding:10px 18px;border-radius:10px;font-size:12.5px;opacity:0;transition:opacity .2s;z-index:50;box-shadow:0 10px 30px rgba(16,42,36,.28)}
.toast.show{opacity:1}
@media print{.top,.side,.hamb,.h1row .btn,.btn{display:none!important}.app{display:block}.main{padding:0}}
@media(max-width:820px){
  .app{grid-template-columns:1fr}.hamb{display:inline-flex}
  .side{position:fixed;top:54px;left:0;bottom:0;width:250px;transform:translateX(-100%);transition:transform .22s;z-index:45;box-shadow:0 14px 44px rgba(16,42,36,.32)}
  .app.navopen .side{transform:none}
  .navback{position:fixed;inset:54px 0 0 0;background:rgba(16,42,36,.42);z-index:44}.app.navopen .navback{display:block}
  .kpis,.kpis.k5,.kpis.k3{grid-template-columns:1fr 1fr}.form,.form.f2,.two,.three{grid-template-columns:1fr}
}
</style></head><body>

<script>/* Medhava — Connectors: the no-lock-in layer, shared by every app in every module.

   THE RULE THIS ENFORCES
   No Medhava app may depend on one outside service. Every capability an app needs
   (books, channels, AI text, AI images, video, automation, courier, payments,
   messaging, storage, GST, printing, scanning) is declared as a CAPABILITY with a
   list of interchangeable PROVIDERS. You pick one; you can change it any time.

   Three guarantees, each checked by a self-test at every launch:
     1. Every capability has several alternatives — never one.
     2. Every capability has a BUILT-IN or MANUAL option, so the app works with
        nothing connected at all.
     3. Every capability has an option you can HOST YOURSELF, so you are never
        forced to send your data to somebody else's cloud.

   kind: 'built-in'  ships inside Medhava, needs nothing
         'self-host' you run it on your own machine or server
         'cloud'     somebody else's service, via a revocable scoped API key
         'manual'    a human does it, or a CSV goes in and out
*/

  var P = function (id, name, kind, note) { return { id: id, name: name, kind: kind, note: note || '' }; };

  var CAPS = [

      P('medhava_books', 'Medhava Books', 'built-in', 'The ledger inside Medhava. Nothing else needed.'),

    { id: 'channels', name: 'Sales channels', what: 'Where orders and returns come from.', providers: [

      P('csv_orders', 'CSV import', 'manual', 'Download from any panel, drop the file in.'),
      P('amazon', 'Amazon', 'cloud', 'SP-API, scoped key.'),
      P('flipkart', 'Flipkart', 'cloud', 'Seller API, scoped key.'),
      P('myntra', 'Myntra', 'cloud', 'Partner API, scoped key.'),

      P('nykaa', 'Nykaa', 'cloud', ''), P('jiomart', 'JioMart', 'cloud', ''),
      P('shopify', 'Shopify', 'cloud', ''), P('woocommerce', 'WooCommerce', 'self-host', 'Your own WordPress store.'),
      P('medusa', 'Medusa / self-hosted store', 'self-host', 'Your own storefront, your own server.') ] },

    { id: 'ai_text', name: 'AI writing', what: 'Titles, descriptions, replies, summaries.', providers: [

    { id: 'ai_image', name: 'AI images', what: 'Product shots, banners, catalogue images.', providers: [

    { id: 'ai_video', name: 'Video', what: 'Reels, product videos, ads.', providers: [

  ];

  var byId = {}; CAPS.forEach(function (c) { byId[c.id] = c; });
  function cap(id) { return byId[id]; }
  function prov(capId, pid) { var c = cap(capId); if (!c) return null;
    var m = c.providers.filter(function (p) { return p.id === pid; }); return m[0] || null; }
  /* the default is always something that needs nothing outside Medhava */
  function defaultOf(capId) { var c = cap(capId);
    var b = c.providers.filter(function (p) { return p.kind === 'built-in'; })[0];
    return (b || c.providers.filter(function (p) { return p.kind === 'manual'; })[0] || c.providers[0]).id; }

  function seed(DB, uses) { DB.prov = DB.prov || {};
    (uses || []).forEach(function (id) { if (cap(id) && !DB.prov[id]) DB.prov[id] = defaultOf(id); }); }
  function active(DB, capId) { return (DB.prov || {})[capId] || defaultOf(capId); }

  var KIND = { 'built-in': ['grn', 'built in'], 'self-host': ['blu', 'you host it'],
               'cloud': ['amb', 'their cloud'], 'manual': ['gray', 'by hand'] };

  function view(H, DB, uses) {
    uses = (uses || []).filter(function (id) { return !!cap(id); });
    var alts = uses.reduce(function (s, id) { return s + cap(id).providers.length; }, 0);
    var noNet = uses.filter(function (id) { var k = prov(id, active(DB, id)); return k && (k.kind === 'built-in' || k.kind === 'manual'); }).length;

    return H.head('Connectors · Alternatives', 'Connectors',
      'Everything this app touches, and every alternative you can use for it. Nothing is locked to one company.') +
      H.note('<b>The promise, in one line:</b> no Medhava app depends on any single outside service. ' +
        'Every capability below has a built-in or by-hand option, and at least one option you can run on your own machine.') +
      H.kpis([
        { l: 'Capabilities used', v: uses.length, d: 'by this app', icon: 'layers', tone: 'teal' },
        { l: 'Alternatives available', v: alts, d: 'to choose from', icon: 'sync', tone: 'blue' },
        { l: 'Outside services required', v: 0, d: 'none, ever', cls: 'g', icon: 'check', tone: 'green' },
        { l: 'Running with nothing connected', v: noNet + ' / ' + uses.length, d: 'right now', cls: noNet === uses.length ? 'g' : '', icon: 'shield', tone: 'peach' }
      ], '') +
      H.panel('At a glance', H.table([
        { label: 'Capability', align: 'l', fmt: function (r) { return '<b>' + H.esc(r.name) + '</b><div class="hint">' + H.esc(r.what) + '</div>'; } },
        { label: 'You are using', align: 'l', fmt: function (r) { var p = prov(r.id, active(DB, r.id));
          return H.esc(p.name) + ' ' + H.tag(KIND[p.kind][1], KIND[p.kind][0]); } },
        { label: 'Alternatives', fmt: function (r) { return cap(r.id).providers.length; }, cellcls: 'mono' },
        { label: 'Works with nothing connected', align: 'l', fmt: function (r) {
          return cap(r.id).providers.some(function (p) { return p.kind === 'built-in' || p.kind === 'manual'; })
            ? H.tag('yes', 'grn') : H.tag('no', 'red'); } },
        { label: 'Can you host it yourself', align: 'l', fmt: function (r) {
          return cap(r.id).providers.some(function (p) { return p.kind === 'self-host' || p.kind === 'built-in'; })
            ? H.tag('yes', 'grn') : H.tag('no', 'red'); } }
      ], uses.map(function (id) { return cap(id); }))) +
      uses.map(function (id) {
        var c = cap(id), a = active(DB, id);
        return H.panel(H.esc(c.name) + ' <span class="badge">' + c.providers.length + ' choices</span>',
          '<p class="hint">' + H.esc(c.what) + ' Click any one to switch. Your figures do not change — only where the data comes from.</p>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          c.providers.map(function (p) {
            return '<button class="btn sm' + (p.id === a ? ' p' : '') + '" data-act="connpick" data-c="' + id + '" data-p="' + p.id + '">' +
              H.esc(p.name) + '</button>';
          }).join('') + '</div>' +
          H.table([
            { label: 'Option', align: 'l', fmt: function (p) { return (p.id === a ? '<b>' + H.esc(p.name) + '</b>' : H.esc(p.name)); } },
            { label: 'Kind', align: 'l', fmt: function (p) { return H.tag(KIND[p.kind][1], KIND[p.kind][0]); } },
            { label: 'Note', align: 'l', fmt: function (p) { return H.esc(p.note || '—'); } },
            { label: '', align: 'l', fmt: function (p) { return p.id === a ? H.tag('in use', 'grn') : ''; } }
          ], c.providers));
      }).join('') +
      H.panel('Two things worth knowing',
        '<p><b>Switching a provider never changes a figure.</b> The arithmetic lives in Medhava, not in the service. ' +
        'Move from one courier to another and your shipping records stay exactly as they were — only new labels come from somewhere else.</p>' +
        '<p><b>Cloud services are connected with a scoped, revocable key — never your account password.</b> ' +
        'A key can be limited to just what it needs and cancelled in one click, from their side, without changing your login. ' +
        'Medhava will never ask you for a marketplace or bank password.</p>');
  }

  function actions(K) {
    return {
      connpick: function (b) { var DB = K.DB, c = b.getAttribute('data-c'), p = b.getAttribute('data-p');
        if (!prov(c, p)) return; DB.prov = DB.prov || {}; DB.prov[c] = p;
        K.save(); K.toast('Switched to ' + prov(c, p).name); K.render(); }
    };
  }

  function tests(t, DB, uses) {
    uses = (uses || []).filter(function (id) { return true; });
    t('every capability this app uses is a known one', uses.every(function (id) { return !!cap(id); }));
    t('no capability offers only one choice', uses.every(function (id) { return cap(id).providers.length >= 3; }));
    t('every capability works with nothing connected (built-in or by hand)', uses.every(function (id) {
      return cap(id).providers.some(function (p) { return p.kind === 'built-in' || p.kind === 'manual'; }); }));
    t('every capability has an option you can host yourself', uses.every(function (id) {
      return cap(id).providers.some(function (p) { return p.kind === 'self-host' || p.kind === 'built-in'; }); }));
    t('exactly one provider is active per capability', uses.every(function (id) {
      return !!prov(id, active(DB, id)); }));
    t('the default provider never needs an outside service', uses.every(function (id) {
      var p = prov(id, defaultOf(id)); return p.kind === 'built-in' || p.kind === 'manual'; }));
    t('no single company is unavoidable across capabilities', (function () {
      if (uses.length < 2) return true;
      var counts = {};
      uses.forEach(function (id) { cap(id).providers.forEach(function (p) { counts[p.name] = (counts[p.name] || 0) + 1; }); });
      /* a company appearing in every capability would be a hidden dependency */
      return !Object.keys(counts).some(function (n) { return counts[n] >= uses.length && uses.length > 1; });
    })());
    if (uses.length) {
      var id = uses[0], c = cap(id), was = active(DB, id);
      var other = c.providers.filter(function (p) { return p.id !== was; })[0];
      var before = JSON.stringify(Object.keys(DB).filter(function (k) { return k !== 'prov'; }).sort()
        .map(function (k) { return [k, DB[k]]; }));
      DB.prov[id] = other.id;
      t('switching a provider changes which one is active', active(DB, id) === other.id);
      t('switching a provider changes nothing else in your data',
        JSON.stringify(Object.keys(DB).filter(function (k) { return k !== 'prov'; }).sort()
          .map(function (k) { return [k, DB[k]]; })) === before);
      DB.prov[id] = was;
    }
  }

  var API = { CAPS: CAPS, cap: cap, prov: prov, defaultOf: defaultOf, seed: seed, active: active,
              view: view, actions: actions, tests: tests };
  if (typeof window !== 'undefined') window.MedhavaProviders = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})();

<script>/* Medhava Suite kernel — shared UI runtime + components + store + self-tests.
   An app is a spec: { id,name,company,fy, groups?, nav[], seed(DB), views{}, actions{}, tests(t,DB) }. */
(function(){
  var r2=function(n){return Math.round((Number(n)+Number.EPSILON)*100)/100;};
  var num=function(n){return (n==null||n===''||isNaN(n))?0:Number(n);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var money=function(n){n=r2(n);return (n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});};
  var inr=function(n){return Number(r2(n)).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});};
  var $=function(id){return document.getElementById(id);};

  var SPEC=null, state={view:null}, DB={}, KEY='';
  function toast(m){var t=$('toast');if(!t)return;t.textContent=m;t.className='toast show';clearTimeout(t._t);t._t=setTimeout(function(){t.className='toast';},2000);}
  function setStatus(s){var p=$('statusPill');if(p)p.textContent=s;}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));setStatus('saved ✓');}catch(e){setStatus('session only');}}
  function clearDB(){Object.keys(DB).forEach(function(k){delete DB[k];});}

  var H={
    esc:esc, money:money, inr:inr, r2:r2, num:num, toast:toast, val:function(id){var e=$(id);return e?e.value:'';}, numv:function(id){return num(H.val(id));},
    head:function(crumb,h1,sub,actions){return '<div class="crumb">'+esc(crumb)+'</div><div class="h1row"><div><h1>'+esc(h1)+'</h1><div class="sub">'+esc(sub||'')+'</div></div><div>'+(actions||'')+'</div></div>';},
    note:function(t){return '<div class="note">'+t+'</div>';},
    kpis:function(arr,cls){return '<div class="kpis '+(cls||'')+'">'+arr.map(function(k){
      var chip=k.icon?'<div class="kchip c-'+(k.tone||'teal')+'"><svg class="i"><use href="#s-'+k.icon+'"/></svg></div>':'';
      return '<div class="kc"><div class="kchead"><div class="l">'+esc(k.l)+'</div>'+chip+'</div><div class="v '+(k.cls||'')+'">'+k.v+'</div><div class="l" style="margin-top:4px;text-transform:none">'+esc(k.d||'')+'</div></div>';}).join('')+'</div>';},
    /* title is trusted markup (may contain badges/tags); callers must esc() any dynamic data placed in it. */
    panel:function(title,body,actions){return '<div class="panel"><h3>'+title+(actions?'<span>'+actions+'</span>':'')+'</h3>'+body+'</div>';},
    table:function(cols,rows){
      var th=cols.map(function(c){return '<th class="'+(c.align||'')+'">'+esc(c.label||'')+'</th>';}).join('');
      var body=rows.length?rows.map(function(row){return '<tr>'+cols.map(function(c){
        var v=c.fmt?c.fmt(row):row[c.k]; var cls=(c.align||'')+(c.cellcls?' '+(typeof c.cellcls==='function'?c.cellcls(row):c.cellcls):'');
        return '<td class="'+cls+'">'+(v==null?'':v)+'</td>';}).join('')+'</tr>';}).join('')
        :'<tr><td class="l" colspan="'+cols.length+'"><div class="empty">No rows yet.</div></td></tr>';
      return '<table><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table>';
    },
    tag:function(text,tone){return '<span class="tag t-'+(tone||'gray')+'">'+esc(text)+'</span>';},
    bar:function(pct){pct=Math.max(0,Math.min(100,pct));return '<div class="bar"><i style="width:'+pct+'%"></i></div>';},
    fields:function(fields){return fields.map(function(f){
      if(f.type==='select'){var opts=(f.options||[]).map(function(o){var v=typeof o==='object'?o.v:o,l=typeof o==='object'?o.label:o;return '<option value="'+esc(v)+'"'+(f.value==v?' selected':'')+'>'+esc(l)+'</option>';}).join('');
        return '<div class="fld'+(f.wide?' wide':'')+(f.full?' full':'')+'"><label>'+esc(f.label)+'</label><select id="'+f.id+'">'+opts+'</select></div>';}
      if(f.type==='textarea') return '<div class="fld full"><label>'+esc(f.label)+'</label><textarea id="'+f.id+'">'+esc(f.value||'')+'</textarea></div>';
      return '<div class="fld'+(f.wide?' wide':'')+(f.full?' full':'')+'"><label>'+esc(f.label)+'</label><input id="'+f.id+'" type="'+(f.type==='num'?'number':(f.type||'text'))+'" value="'+esc(f.value==null?'':f.value)+'" '+(f.type==='num'?'step="0.01"':'')+' placeholder="'+esc(f.ph||'')+'"></div>';
    }).join('');},
    form:function(fields,submitLabel,act,cls){return '<div class="form '+(cls||'f2')+'">'+H.fields(fields)+'<div class="fld full" style="align-items:flex-end"><button class="btn p" data-act="'+act+'">'+esc(submitLabel)+'</button></div></div>';},
    go:function(v){go(v);}, save:function(){save();}, render:function(){render();}
  };

  function buildShell(){
    var groups=SPEC.groups||[{label:SPEC.name,items:SPEC.nav.map(function(n){return n.v;})}];
    var navMap={}; SPEC.nav.forEach(function(n){navMap[n.v]=n;});
    var nav=groups.map(function(g){return '<div class="gg">'+esc(g.label)+'</div>'+g.items.map(function(v){var n=navMap[v];return n?'<a data-v="'+v+'"><svg class="i"><use href="#s-'+(n.icon||'grid')+'"/></svg> '+esc(n.label)+'</a>':'';}).join('');}).join('');
    $('root').innerHTML='<div class="app" id="appRoot"><div class="top">'+
      '<button class="hamb" id="hamb"><svg class="i" style="width:22px;height:22px;stroke-width:2"><use href="#s-menu"/></svg></button>'+
      '<div class="logo"><span class="sm"><svg width="19" height="19" viewBox="0 0 40 40"><path d="M9 31V15l11 11 11-11v16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 5c.25 3.1.8 3.8 3.9 4.05-3.1.25-3.65.95-3.9 4.05-.25-3.1-.8-3.8-3.9-4.05C19.2 8.8 19.75 8.1 20 5z" fill="#fff"/></svg></span> <b>Medhava</b> <span class="ap">'+esc(SPEC.name)+'</span></div>'+
      '<div class="tpill">'+esc(SPEC.company||'Vastrangam')+'</div><div class="tpill">'+esc(SPEC.fy||'FY 2026-27')+'</div>'+
      '<span class="sp"></span><div class="tpill" id="statusPill">saved ✓</div><div class="tavatar">P</div></div>'+
      '<nav class="side" id="nav">'+nav+'</nav><main class="main" id="main"></main><div class="navback" id="navback"></div></div>';
    var root=$('appRoot');
    $('nav').addEventListener('click',function(e){var a=e.target.closest('a[data-v]');if(a)go(a.getAttribute('data-v'));});
    $('hamb').onclick=function(){root.classList.toggle('navopen');};
    $('navback').onclick=function(){root.classList.remove('navopen');};
    $('main').addEventListener('click',function(e){
      var g=e.target.closest('[data-go]'); if(g){go(g.getAttribute('data-go'));return;}
      var b=e.target.closest('[data-act]'); if(b){var fn=SPEC.actions[b.getAttribute('data-act')]; if(fn)fn(b); }
    });
  }
  function go(v){ if(v!=='backup'&&!(SPEC.views&&SPEC.views[v]))v=SPEC.nav[0].v; state.view=v; var r=$('appRoot'); if(r)r.classList.remove('navopen');
    [].forEach.call(document.querySelectorAll('#nav a[data-v]'),function(a){a.className=a.getAttribute('data-v')===v?'on':'';});
    render(); window.scrollTo(0,0);
  }
  function render(){ var v=state.view; $('main').innerHTML = v==='backup'?backupView():(SPEC.views[v]||SPEC.views[SPEC.nav[0].v])(); }

  function backupView(){
    var t=window.__selftest||{pass:0,fail:0,log:[]};
    var rows=t.log.map(function(l){return {s:l.ok?'<span class="tag t-grn">pass</span>':'<span class="tag t-red">fail</span>',n:esc(l.name)};});
    return H.head('System · Backup','Backup & Health','Your data lives in this browser. Export a JSON backup any time.')+
      H.panel('Data','<div style="display:flex;gap:9px;flex-wrap:wrap">'+
        '<button class="btn p" data-act="_export"><svg class="i"><use href="#s-save"/></svg> Export JSON</button>'+
        '<button class="btn" data-act="_import"><svg class="i"><use href="#s-sync"/></svg> Import JSON</button>'+
        '<button class="btn" data-act="_reseed">Reload demo data</button>'+
        '<button class="btn d" data-act="_wipe">Wipe all</button></div>')+
      H.panel('Self-tests <span class="badge">'+t.pass+'/'+(t.pass+t.fail)+' pass</span>',
        rows.length?H.table([{label:'',align:'l',k:'s'},{label:'Check',align:'l',k:'n'}],rows):'<div class="empty">No self-tests defined.</div>');
  }
  function download(name,text){var b=new Blob([text],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
  function pickFile(cb){var inp=$('fileIn');inp.value='';inp.onchange=function(){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){cb(rd.result);};rd.readAsText(f);};inp.click();}
  var builtins={
    _export:function(){download((SPEC.id||'medhava')+'-backup.json',JSON.stringify(DB,null,2));toast('Backup exported');},
    _import:function(){pickFile(function(txt){try{var o=JSON.parse(txt);clearDB();Object.assign(DB,o);save();toast('Imported ✓');go(SPEC.nav[0].v);}catch(e){toast('Bad file');}});},
    _reseed:function(){if(confirm('Reload demo data? This replaces current data.')){clearDB();SPEC.seed(DB);save();toast('Demo reloaded');go(SPEC.nav[0].v);}},
    _wipe:function(){if(confirm('Wipe ALL data?')){clearDB();save();toast('Wiped');go(SPEC.nav[0].v);}}
  };
  function runTests(){var log=[],pass=0,fail=0;function t(name,cond){var ok=!!cond;log.push({name:name,ok:ok});ok?pass++:fail++;}
    /* tests run against a deep COPY — a self-test must never mutate live data */
    var probe; try{probe=JSON.parse(JSON.stringify(DB));}catch(e){probe=DB;}
    try{if(SPEC.tests)SPEC.tests(t,probe);}catch(e){log.push({name:'tests threw: '+e.message,ok:false});fail++;}
    /* the no-lock-in guarantees are checked in every app, not just the ones that remember to */
    var PR=window.MedhavaProviders;
    if(PR&&SPEC.uses){try{PR.tests(t,probe,SPEC.uses);}catch(e){log.push({name:'connector tests threw: '+e.message,ok:false});fail++;}}
    window.__selftest={pass:pass,fail:fail,log:log};}

  /* Any spec that declares `uses:[capability,...]` automatically gets a Connectors screen,
     its provider defaults seeded, its switch action, and the three no-lock-in self-tests.
     Nothing per-app to remember, so no app can quietly become dependent on one service. */
  function wireProviders(spec){
    var PR=window.MedhavaProviders; if(!PR||!spec.uses||!spec.uses.length) return;
    var seed0=spec.seed;
    spec.seed=function(D){ seed0(D); PR.seed(D,spec.uses); };
    spec.views=spec.views||{};
    spec.views.connect=function(){ return PR.view(H,DB,spec.uses); };
    Object.assign(spec.actions,PR.actions(Medhava));
    if(!spec.nav.some(function(n){return n.v==='connect';}))
      spec.nav.push({v:'connect',label:'Connectors',icon:'plug'});
    if(spec.groups&&!spec.groups.some(function(g){return g.items.indexOf('connect')>=0;}))
      spec.groups.push({label:'Connectors',items:['connect']});
  }
  function boot(){
    KEY='medhava_'+(SPEC.id||'app')+'_v1'; var raw=null; try{raw=localStorage.getItem(KEY);}catch(e){}
    if(raw){try{var o=JSON.parse(raw);Object.assign(DB,o);}catch(e){}}
    if(!Object.keys(DB).length) SPEC.seed(DB);
    if(!SPEC.nav.some(function(n){return n.v==='backup';})) SPEC.nav.push({v:'backup',label:'Backup & Health',icon:'save'});
    if(SPEC.groups&&!SPEC.groups.some(function(g){return g.items.indexOf('backup')>=0;})) SPEC.groups.push({label:'System',items:['backup']});
    Medhava.DB=DB; runTests(); buildShell(); go(SPEC.nav[0].v); save();
  }
  window.Medhava={ H:H, esc:esc, money:money, inr:inr, r2:r2, num:num, toast:toast, DB:DB, save:save, go:go, render:render,
    app:function(spec){ SPEC=spec; spec.actions=Object.assign({},builtins,spec.actions||{}); Medhava.SPEC=spec;
      wireProviders(spec);
      if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot(); } };
})();
</script>
<script>(function(){

var CONFIG={

    {id:'MP-4113',cust:'Pooja Menon',market:'MPG',sku:'FG-101',name:'Standard product',qty:1,rate:1799,age:26,status:'packed'},
    {id:'MP-4114',cust:'Harsh Agarwal',market:'MPC',sku:'FG-104',name:'Top-of-range product',qty:1,rate:12999,age:22,status:'delivered'},
    {id:'MP-4115',cust:'Lata Kulkarni',market:'MPB',sku:'FG-101',name:'Standard product',qty:2,rate:1799,age:20,status:'delivered'},
    {id:'MP-4116',cust:'Faiz Ahmed',market:'MPD',sku:'FG-101',name:'Standard product',qty:1,rate:1799,age:44,status:'delivered'}],
  commNote:'Gross is the marketplace’s number. Payout is yours. The gap between them is not a rounding error — on a 24% channel with a shipping fee it is roughly a quarter of the invoice, and it is the single figure most sellers never put on one screen.',
  queueNote:'Seven panels means seven logins, seven dispatch clocks and seven stock figures that drift apart by the afternoon. One queue means one login, one clock per order, and one stock number that every channel reads. Nothing here is a new way of selling — it is the same orders, arranged so the urgent one is always at the top.',
  plNote:'A marketplace is not judged on how much it sells. It is judged on what reaches your bank after its commission, its shipping fee and its returns. Sorted by payout, the ranking on this screen is almost never the same as the ranking by gross.',
  parityNote:'Marketplaces read each other’s prices. The same item listed materially cheaper on one panel gets the dearer listings suppressed, and you lose the channel you were protecting. Level the price and both listings survive.',
  wiring:[
    {f:'Gross ordered',s:'This app (it owns the marketplace order)',h:'Every live order: quantity × rate'},
    {f:'Commission',s:'Marketplace rate card in this app',h:'That marketplace’s percentage of the order’s gross'},
    {f:'Shipping fee',s:'Marketplace rate card in this app',h:'A flat per-order fee, set per marketplace'},
    {f:'What reaches you',s:'This app',h:'Gross − commission − shipping fee, worked out per order and never stored'},
    {f:'Time left to dispatch',s:'This app',h:'That marketplace’s dispatch window minus the order’s age in hours'},
    {f:'Past the window',s:'This app',h:'An order still to dispatch whose time left has gone below zero'},
    {f:'Stock',s:'Inventory (one shared number)',h:'Falls on sale; comes back on a cancellation or a return'},
    {f:'Price on each panel',s:'Catalog + per-panel override',h:'List price unless a panel override exists; the spread is highest minus lowest'},
    {f:'Returns',s:'This app + Logistics',h:'Recorded against the marketplace the order came from, at that marketplace’s rate'},
    {f:'Settlement',s:'Settlement module',h:'This app says what the payout should be; Settlement checks what actually arrived'},

  wiringIn:[
    {from:'Catalog',what:'The item, its list price and which panels it is listed on'},
    {from:'Inventory',what:'The one stock number every panel reads'},
    {from:'Logistics',what:'The courier, the tracking number and whether it was delivered'},
    {from:'Settlement',what:'What the marketplace actually paid, to check against the expected payout'},
    {from:'Accounting',what:'Where the sale, the commission and the fee land in the books'}]
};

/* Medhava — Marketplace OMS (Module 04 · App 1)
   Seven seller panels, one queue. Every marketplace order in one place, with its dispatch
   clock running, and the commission worked out so you can see what each channel ACTUALLY
   pays you rather than what it invoices.
   CONFIG supplies names so the Medhava and Vastrangam builds run the SAME math. */
var K=typeof Medhava!=='undefined'?Medhava:{}; var H=K.H,money=K.money,inr=K.inr,num=K.num,r2=K.r2,esc=K.esc,toast=K.toast;
var CFG=(typeof CONFIG!=='undefined')?CONFIG:{};
function db(){return K.DB;}
function plural(n,one,many){return n+' '+(n===1?one:(many||one+'s'));}

var STAGES=[{k:'new',l:'To accept'},{k:'accepted',l:'Accepted'},{k:'packed',l:'Packed'},
            {k:'dispatched',l:'Dispatched'},{k:'delivered',l:'Delivered'}];
function stIdx(k){for(var i=0;i<STAGES.length;i++)if(STAGES[i].k===k)return i;return -1;}
function stLbl(k){var s=STAGES.filter(function(x){return x.k===k;})[0];
  return s?s.l:(k==='returned'?'Returned':'Cancelled');}

function mp(code){return (CFG.markets||[]).filter(function(m){return m.code===code;})[0]||null;}
function item(sku){return (CFG.items||[]).filter(function(x){return x.sku===sku;})[0]||null;}

/* ── what one order is really worth ──
   Gross is what the marketplace shows you. Net payout is what reaches your bank. */
function gross(o){return r2(num(o.qty)*num(o.rate));}
function commission(DB,o){var m=mp(o.market);return m?r2(gross(o)*num(m.comm)/100):0;}
function shipFee(DB,o){var m=mp(o.market);return m?num(m.ship):0;}
function payout(DB,o){return r2(gross(o)-commission(DB,o)-shipFee(DB,o));}
function commPct(DB,o){var g=gross(o);return g?Math.round((gross(o)-payout(DB,o))/g*100):0;}

function orders(DB){return DB.orders||[];}
function live(DB){return orders(DB).filter(function(o){return o.status!=='cancelled'&&o.status!=='returned';});}
function returned(DB){return orders(DB).filter(function(o){return o.status==='returned';});}
function cancelled(DB){return orders(DB).filter(function(o){return o.status==='cancelled';});}
function grossAll(DB){return r2(live(DB).reduce(function(s,o){return s+gross(o);},0));}
function payoutAll(DB){return r2(live(DB).reduce(function(s,o){return s+payout(DB,o);},0));}
function feesAll(DB){return r2(grossAll(DB)-payoutAll(DB));}
function returnedValue(DB){return r2(returned(DB).reduce(function(s,o){return s+gross(o);},0));}

/* ── the dispatch clock. Every marketplace gives you a different number of hours. ── */
function slaOf(o){var m=mp(o.market);return m?num(m.sla):24;}
function hrsLeft(o){return slaOf(o)-num(o.age);}
function needsDispatch(o){return stIdx(o.status)>=0&&stIdx(o.status)<stIdx('dispatched');}
function breached(DB){return live(DB).filter(function(o){return needsDispatch(o)&&hrsLeft(o)<0;});}
function atRisk(DB){return live(DB).filter(function(o){return needsDispatch(o)&&hrsLeft(o)>=0&&hrsLeft(o)<=4;});}
function onTimePct(DB){var d=live(DB).filter(function(o){return !needsDispatch(o);});
  if(!d.length)return 100;
  return Math.round(d.filter(function(o){return num(o.age)<=slaOf(o);}).length/d.length*100);}

function queue(DB){return live(DB).filter(needsDispatch)
  .sort(function(a,b){return hrsLeft(a)-hrsLeft(b);});}

/* ── per marketplace: the comparison nobody makes ── */
function byMarket(DB){return (CFG.markets||[]).map(function(m){
  var os=orders(DB).filter(function(o){return o.market===m.code;});
  var lv=os.filter(function(o){return o.status!=='cancelled'&&o.status!=='returned';});
  var rt=os.filter(function(o){return o.status==='returned';});
  var g=r2(lv.reduce(function(s,o){return s+gross(o);},0));
  var p=r2(lv.reduce(function(s,o){return s+payout(DB,o);},0));
  var rg=r2(rt.reduce(function(s,o){return s+gross(o);},0));
  return {code:m.code,name:m.name,comm:num(m.comm),ship:num(m.ship),sla:num(m.sla),
    n:lv.length, ret:rt.length, gross:g, payout:p, fees:r2(g-p), retValue:rg,
    retPct:(lv.length+rt.length)?Math.round(rt.length/(lv.length+rt.length)*100):0,
    keepPct:g?Math.round(p/g*100):0,
    breached:lv.filter(function(o){return needsDispatch(o)&&hrsLeft(o)<0;}).length};})
  .sort(function(a,b){return b.payout-a.payout;});}

/* ── listing health: one price and one stock number, or trouble ── */
function listings(DB){return (CFG.items||[]).map(function(it){
  var rows=(CFG.markets||[]).map(function(m){
    var lp=((DB.prices||{})[it.sku]||{})[m.code];
    return {market:m.name,code:m.code,price:lp===undefined?num(it.rate):num(lp)};});
  var ps=rows.map(function(r){return r.price;});
  var lo=Math.min.apply(null,ps), hi=Math.max.apply(null,ps);
  return {sku:it.sku,name:it.name,list:num(it.rate),rows:rows,lo:lo,hi:hi,
    spread:r2(hi-lo), spreadPct:lo?Math.round((hi-lo)/lo*100):0,
    stock:num((DB.stock||{})[it.sku]),
    listedOn:rows.length};});}
function parityBroken(DB){return listings(DB).filter(function(l){return l.spreadPct>num(CFG.parityPct||5);});}
function oversellRisk(DB){return listings(DB).filter(function(l){return l.stock>0&&l.stock<(CFG.markets||[]).length;});}
function outOfStock(DB){return listings(DB).filter(function(l){return l.stock<=0;});}

function issues(DB){var out=[];
  breached(DB).forEach(function(o){out.push({sev:'high',
    what:o.id+' ('+(mp(o.market)||{}).name+') is '+(-hrsLeft(o))+'h past its dispatch window — this is what costs you the account',go:'queue'});});
  atRisk(DB).forEach(function(o){out.push({sev:'med',
    what:o.id+' ('+(mp(o.market)||{}).name+') has '+plural(hrsLeft(o),'hour')+' left to dispatch',go:'queue'});});
  parityBroken(DB).forEach(function(l){out.push({sev:'med',
    what:l.name+' is priced '+l.spreadPct+'% apart across marketplaces — '+money(l.lo)+' to '+money(l.hi),go:'listings'});});
  outOfStock(DB).forEach(function(l){out.push({sev:'high',
    what:l.name+' is out of stock but still listed on '+plural(l.listedOn,'marketplace')+' — every order taken now is a cancellation',go:'listings'});});
  byMarket(DB).filter(function(m){return m.retPct>=num(CFG.retAlertPct||12)&&m.n+m.ret>=3;}).forEach(function(m){
    out.push({sev:'med',what:m.name+' return rate is '+m.retPct+'% — above the '+(CFG.retAlertPct||12)+'% line',go:'markets'});});
  return out;}

/* Marketplace OMS reads orders from the channels, pushes stock back, moves money
   through the books, and needs a courier and a printer. All of it swappable. */
var SPEC={
  uses:['channels','courier','ledger','printing','storage','automation','messaging'],
  id:CFG.id, name:CFG.name, company:CFG.company, fy:CFG.fy||'FY 2026-27', tagline:CFG.tagline, about:CFG.about,
  groups:[{label:'One queue',items:['dash','queue']},
          {label:'Per marketplace',items:['markets','listings']},
          {label:'Wiring',items:['wiring']}],
  nav:[{v:'dash',label:'Overview',icon:'grid'},{v:'queue',label:'Dispatch queue',icon:'truck'},
       {v:'markets',label:'Marketplace P&L',icon:'scale'},{v:'listings',label:'Listing health',icon:'layers'},
       {v:'wiring',label:'Wiring',icon:'flow'}],
  seed:function(DB){
    DB.orders=JSON.parse(JSON.stringify(CFG.orders));
    DB.prices=JSON.parse(JSON.stringify(CFG.prices||{}));
    DB.stock={}; (CFG.items||[]).forEach(function(it){DB.stock[it.sku]=num(it.qty);});
    DB.seq=1000;
  },
  views:{
    dash:function(){var DB=db();var ms=byMarket(DB);
      var mx=Math.max.apply(null,ms.map(function(m){return m.payout;}).concat([1]));
      var iss=issues(DB);
      return H.head('One queue · Overview',CFG.name,'Every marketplace order in one place — and what each channel actually pays you after its cut.')+
      H.kpis([
        {l:'Gross ordered',v:money(grossAll(DB)),d:plural(live(DB).length,'live order'),icon:'cart',tone:'teal'},
        {l:'What reaches you',v:money(payoutAll(DB)),d:'after commission &amp; fees',cls:'g',icon:'coin',tone:'green'},
        {l:'Taken by the platforms',v:money(feesAll(DB)),d:grossAll(DB)?Math.round(feesAll(DB)/grossAll(DB)*100)+'% of gross':'—',cls:'r',icon:'pct',tone:'peach'},
        {l:'Past dispatch window',v:breached(DB).length,d:plural(atRisk(DB).length,'more')+' within 4h',cls:breached(DB).length?'r':'g',icon:'clock',tone:breached(DB).length?'red':'green'},
        {l:'Dispatched on time',v:onTimePct(DB)+'%',d:'of everything shipped',cls:onTimePct(DB)>=95?'g':'r',icon:'check',tone:'blue'}],'k5')+
      '<div class="two">'+
      H.panel('What each marketplace actually pays you',
        ms.map(function(m){return '<div style="margin-bottom:10px"><div class="kv" style="border:none;padding:2px 0"><span>'+
          esc(m.name)+' <span class="hint">'+m.comm+'% + '+money(m.ship)+'/order · keeps you '+m.keepPct+'%</span></span><b>'+money(m.payout)+'</b></div>'+
          H.bar(m.payout/mx*100)+'</div>';}).join('')+
        '<div class="kv" style="margin-top:10px"><span>Gross across every marketplace</span><b>'+money(grossAll(DB))+'</b></div>'+
        '<div class="kv"><span>− Commission and shipping fees</span><b class="r">'+money(feesAll(DB))+'</b></div>'+
        '<div class="kv"><span><b>= What actually reaches your bank</b></span><b class="g">'+money(payoutAll(DB))+'</b></div>'+
        '<p class="hint" style="margin-top:8px">'+esc(CFG.commNote||'')+'</p>')+
      H.panel('What needs you now <span class="badge">'+iss.length+'</span>',
        iss.length?H.table([{label:'',align:'l',fmt:function(a){return H.tag(a.sev==='high'?'urgent':'watch',a.sev==='high'?'red':'amb');}},
          {label:'What is happening',align:'l',k:'what'},
          {label:'',align:'l',fmt:function(a){return '<button class="btn sm" data-go="'+a.go+'">Open →</button>';}}],iss.slice(0,8))
        :'<div class="cascade">Nothing is late, nothing is mispriced, and nothing is listed that you cannot ship.</div>')+
      '</div>'+
      H.panel('Why one queue instead of seven panels',
        '<p>'+esc(CFG.queueNote||'')+'</p>'+
        '<div class="kv"><span>Marketplaces in one queue</span><b>'+plural((CFG.markets||[]).length,'panel')+' → 1</b></div>'+
        '<div class="kv"><span>Dispatch windows to remember</span><b>'+(CFG.markets||[]).map(function(m){return m.sla+'h';}).join(' · ')+' → the clock does it</b></div>'+
        '<div class="kv"><span>Stock figures to reconcile</span><b>1 — the same one every channel reads</b></div>');
    },
    queue:function(){var DB=db();var q=queue(DB);
      return H.head('One queue · Dispatch','Dispatch queue','Sorted by how little time is left, not by when it arrived. The most urgent order is always at the top.')+
      H.kpis([{l:'To dispatch',v:q.length,d:'across every marketplace',icon:'truck',tone:'teal'},
        {l:'Already late',v:breached(DB).length,d:'past the window',cls:breached(DB).length?'r':'g',icon:'clock',tone:'red'},
        {l:'Within 4 hours',v:atRisk(DB).length,d:'do these next',cls:atRisk(DB).length?'r':'',icon:'bell',tone:'amb'},
        {l:'Value in the queue',v:money(r2(q.reduce(function(s,o){return s+payout(DB,o);},0))),d:'your share of it',icon:'coin',tone:'green'}],'')+
      H.panel('Everything waiting to go out',q.length?H.table([
        {label:'Time left',align:'l',fmt:function(o){var h=hrsLeft(o);
          return h<0?H.tag((-h)+'h LATE','red'):h<=4?H.tag(h+'h left','red')
            :h<=8?H.tag(h+'h left','amb'):H.tag(h+'h left','grn');}},
        {label:'Order',align:'l',fmt:function(o){return '<b>'+esc(o.id)+'</b><div class="hint">'+esc(o.cust||'—')+'</div>';}},
        {label:'Marketplace',align:'l',fmt:function(o){var m=mp(o.market);
          return esc(m?m.name:'?')+'<div class="hint">'+ (m?m.sla:0)+'h window</div>';}},
        {label:'Item',align:'l',fmt:function(o){return esc(o.name)+'<div class="hint">'+o.qty+' × '+money(o.rate)+'</div>';}},
        {label:'Gross',fmt:function(o){return inr(gross(o));},cellcls:'mono'},
        {label:'Their cut',fmt:function(o){return inr(r2(commission(DB,o)+shipFee(DB,o)));},cellcls:'mono r'},
        {label:'You get',fmt:function(o){return inr(payout(DB,o));},cellcls:'mono'},
        {label:'Stage',align:'l',fmt:function(o){var i=stIdx(o.status);
          return H.tag(stLbl(o.status),['teal','blu','amb','peach','grn'][i]||'gray');}},
        {label:'',align:'l',fmt:function(o){var i=orders(DB).indexOf(o);
          return '<button class="btn sm p" data-act="advance" data-i="'+i+'">'+
            esc('Mark '+STAGES[stIdx(o.status)+1].l.toLowerCase())+' →</button> '+
            '<button class="btn sm d" data-act="cancel" data-i="'+i+'">Cancel</button>';}}],q)
        :'<div class="cascade">Nothing waiting. Every order has gone out.</div>')+
      H.note('The queue is sorted by <b>time left</b>, not by order date. A Myntra order placed an hour ago can be more urgent than an Amazon order from yesterday, because the windows are different — and remembering that per panel is exactly what goes wrong at 6pm.')+
      (live(DB).filter(function(o){return !needsDispatch(o);}).length?H.panel('Already out <span class="badge">'+
        live(DB).filter(function(o){return !needsDispatch(o);}).length+'</span>',
        H.table([{label:'Order',align:'l',fmt:function(o){return esc(o.id);}},
          {label:'Marketplace',align:'l',fmt:function(o){return esc((mp(o.market)||{}).name);}},
          {label:'You get',fmt:function(o){return inr(payout(DB,o));},cellcls:'mono'},
          {label:'Dispatched in',fmt:function(o){return o.age+'h';},cellcls:function(o){return 'mono '+(num(o.age)>slaOf(o)?'r':'');}},
          {label:'',align:'l',fmt:function(o){return num(o.age)<=slaOf(o)?H.tag('within window','grn'):H.tag('was late','red');}},
          {label:'Stage',align:'l',fmt:function(o){return H.tag(stLbl(o.status),'grn');}},
          {label:'',align:'l',fmt:function(o){var i=orders(DB).indexOf(o);
            return o.status==='delivered'?'<button class="btn sm" data-act="ret" data-i="'+i+'">Came back</button>':'';}}],
        live(DB).filter(function(o){return !needsDispatch(o);}))):'');
    },
    markets:function(){var DB=db();var ms=byMarket(DB);
      return H.head('Per marketplace · P&amp;L','Marketplace P&amp;L','Which panel is actually worth the work, once the commission and the returns are taken off.')+
      H.kpis([{l:'Marketplaces live',v:ms.filter(function(m){return m.n+m.ret>0;}).length+' / '+ms.length,d:'with orders',icon:'store',tone:'teal'},
        {l:'Best by payout',v:esc((ms[0]||{}).name||'—'),d:money((ms[0]||{}).payout||0),cls:'g',icon:'spark',tone:'green'},
        {l:'Highest cut',v:esc((ms.slice().sort(function(a,b){return b.comm-a.comm;})[0]||{}).name||'—'),
         d:(ms.slice().sort(function(a,b){return b.comm-a.comm;})[0]||{}).comm+'% commission',cls:'r',icon:'pct',tone:'peach'},
        {l:'Worst returns',v:esc((ms.slice().sort(function(a,b){return b.retPct-a.retPct;})[0]||{}).name||'—'),
         d:(ms.slice().sort(function(a,b){return b.retPct-a.retPct;})[0]||{}).retPct+'% came back',cls:'r',icon:'return',tone:'red'}],'')+
      H.panel('Every marketplace, side by side',H.table([
        {label:'Marketplace',align:'l',fmt:function(m){return '<b>'+esc(m.name)+'</b>';}},
        {label:'Commission',fmt:function(m){return m.comm+'%';},cellcls:'mono'},
        {label:'Ship fee',fmt:function(m){return inr(m.ship);},cellcls:'mono'},
        {label:'Window',fmt:function(m){return m.sla+'h';},cellcls:'mono'},
        {label:'Orders',k:'n',cellcls:'mono'},
        {label:'Gross',fmt:function(m){return inr(m.gross);},cellcls:'mono'},
        {label:'You keep',fmt:function(m){return inr(m.payout);},cellcls:'mono'},
        {label:'Keep %',fmt:function(m){return m.keepPct+'%';},cellcls:function(m){return 'mono '+(m.keepPct<80?'r':'');}},
        {label:'Returns',fmt:function(m){return m.retPct+'%';},cellcls:function(m){return 'mono '+(m.retPct>=num(CFG.retAlertPct||12)?'r':'');}},
        {label:'Late',fmt:function(m){return m.breached||'—';},cellcls:function(m){return 'mono '+(m.breached?'r':'');}},
        {label:'',align:'l',fmt:function(m){
          if(m.n+m.ret===0)return H.tag('no orders yet','gray');
          if(m.retPct>=num(CFG.retAlertPct||12))return H.tag('returns are eating it','red');
          if(m.keepPct<80)return H.tag('expensive channel','amb');
          return H.tag('worth the work','grn');}}],ms))+
      H.panel('The comparison nobody makes',
        '<p>'+esc(CFG.plNote||'')+'</p>'+
        '<div class="kv"><span>Gross across every marketplace</span><b>'+money(grossAll(DB))+'</b></div>'+
        '<div class="kv"><span>− Commission and shipping fees</span><b class="r">'+money(feesAll(DB))+'</b></div>'+
        '<div class="kv"><span>= Reaches your bank</span><b class="g">'+money(payoutAll(DB))+'</b></div>'+
        '<div class="kv"><span>Value that came back as returns</span><b class="r">'+money(returnedValue(DB))+'</b></div>'+
        '<p class="hint" style="margin-top:8px">A channel with a 25% commission and a 15% return rate is not a 25% cost — it is closer to 40% once you count the parcels that come back at your expense.</p>');
    },
    listings:function(){var DB=db();var ls=listings(DB);
      return H.head('Per marketplace · Listings','Listing health','One price and one stock number across every panel — or the trouble that follows.')+
      H.kpis([{l:'Items listed',v:ls.length,d:'on '+plural((CFG.markets||[]).length,'marketplace'),icon:'layers',tone:'teal'},
        {l:'Price parity broken',v:parityBroken(DB).length,d:'over '+(CFG.parityPct||5)+'% apart',cls:parityBroken(DB).length?'r':'g',icon:'pct',tone:parityBroken(DB).length?'red':'green'},
        {l:'Out of stock, still listed',v:outOfStock(DB).length,d:'every order is a cancellation',cls:outOfStock(DB).length?'r':'g',icon:'bell',tone:'red'},
        {l:'Thin cover',v:oversellRisk(DB).length,d:'fewer pieces than panels',cls:oversellRisk(DB).length?'r':'',icon:'box',tone:'peach'}],'')+
      H.panel('Every item, on every panel',H.table([
        {label:'Item',align:'l',fmt:function(l){return '<b>'+esc(l.name)+'</b><div class="hint">'+esc(l.sku)+' · list '+money(l.list)+'</div>';}},
        {label:'Stock',fmt:function(l){return l.stock;},cellcls:function(l){return 'mono '+(l.stock<=0?'r':l.stock<l.listedOn?'r':'');}},
        {label:'Lowest',fmt:function(l){return inr(l.lo);},cellcls:'mono'},
        {label:'Highest',fmt:function(l){return inr(l.hi);},cellcls:'mono'},
        {label:'Spread',fmt:function(l){return l.spreadPct+'%';},cellcls:function(l){return 'mono '+(l.spreadPct>num(CFG.parityPct||5)?'r':'');}},
        {label:'',align:'l',fmt:function(l){
          if(l.stock<=0)return H.tag('out of stock — delist','red');
          if(l.spreadPct>num(CFG.parityPct||5))return H.tag('price parity broken','red');
          if(l.stock<l.listedOn)return H.tag('thin cover','amb');
          return H.tag('healthy','grn');}},
        {label:'',align:'l',fmt:function(l){return '<button class="btn sm" data-act="levelup" data-s="'+esc(l.sku)+'">Level the price</button>';}}],ls))+
      ls.map(function(l){return H.panel(esc(l.name)+' <span class="badge">'+plural(l.listedOn,'panel')+'</span>',
        H.table([{label:'Marketplace',align:'l',k:'market'},
          {label:'Price there',fmt:function(r){return inr(r.price);},cellcls:function(r){return 'mono '+(r.price===l.lo&&l.spreadPct>num(CFG.parityPct||5)?'r':'');}},
          {label:'Difference from list',align:'l',fmt:function(r){var d=r2(r.price-l.list);
            return d===0?'<span class="hint">same as list</span>':(d>0?'+':'')+inr(d);}},
          {label:'',align:'l',fmt:function(r){return r.price===l.hi?H.tag('highest','blu'):r.price===l.lo?H.tag('lowest','amb'):'';}}],l.rows)+
        (l.spreadPct>num(CFG.parityPct||5)
          ? '<p class="hint">Spread is <b>'+l.spreadPct+'%</b>. '+esc(CFG.parityNote||'')+'</p>'
          : '<p class="hint">Prices are within '+(CFG.parityPct||5)+'% of each other. Nothing to fix.</p>'));}).join('');
    },
    wiring:function(){var DB=db();
      return H.head('Wiring · Integration','Where every figure comes from','Marketplace OMS owns the queue and the fee arithmetic. Stock and price it shares with every other channel.')+
      H.note('Shared Data Core: Item/SKU · Party · Stock · Ledger/Voucher · Order — every module reads and writes these.')+
      H.panel('Every figure here, and its source',H.table([
        {label:'Figure here',align:'l',k:'f'},{label:'Comes from',align:'l',k:'s'},{label:'How it is worked out',align:'l',k:'h'}],
        CFG.wiring||[]))+
      '<div class="two">'+
      H.panel('Live example — one marketplace order',
        '<div class="cascade">'+
        '<div class="cl"><span class="d">1</span><div>An order arrives from <b>'+esc(((CFG.markets||[])[0]||{}).name||'a marketplace')+'</b>. It joins <b>one queue</b>, not a seventh panel.</div></div>'+
        '<div class="cl"><span class="d">2</span><div>→ Its <b>dispatch clock</b> starts on that marketplace’s own window, and the queue re-sorts itself.</div></div>'+
        '<div class="cl"><span class="d">3</span><div>→ <b>Stock falls</b> on the one shared number, so no other panel can sell the same piece.</div></div>'+
        '<div class="cl"><span class="d">4</span><div>→ The <b>commission and shipping fee</b> are worked out immediately, so you see your share and not the gross.</div></div>'+
        '<div class="cl"><span class="d">5</span><div>→ <b>Dispatched</b> inside the window, or it appears on the Overview as a breach.</div></div>'+
        '<div class="cl"><span class="d">6</span><div>→ If it comes back, the return lands against <b>that marketplace’s</b> rate — which is how the P&amp;L screen stays honest.</div></div>'+
        '</div>')+
      H.panel('The three things this app refuses to let happen',
        '<p><b>1 · An order cannot be dispatched out of nowhere.</b> It moves one stage at a time, so the on-time figure is real rather than back-filled.</p>'+
        '<p><b>2 · Stock is never per-panel.</b> One number. Selling the last piece on Amazon removes it from Flipkart in the same instant.</p>'+
        '<p><b>3 · Gross is never shown as if it were yours.</b> Every screen shows the commission alongside it, because a 25% channel and a 5% channel are not comparable at gross.</p>'+
        '<p class="hint">All three are self-tests, so the app tells you on startup if any of them stops being true.</p>')+
      '</div>';
    }
  },
  actions:{
    advance:function(b){var DB=db();var o=DB.orders[num(b.getAttribute('data-i'))];
      if(!o||!needsDispatch(o))return;
      var i=stIdx(o.status); if(i<0||i>=STAGES.length-1)return;
      if(STAGES[i+1].k==='packed'&&num((DB.stock||{})[o.sku])<0){toast('No stock for that SKU');return;}
      o.status=STAGES[i+1].k;K.save();toast('Marked '+STAGES[i+1].l.toLowerCase());K.render();},
    cancel:function(b){var DB=db();var o=DB.orders[num(b.getAttribute('data-i'))];
      if(!o||!needsDispatch(o)){toast('It has already gone out');return;}
      o.status='cancelled';
      DB.stock[o.sku]=num(DB.stock[o.sku])+num(o.qty);   /* a cancelled order gives the stock back */
      K.save();toast('Cancelled — stock returned');K.render();},
    ret:function(b){var DB=db();var o=DB.orders[num(b.getAttribute('data-i'))];
      if(!o||o.status!=='delivered')return;
      o.status='returned';
      DB.stock[o.sku]=num(DB.stock[o.sku])+num(o.qty);
      K.save();toast('Return recorded against '+(mp(o.market)||{}).name);K.render();},
    levelup:function(b){var DB=db();var sku=b.getAttribute('data-s');var it=item(sku);
      if(!it)return;
      DB.prices=DB.prices||{}; DB.prices[sku]={};
      (CFG.markets||[]).forEach(function(m){DB.prices[sku][m.code]=num(it.rate);});
      K.save();toast('Every panel set to the list price of '+money(it.rate));K.render();}
  },
  tests:function(t,DB){
    /* fees: the whole point of the app */
    t('gross = quantity × rate',orders(DB).every(function(o){return gross(o)===r2(o.qty*o.rate);}));
    t('commission = that marketplace’s percentage of gross',
      orders(DB).every(function(o){return commission(DB,o)===r2(gross(o)*mp(o.market).comm/100);}));
    t('payout = gross − commission − shipping fee',
      orders(DB).every(function(o){return payout(DB,o)===r2(gross(o)-commission(DB,o)-shipFee(DB,o));}));
    t('payout is never more than gross',orders(DB).every(function(o){return payout(DB,o)<=gross(o);}));
    t('what the platforms take = gross − payout',feesAll(DB)===r2(grossAll(DB)-payoutAll(DB)));
    t('two marketplaces with different commission pay differently on the same order',(function(){
      var ms=(CFG.markets||[]); if(ms.length<2)return true;
      var a=ms[0],b2=ms.filter(function(m){return m.comm!==a.comm;})[0]; if(!b2)return true;
      var o1={market:a.code,sku:'x',qty:1,rate:1000},o2={market:b2.code,sku:'x',qty:1,rate:1000};
      return payout(DB,o1)!==payout(DB,o2);})());
    t('every marketplace has a commission, a ship fee and a dispatch window',
      (CFG.markets||[]).every(function(m){return num(m.comm)>=0&&num(m.ship)>=0&&num(m.sla)>0;}));
    /* the clock */
    t('every order belongs to a marketplace that exists',
      orders(DB).every(function(o){return !!mp(o.market);}));
    t('time left = that marketplace’s window minus the order’s age',
      orders(DB).every(function(o){return hrsLeft(o)===slaOf(o)-num(o.age);}));
    t('a breach is an undispatched order past its own window',
      breached(DB).every(function(o){return needsDispatch(o)&&hrsLeft(o)<0;}));
    t('an order already dispatched is never called a breach',
      breached(DB).every(function(o){return stIdx(o.status)<stIdx('dispatched');}));
    t('the at-risk list is only orders with 4 hours or less left',
      atRisk(DB).every(function(o){return hrsLeft(o)>=0&&hrsLeft(o)<=4;}));
    t('the queue is sorted with the least time left first',
      queue(DB).every(function(o,i){return i===0||hrsLeft(queue(DB)[i-1])<=hrsLeft(o);}));
    t('the queue holds every order still to dispatch',queue(DB).length===live(DB).filter(needsDispatch).length);
    t('a marketplace with a shorter window can outrank an older order',(function(){
      var q=queue(DB); if(q.length<2)return true;
      return q.every(function(o,i){return i===0||hrsLeft(q[i-1])<=hrsLeft(o);});})());
    /* stage discipline */
    t('every live order sits in a real stage',live(DB).every(function(o){return stIdx(o.status)>=0;}));
    t('a cancelled or returned order is in no total',
      grossAll(DB)===r2(live(DB).reduce(function(s,o){return s+gross(o);},0)));
    t('cancelling an order gives the stock back',(function(){
      var o=live(DB).filter(needsDispatch)[0]; if(!o)return true;
      var was=num(DB.stock[o.sku]);
      o.status='cancelled'; DB.stock[o.sku]=was+num(o.qty);
      var ok=num(DB.stock[o.sku])===was+num(o.qty);
      DB.stock[o.sku]=was; o.status='new'; return ok;})());
    t('a return is recorded against the marketplace it came from',
      returned(DB).every(function(o){return !!mp(o.market);}));
    /* per marketplace */
    t('marketplace grosses add up to the whole gross',
      r2(byMarket(DB).reduce(function(s,m){return s+m.gross;},0))===grossAll(DB));
    t('marketplace payouts add up to the whole payout',
      r2(byMarket(DB).reduce(function(s,m){return s+m.payout;},0))===payoutAll(DB));
    t('every live order is counted once across the marketplaces',
      byMarket(DB).reduce(function(s,m){return s+m.n;},0)===live(DB).length);
    t('keep % = payout ÷ gross for that marketplace',
      byMarket(DB).filter(function(m){return m.gross;}).every(function(m){
        return m.keepPct===Math.round(m.payout/m.gross*100);}));
    t('a marketplace with no orders shows nothing rather than a false zero-percent',
      byMarket(DB).filter(function(m){return m.n+m.ret===0;}).every(function(m){return m.gross===0;}));
    /* listings */
    t('every item is listed on every marketplace',
      listings(DB).every(function(l){return l.listedOn===(CFG.markets||[]).length;}));
    t('the spread is the highest price minus the lowest',
      listings(DB).every(function(l){return l.spread===r2(l.hi-l.lo);}));
    t('parity is only called broken above the '+(CFG.parityPct||5)+'% line',
      parityBroken(DB).every(function(l){return l.spreadPct>num(CFG.parityPct||5);}));
    t('levelling a price puts every panel on the list price',(function(){
      var it=(CFG.items||[])[0];
      var was=JSON.parse(JSON.stringify(DB.prices||{}));
      DB.prices=DB.prices||{}; DB.prices[it.sku]={};
      (CFG.markets||[]).forEach(function(m){DB.prices[it.sku][m.code]=num(it.rate);});
      var l=listings(DB).filter(function(x){return x.sku===it.sku;})[0];
      var ok=l.spreadPct===0&&l.lo===num(it.rate);
      DB.prices=was; return ok;})());
    t('an out-of-stock item still listed is raised as urgent',
      outOfStock(DB).every(function(l){return issues(DB).some(function(i){
        return i.sev==='high'&&i.what.indexOf(l.name)===0;});}));
    t('stock is one number per item, not one per marketplace',
      listings(DB).every(function(l){return typeof l.stock==='number';}));
  }
};

if(typeof module!=='undefined'&&module.exports)module.exports=SPEC;
if(typeof Medhava!=='undefined'&&Medhava.app)Medhava.app(SPEC);

})();</script>
