# app.medhava.com — the Node app (app/server/index.js, port 3000).
#
# The app has its own password gate (APP_PASSWORD). This block adds TLS, sane headers and a
# body-size limit; it deliberately does NOT add a second password, because two prompts train
# people to click through both.

server {
    listen 80;
    listen [::]:80;
    server_name app.medhava.com;

    # File uploads go through here (multer). Raise deliberately rather than leaving nginx's
    # 1 MB default to produce a confusing 413 on the first real upload.
    client_max_body_size 64M;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Video rendering and AI calls are slow. The default 60s read timeout cuts them off
        # mid-request and the browser shows a bare 504.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
