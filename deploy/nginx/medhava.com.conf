# medhava.com — the marketing site. A single self-contained HTML file, served static.
#
# certbot rewrites this file when it installs the certificate, adding the listen 443 block
# and the redirect. Run `certbot --nginx -d medhava.com -d www.medhava.com` and let it.

server {
    listen 80;
    listen [::]:80;
    server_name medhava.com www.medhava.com;

    root /var/www/medhava;
    index index.html;

    # The page is one file with everything inlined, so it is large and highly compressible.
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Nothing here is user-generated, so it can be cached hard — but not index.html, or a
    # republish would not reach anyone who had already visited.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    access_log /var/log/nginx/medhava.access.log;
    error_log  /var/log/nginx/medhava.error.log;
}
