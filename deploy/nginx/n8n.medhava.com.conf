# n8n.medhava.com — self-hosted automation.
#
# n8n has its own owner account. This block terminates TLS and proxies websockets, which the
# editor needs; without the Upgrade headers the canvas connects and then silently stops
# updating, which looks like n8n being broken rather than a proxy being incomplete.

server {
    listen 80;
    listen [::]:80;
    server_name n8n.medhava.com;

    client_max_body_size 32M;

    location / {
        proxy_pass         http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
